# .github/workflows/build-npm-cache.yml
#
# DEVELOPMENT/TRANSITION CACHE BUILD - MINIMAL PACKUMENTS STRATEGY
#
# Phase 1: Generate package-lock.json files and approve required lifecycle scripts
# Phase 2: Rebuild the npm cache using the generated package-lock.json files
#
# This workflow intentionally does NOT create a release, tag, or tarball.
# It commits the generated package-lock.json files and associated package.json
# metadata directly to the repository.
#
# KEY: Match NODE_ENV and flags used by actual build scripts
# KEY: Use THREE flags in Phase 2 to prevent MOST packument fetching:
#      --legacy-peer-deps (skip peer dependency resolution)
#      --no-audit (skip vulnerability audits)
#      --no-fund (skip funding info checks)
# KEY: Building on Linux for FreeBSD requires --os freebsd flag
# KEY: Building on x64 for FreeBSD requires --cpu x64 flag
#
# Package-lock files are captured using their source-relative paths:
#
#   package-locks/<source-relative-directory>/package-lock.json
#
# The captured package.json files are also committed where they contain
# generated/approved metadata required by the FreeBSD npm12 consumer,
# particularly the npm12 allowScripts policy.
#
# PKG-FETCH NODE VERSION HANDLING:
#
#   FREEBSD_NODE_VER
#       |
#       +--== PUBLISHED_NODE_VER --> use published pkg-fetch patch
#       |
#       +--!= PUBLISHED_NODE_VER --> fetch pkg-fetch HEAD
#                                      |
#                                      +-- verify exact FREEBSD_NODE_VER patch
#                                      +-- replace patches.json
#                                      +-- add node.vFREEBSD_NODE_VER.cpp.patch
#
# The FreeBSD patches are then appended to the selected pkg-fetch patch and
# patch-package generates ONE final patch:
#
#   extra-patch-pkg-fetch_patches_node.vFREEBSD_NODE_VER.patch
#
# This single patch transforms the released @yao-pkg/pkg-fetch package into
# the exact pkg-fetch patch set needed by the FreeBSD node port.
#
# The pkg-fetch HEAD SHA is recorded in build-info.txt so the generated cache
# can always be traced back to the exact upstream pkg-fetch source used.

name: Build npm Cache (Development/Transition)

on:
  workflow_dispatch:
    inputs:
      ds_version:
        description: 'DISTVERSION (e.g. 9.1.0)'
        required: true
        default: '9.4.0'
      ds_build:
        description: 'DS_BUILD number (e.g. 177)'
        required: true
        default: '129'
      node_major:
        description: 'Node.js major version (e.g. 24)'
        required: true
        default: '24'
      npm_version:
        description: 'npm version used in the jail (must match www/npm-nodeXX exactly)'
        required: true
        default: '12.0.2'
      yao_pkg_ver:
        description: '@yao-pkg/pkg version (e.g. 6.22.0)'
        required: true
        default: '6.22.0'

env:
  DS_TAG:      "v${{ github.event.inputs.ds_version }}.${{ github.event.inputs.ds_build }}"
  NODE_MAJOR:  "${{ github.event.inputs.node_major }}"
  NPM_VER:     "${{ github.event.inputs.npm_version }}"
  YAO_PKG_VER: "${{ github.event.inputs.yao_pkg_ver }}"
  NPM_CACHE:   "${{ github.workspace }}/npm-cache"
  TEMP_CACHE:  "${{ github.workspace }}/temp-cache"

jobs:
  build-cache:
    name: Build npm Cache
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 90

    steps:

      # ================================================================
      # BOOTSTRAP NODE
      # ================================================================

      # Bootstrap with any Node in the requested major so we have npm
      # available to install @yao-pkg/pkg and inspect its dependency tree.
      - name: Bootstrap Node.js ${{ github.event.inputs.node_major }}.x
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_MAJOR }}.x

      # ================================================================
      # CHECKOUT CACHE REPOSITORY
      # ================================================================

      - name: Checkout cache repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      # ================================================================
      # CLONE FREEBSD PORTS
      # ================================================================

      # The FreeBSD port is authoritative for the exact Node version that
      # this cache is intended to support.
      - name: Clone FreeBSD ports tree
        run: |
          set -e

          echo "--- Cloning FreeBSD ports tree ---"

          git clone --depth 1 \
            https://github.com/freebsd/freebsd-ports.git \
            "${GITHUB_WORKSPACE}/freebsd-ports"

          NODE_PORT_DIR="${GITHUB_WORKSPACE}/freebsd-ports/www/node${NODE_MAJOR}"
          NODE_VERSION_FILE="${NODE_PORT_DIR}/Makefile.version"

          if [ ! -f "${NODE_VERSION_FILE}" ]; then
            echo "ERROR: Cannot find:"
            echo "  ${NODE_VERSION_FILE}"
            exit 1
          fi

          FREEBSD_NODE_VER=$(
            sed -n \
              's/^NODEJS_PORTVERSION[[:space:]]*=[[:space:]]*//p' \
              "${NODE_VERSION_FILE}" |
            head -1
          )

          if [ -z "${FREEBSD_NODE_VER}" ]; then
            echo "ERROR: Could not determine NODEJS_PORTVERSION from:"
            echo
            echo "  ${NODE_VERSION_FILE}"
            echo
            echo "Contents:"
            cat "${NODE_VERSION_FILE}"
            exit 1
          fi

          case "${FREEBSD_NODE_VER}" in
            ${NODE_MAJOR}.*)
              ;;
            *)
              echo "ERROR: FreeBSD node${NODE_MAJOR} reports unexpected version:"
              echo "  ${FREEBSD_NODE_VER}"
              exit 1
              ;;
          esac

          echo "FREEBSD_NODE_VER=${FREEBSD_NODE_VER}" >> "${GITHUB_ENV}"

          echo "FreeBSD node${NODE_MAJOR}: ${FREEBSD_NODE_VER}"
          echo "  Makefile.version: ${NODE_VERSION_FILE}"

      # ================================================================
      # RESOLVE PUBLISHED PKG-FETCH VERSION
      # ================================================================

      # Install the requested released @yao-pkg/pkg into a temporary probe
      # directory. The exact Node version represented by the released
      # pkg-fetch is determined from its node.vX.Y.Z.cpp.patch filenames.
      #
      # This version is deliberately NOT assumed to be the FreeBSD version.
      # If it differs, pkg-fetch HEAD will provide the target patch.
      - name: Resolve published pkg-fetch version
        id: pkg_meta
        run: |
          set -e

          echo "========================================"
          echo "RESOLVING PUBLISHED PKG-FETCH"
          echo "========================================"

          rm -rf /tmp/ver-probe
          mkdir -p /tmp/ver-probe/ver-cache

          npm install \
            --prefix /tmp/ver-probe \
            --cache /tmp/ver-probe/ver-cache \
            --ignore-scripts \
            "@yao-pkg/pkg@${YAO_PKG_VER}"

          PKG_DIR="/tmp/ver-probe/node_modules/@yao-pkg/pkg-fetch"
          PATCH_DIR="${PKG_DIR}/patches"

          if [ ! -d "${PATCH_DIR}" ]; then
            echo "ERROR: Installed pkg-fetch has no patches directory:"
            echo "  ${PATCH_DIR}"
            exit 1
          fi

          PUBLISHED_NODE_VER=$(
            find "${PATCH_DIR}" \
              -maxdepth 1 \
              -type f \
              -name 'node.v*.cpp.patch' \
              -printf '%f\n' |
            sed -n 's/^node\.v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)\.cpp\.patch$/\1/p' |
            grep "^${NODE_MAJOR}\." |
            sort -V |
            tail -1
          )

          if [ -z "${PUBLISHED_NODE_VER}" ]; then
            echo "ERROR: Published pkg-fetch does not contain a Node ${NODE_MAJOR}.x patch."
            echo
            echo "Available patches:"
            find "${PATCH_DIR}" \
              -maxdepth 1 \
              -type f \
              -name 'node.v*.cpp.patch' \
              -printf '  %f\n' |
            sort -V
            exit 1
          fi

          PKG_FETCH_VER=$(
            node -e "
              const p = require('/tmp/ver-probe/node_modules/@yao-pkg/pkg/package.json');
              const d = p.dependencies['@yao-pkg/pkg-fetch'];
              if (!d) process.exit(1);
              console.log(d.replace(/^[\\^~]/, ''));
            "
          )

          if [ -z "${PKG_FETCH_VER}" ]; then
            echo "ERROR: Could not determine @yao-pkg/pkg-fetch version."
            exit 1
          fi

          PUBLISHED_PATCH="${PATCH_DIR}/node.v${PUBLISHED_NODE_VER}.cpp.patch"

          if [ ! -f "${PUBLISHED_PATCH}" ]; then
            echo "ERROR: Expected published patch does not exist:"
            echo "  ${PUBLISHED_PATCH}"
            exit 1
          fi

          echo "PUBLISHED_NODE_VER=${PUBLISHED_NODE_VER}" >> "${GITHUB_ENV}"
          echo "PKG_FETCH_VER=${PKG_FETCH_VER}" >> "${GITHUB_ENV}"

          echo "Published versions:"
          echo "  @yao-pkg/pkg:       ${YAO_PKG_VER}"
          echo "  @yao-pkg/pkg-fetch: ${PKG_FETCH_VER}"
          echo "  Node patch:         ${PUBLISHED_NODE_VER}"
          echo
          echo "Target versions:"
          echo "  FreeBSD node${NODE_MAJOR}: ${FREEBSD_NODE_VER}"

          rm -rf /tmp/ver-probe

      # ================================================================
      # INSTALL EXACT TARGET NODE
      # ================================================================

      # The actual cache generation should run under the exact Node version
      # used by the FreeBSD port, not necessarily the Node version currently
      # published by pkg-fetch.
      - name: Install Node.js ${{ env.FREEBSD_NODE_VER }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.FREEBSD_NODE_VER }}

      # ================================================================
      # INSTALL JAIL-MATCHED NPM
      # ================================================================

      - name: Install npm@${{ env.NPM_VER }} to match jail
        run: |
          set -e

          mkdir -p ~/.npm-global
          npm config set prefix ~/.npm-global
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

          npm install -g "npm@${NPM_VER}"

      - name: Verify Node and npm versions
        run: |
          set -e

          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"

          EXPECTED_NODE="v${FREEBSD_NODE_VER}"
          ACTUAL_NODE="$(node --version)"
          ACTUAL_NPM="$(npm --version)"

          if [ "${ACTUAL_NODE}" != "${EXPECTED_NODE}" ]; then
            echo "ERROR: Node version mismatch."
            echo "  Expected: ${EXPECTED_NODE}"
            echo "  Actual:   ${ACTUAL_NODE}"
            exit 1
          fi

          if [ "${ACTUAL_NPM}" != "${NPM_VER}" ]; then
            echo "ERROR: npm version mismatch."
            echo "  Expected: ${NPM_VER}"
            echo "  Actual:   ${ACTUAL_NPM}"
            exit 1
          fi

      # ================================================================
      # CLONE ONLYOFFICE SOURCES
      # ================================================================

      - name: Clone source repositories
        run: |
          set -e

          echo "Building cache for DS_TAG=${DS_TAG}"

          for repo in \
            web-apps \
            server \
            sdkjs \
            document-server-integration \
            document-server-package
          do
            git clone \
              --depth 1 \
              --branch "${DS_TAG}" \
              --single-branch \
              "https://github.com/ONLYOFFICE/${repo}.git" \
              "src/${repo}"
          done

          echo "=== web-apps    ==="
          git -C src/web-apps describe --tags

          echo "=== server      ==="
          git -C src/server describe --tags

          echo "=== sdkjs       ==="
          git -C src/sdkjs describe --tags

          echo "=== integration ==="
          git -C src/document-server-integration describe --tags

          echo "=== ds-package  ==="
          git -C src/document-server-package describe --tags

      # ================================================================
      # CREATE SOURCE PACKAGE PATCHES
      # ================================================================

      - name: Create patches
        run: |
          set -e

          echo "--- Creating patches for version ${DS_TAG} ---"

          mkdir -p patches

          # server/package.json patch
          cat > patches/patch-server_package.json << 'PATCH_EOF'
          --- server/package.json.orig  2026-02-23 07:24:11 UTC
          +++ server/package.json
          @@ -4,9 +4,11 @@
             "homepage": "https://www.onlyoffice.com",
             "private": true,
             "dependencies": {
          +    "grunt": "^1.6.2",
          +    "grunt-cli": "^1.5.0",
               "license-downloader": "1.0.8",
               "license-report": "6.5.0",
          -    "npm-run-all": "4.1.5"
          +    "concurrently": "^10.0.0"
             },
             "devDependencies": {
               "@eslint/compat": "1.2.3",
          PATCH_EOF

          # server/DocService patch
          cat > patches/patch-server_DocService_package.json << 'PATCH_EOF'
          --- server/DocService/package.json.orig       2026-02-23 07:24:11 UTC
          +++ server/DocService/package.json
          @@ -28,7 +28,8 @@
               "mime-db": "1.53.0",
               "ms": "2.1.3",
               "mssql": "11.0.1",
          -    "multer": "1.4.4",
          +    "multer": "2.1.1",
          +    "patch-package": "^8.0.0",
               "multi-integer-range": "5.2.0",
               "multiparty": "4.2.3",
               "mysql2": "3.13.0",
          PATCH_EOF

          # server/Metrics patch
          cat > patches/patch-server_Metrics_package.json << 'PATCH_EOF'
          --- server/Metrics/package.json.orig    2026-02-24 18:13:24 UTC
          +++ server/Metrics/package.json
          @@ -5,6 +5,7 @@
             "private": true,
             "bin": "node_modules/statsd/bin/statsd",
             "dependencies": {
          +    "patch-package": "^8.0.0",
               "statsd": "0.9.0"
             },
             "pkg": {
          PATCH_EOF


          # web-apps/build patch
          cat > patches/patch-web-apps_build_package.json << 'PATCH_EOF'
          --- web-apps/build/package.json.orig	2026-02-23 07:24:11 UTC
          +++ web-apps/build/package.json
          @@ -6,7 +6,7 @@
             "dependencies": {
               "@babel/core": "^7.25.2",
               "@babel/preset-env": "^7.25.3",
          -    "grunt": "^1.6.1",
          +    "grunt": "^1.6.2",
               "grunt-babel": "^8.0.0",
               "grunt-contrib-clean": "^2.0.1",
               "grunt-contrib-concat": "^2.0.0",
          @@ -29,6 +29,8 @@
               "iconv-lite": "^0.6.3",
               "less-plugin-clean-css": "1.5.1",
               "lodash": "^4.17.21",
          +    "optipng-bin": "^5.1.0",
          +    "patch-package": "^8.0.0",
               "terser": "^5.20.0",
               "vinyl-fs": "^4.0.0"
               },
          @@ -44,8 +46,9 @@
               }
             },
             "devDependencies": {
          -    "chai": "^5.1.0",
          -    "grunt-mocha": "^1.2.0",
          -    "mocha": "^10.2.0"
          +    "chai": "^6.2.0"
          +  },
          +  "scripts": {
          +    "postinstall": "patch-package"
             }
           }
          PATCH_EOF

      # ================================================================
      # PKG-FETCH PATCH GENERATION
      # ================================================================

      - name: Generate pkg-fetch FreeBSD patch
        run: |
          set -e

          echo "========================================"
          echo "GENERATING PKG-FETCH PATCH"
          echo "========================================"

          PATCH_WORKSPACE="${GITHUB_WORKSPACE}/patch-workspace"
          rm -rf "${PATCH_WORKSPACE}"
          mkdir -p "${PATCH_WORKSPACE}"

          cd "${PATCH_WORKSPACE}"

          echo "--- Installing published @yao-pkg/pkg ---"

          npm install \
            --cache "${NPM_CACHE}" \
            --ignore-scripts \
            patch-package \
            "@yao-pkg/pkg@${YAO_PKG_VER}"

          PKG_FETCH_DIR="${PATCH_WORKSPACE}/node_modules/@yao-pkg/pkg-fetch"
          PUBLISHED_PATCH_DIR="${PKG_FETCH_DIR}/patches"

          if [ ! -d "${PUBLISHED_PATCH_DIR}" ]; then
            echo "ERROR: Installed pkg-fetch has no patches directory:"
            echo "  ${PUBLISHED_PATCH_DIR}"
            exit 1
          fi

          PUBLISHED_PATCH="${PUBLISHED_PATCH_DIR}/node.v${PUBLISHED_NODE_VER}.cpp.patch"

          if [ ! -f "${PUBLISHED_PATCH}" ]; then
            echo "ERROR: Published pkg-fetch does not contain:"
            echo "  node.v${PUBLISHED_NODE_VER}.cpp.patch"
            exit 1
          fi

          echo
          echo "Version comparison:"
          echo "  FreeBSD target:       ${FREEBSD_NODE_VER}"
          echo "  Published pkg-fetch: ${PUBLISHED_NODE_VER}"
          echo "  pkg-fetch version:    ${PKG_FETCH_VER}"

          # ------------------------------------------------------------
          # Obtain the target pkg-fetch patch.
          #
          # If the released pkg-fetch already supports the exact FreeBSD
          # Node version, use its patch directly.
          #
          # Otherwise, obtain pkg-fetch HEAD and require it to contain
          # an exact patch for FREEBSD_NODE_VER.
          # ------------------------------------------------------------

          if [ "${PUBLISHED_NODE_VER}" = "${FREEBSD_NODE_VER}" ]; then

            echo
            echo "Published pkg-fetch already supports the FreeBSD Node version."
            echo "No pkg-fetch leapfrog is required."

            PKG_FETCH_LEAPFROG="no"
            PKG_FETCH_BASELINE="published"
            PKG_FETCH_HEAD_SHA=""

            TARGET_PATCH="${PUBLISHED_PATCH}"

          else

            echo
            echo "Published pkg-fetch does not support the FreeBSD Node version."
            echo "Fetching pkg-fetch HEAD for the exact target patch."

            PKG_FETCH_HEAD_DIR="${GITHUB_WORKSPACE}/pkg-fetch-head"

            rm -rf "${PKG_FETCH_HEAD_DIR}"

            git clone \
              --depth 1 \
              https://github.com/yao-pkg/pkg-fetch.git \
              "${PKG_FETCH_HEAD_DIR}"

            PKG_FETCH_HEAD_SHA=$(
              git -C "${PKG_FETCH_HEAD_DIR}" rev-parse HEAD
            )

            HEAD_PATCHES_JSON="${PKG_FETCH_HEAD_DIR}/patches/patches.json"
            HEAD_TARGET_PATCH="${PKG_FETCH_HEAD_DIR}/patches/node.v${FREEBSD_NODE_VER}.cpp.patch"

            if [ ! -f "${HEAD_PATCHES_JSON}" ]; then
              echo "ERROR: pkg-fetch HEAD has no patches.json:"
              echo "  ${HEAD_PATCHES_JSON}"
              exit 1
            fi

            if [ ! -f "${HEAD_TARGET_PATCH}" ]; then
              echo "ERROR: pkg-fetch HEAD does not contain an exact patch for:"
              echo "  Node ${FREEBSD_NODE_VER}"
              echo
              echo "Expected:"
              echo "  ${HEAD_TARGET_PATCH}"
              echo
              echo "Available Node ${NODE_MAJOR}.x patches:"
              find "${PKG_FETCH_HEAD_DIR}/patches" \
                -maxdepth 1 \
                -type f \
                -name "node.v${NODE_MAJOR}.*.cpp.patch" \
                -printf '  %f\n' |
              sort -V
              exit 1
            fi

            # Verify that patches.json actually maps the target version to
            # the exact target patch. Do not merely rely on the filename.
            node - "${HEAD_PATCHES_JSON}" "${FREEBSD_NODE_VER}" <<'NODE_EOF'
          const fs = require('fs');

          const patchesFile = process.argv[2];
          const nodeVersion = process.argv[3];

          const data = JSON.parse(fs.readFileSync(patchesFile, 'utf8'));
          const key = `v${nodeVersion}`;
          const expected = `node.v${nodeVersion}.cpp.patch`;

          if (!Object.prototype.hasOwnProperty.call(data, key)) {
            console.error(`ERROR: patches.json has no entry for ${key}`);
            process.exit(1);
          }

          const value = data[key];

          if (!Array.isArray(value) || !value.includes(expected)) {
            console.error(`ERROR: patches.json entry for ${key} does not contain ${expected}`);
            console.error(`Actual entry: ${JSON.stringify(value)}`);
            process.exit(1);
          }

          console.log(`Verified patches.json: ${key} -> ${expected}`);
          NODE_EOF

            echo
            echo "pkg-fetch HEAD:"
            echo "  SHA: ${PKG_FETCH_HEAD_SHA}"
            echo "  Node patch: node.v${FREEBSD_NODE_VER}.cpp.patch"

            # Replace patches.json with the HEAD version and install the
            # exact target patch from HEAD into the released pkg-fetch tree.
            #
            # The old published Node patch is deliberately retained. The
            # modified patches.json selects the target patch.
            cp \
              "${HEAD_PATCHES_JSON}" \
              "${PUBLISHED_PATCH_DIR}/patches.json"

            cp \
              "${HEAD_TARGET_PATCH}" \
              "${PUBLISHED_PATCH_DIR}/node.v${FREEBSD_NODE_VER}.cpp.patch"

            PKG_FETCH_LEAPFROG="yes"
            PKG_FETCH_BASELINE="pkg-fetch-head"

            TARGET_PATCH="${PUBLISHED_PATCH_DIR}/node.v${FREEBSD_NODE_VER}.cpp.patch"

          fi

          # ------------------------------------------------------------
          # Copy FreeBSD Node patches.
          # ------------------------------------------------------------

          FREEBSD_PATCH_DIR="${PATCH_WORKSPACE}/freebsd-patches"
          mkdir -p "${FREEBSD_PATCH_DIR}"

          NODE_PORT_DIR="${GITHUB_WORKSPACE}/freebsd-ports/www/node${NODE_MAJOR}"
          NODE_PORT_FILES="${NODE_PORT_DIR}/files"

          if [ ! -d "${NODE_PORT_FILES}" ]; then
            echo "ERROR: FreeBSD node${NODE_MAJOR} port has no files directory:"
            echo "  ${NODE_PORT_FILES}"
            exit 1
          fi

          find "${NODE_PORT_FILES}" \
            -maxdepth 1 \
            -type f \
            -name 'patch-*' \
            -exec cp {} "${FREEBSD_PATCH_DIR}/" \;

          FREEBSD_PATCH_COUNT=$(
            find "${FREEBSD_PATCH_DIR}" \
              -maxdepth 1 \
              -type f \
              -name 'patch-*' |
            wc -l
          )

          if [ "${FREEBSD_PATCH_COUNT}" -eq 0 ]; then
            echo "ERROR: No FreeBSD Node patches were found in:"
            echo "  ${NODE_PORT_FILES}"
            exit 1
          fi

          echo
          echo "FreeBSD patches:"
          find "${FREEBSD_PATCH_DIR}" \
            -maxdepth 1 \
            -type f \
            -name 'patch-*' \
            -printf '  %f\n' |
          sort

          echo
          echo "FreeBSD patch count: ${FREEBSD_PATCH_COUNT}"

          # ------------------------------------------------------------
          # Build the final Node patch.
          #
          # pkg-fetch patches are patch files against a Node source tree.
          # FreeBSD's node port patches use the same source-tree path
          # convention. Prefixing their ---/+++ paths with "node/" allows
          # their hunks to be appended directly to the pkg-fetch patch.
          # ------------------------------------------------------------

          FINAL_PATCH="${TARGET_PATCH}.freebsd"

          cp "${TARGET_PATCH}" "${FINAL_PATCH}"

          for patch_file in \
            "${FREEBSD_PATCH_DIR}"/patch-*
          do
            if [ ! -f "${patch_file}" ]; then
              continue
            fi

            sed \
              's#^--- #--- node/#g; s#^+++ #+++ node/#g' \
              "${patch_file}" >> "${FINAL_PATCH}"
          done

          mv "${FINAL_PATCH}" "${TARGET_PATCH}"

          # ------------------------------------------------------------
          # Generate one patch-package patch containing ALL changes:
          #
          #   1. patches.json replacement, if leapfrogging
          #   2. target Node patch addition, if leapfrogging
          #   3. FreeBSD patches appended to target Node patch
          #
          # This intentionally avoids generating a separate leapfrog patch.
          # The FreeBSD port therefore needs only one extra-patch file.
          # ------------------------------------------------------------

          echo
          echo "--- Running patch-package ---"

          rm -rf patches

          echo "--- Running patch-package ---"
          npm_config_allow_remote=all npx patch-package "@yao-pkg/pkg-fetch"

          PATCH_FILE=$(
            find patches \
              -maxdepth 1 \
              -type f \
              -name '@yao-pkg+pkg-fetch+*.patch' \
              -print |
            sort |
            head -1
          )

          if [ -z "${PATCH_FILE}" ] || [ ! -f "${PATCH_FILE}" ]; then
            echo "ERROR: patch-package did not produce a pkg-fetch patch."
            echo
            echo "Generated patches directory:"
            find patches -maxdepth 2 -type f -print 2>/dev/null || true
            exit 1
          fi

          FINAL_EXTRA_PATCH="${GITHUB_WORKSPACE}/extra-patch-pkg-fetch_patches_node.v${FREEBSD_NODE_VER}.patch"

          # Convert patch-package's node_modules paths to the path used
          # by the ONLYOFFICE yao-pkg source tree.
          #
          # Remove git-only diff/index lines because FreeBSD's patch(1)
          # does not need them.
          {
            grep -v '^diff --git ' "${PATCH_FILE}" |
            grep -v '^index ' |
            sed \
              's#^--- a/node_modules#--- yao-pkg/node_modules#g; s#^+++ b/node_modules#+++ yao-pkg/node_modules#g'
          } > "${FINAL_EXTRA_PATCH}"

          if [ ! -s "${FINAL_EXTRA_PATCH}" ]; then
            echo "ERROR: Generated FreeBSD pkg-fetch patch is empty."
            exit 1
          fi

          echo
          echo "Generated:"
          echo "  ${FINAL_EXTRA_PATCH}"

          # ------------------------------------------------------------
          # Verify the generated patch's target Node patch content.
          # ------------------------------------------------------------

          GENERATED_TARGET_PATCH="${PKG_FETCH_DIR}/patches/node.v${FREEBSD_NODE_VER}.cpp.patch"

          if [ ! -f "${GENERATED_TARGET_PATCH}" ]; then
            echo "ERROR: Final pkg-fetch tree does not contain:"
            echo "  ${GENERATED_TARGET_PATCH}"
            exit 1
          fi

          # ------------------------------------------------------------
          # Record metadata for the release tarball and later validation.
          # ------------------------------------------------------------

          {
            echo "FREEBSD_NODE_VER=${FREEBSD_NODE_VER}"
            echo "PUBLISHED_NODE_VER=${PUBLISHED_NODE_VER}"
            echo "PKG_FETCH_BASELINE=${PKG_FETCH_BASELINE}"
            echo "PKG_FETCH_LEAPFROG=${PKG_FETCH_LEAPFROG}"
            echo "PKG_FETCH_VER=${PKG_FETCH_VER}"
            echo "PKG_FETCH_HEAD_SHA=${PKG_FETCH_HEAD_SHA}"
            echo "FREEBSD_PATCH_COUNT=${FREEBSD_PATCH_COUNT}"
          } > "${GITHUB_WORKSPACE}/pkg-fetch-build-info.txt"

          echo
          echo "========================================"
          echo "PKG-FETCH PATCH GENERATION COMPLETE"
          echo "========================================"
          echo "FreeBSD Node:       ${FREEBSD_NODE_VER}"
          echo "Published Node:     ${PUBLISHED_NODE_VER}"
          echo "pkg-fetch version:  ${PKG_FETCH_VER}"
          echo "Baseline:           ${PKG_FETCH_BASELINE}"
          echo "Leapfrog:           ${PKG_FETCH_LEAPFROG}"
          echo "pkg-fetch HEAD SHA: ${PKG_FETCH_HEAD_SHA:-N/A}"
          echo "FreeBSD patches:    ${FREEBSD_PATCH_COUNT}"

      # ================================================================
      # VERIFY FINAL PKG-FETCH PATCH AGAINST NODE SOURCE
      # ================================================================

      - name: Verify pkg-fetch patch against Node source
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING PKG-FETCH PATCH"
          echo "========================================"

          VERIFY_DIR="${GITHUB_WORKSPACE}/node-patch-verify"

          rm -rf "${VERIFY_DIR}"
          mkdir -p "${VERIFY_DIR}"

          cd "${VERIFY_DIR}"

          NODE_TARBALL="node-v${FREEBSD_NODE_VER}.tar.gz"
          NODE_URL="https://nodejs.org/dist/v${FREEBSD_NODE_VER}/${NODE_TARBALL}"

          echo "Downloading:"
          echo "  ${NODE_URL}"

          curl \
            --fail \
            --location \
            --retry 3 \
            --silent \
            --show-error \
            -o "${NODE_TARBALL}" \
            "${NODE_URL}"

          tar -xzf "${NODE_TARBALL}"

          NODE_SOURCE_DIR="${VERIFY_DIR}/node-v${FREEBSD_NODE_VER}"

          if [ ! -d "${NODE_SOURCE_DIR}" ]; then
            echo "ERROR: Node source directory was not created:"
            echo "  ${NODE_SOURCE_DIR}"
            exit 1
          fi

          TARGET_PATCH="${GITHUB_WORKSPACE}/patch-workspace/node_modules/@yao-pkg/pkg-fetch/patches/node.v${FREEBSD_NODE_VER}.cpp.patch"

          if [ ! -f "${TARGET_PATCH}" ]; then
            echo "ERROR: Cannot find final target patch:"
            echo "  ${TARGET_PATCH}"
            exit 1
          fi

          echo
          echo "Running patch --dry-run..."

          cd "${NODE_SOURCE_DIR}"

          patch \
            --dry-run \
            -p1 \
            < "${TARGET_PATCH}"

          echo
          echo "Final pkg-fetch patch applies cleanly to Node ${FREEBSD_NODE_VER}."

      # ================================================================
      # PHASE 1: GENERATE PACKAGE-LOCK FILES
      # ================================================================

      - name: Phase 1 - Production mode installations (1-5)
        run: |
          set -e

          echo "========================================"
          echo "PHASE 1: GENERATE PACKAGE-LOCK FILES"
          echo "========================================"

          mkdir -p "${TEMP_CACHE}"

          echo "GROUP A: Production mode installations"

          # 1. sdkjs/build
          echo "1. sdkjs/build (production mode)..."
          NODE_ENV=production npm install \
            --os freebsd \
            --cpu x64 \
            --cache "${TEMP_CACHE}" \
            --lockfile-version 3 \
            --ignore-scripts \
            --prefix src/sdkjs/build

          # 2. framework7-react
          echo "2. framework7-react (production mode + --include=dev)..."
          NODE_ENV=production npm install \
            --os freebsd \
            --cpu x64 \
            --cache "${TEMP_CACHE}" \
            --lockfile-version 3 \
            --ignore-scripts \
            --include=dev \
            --prefix src/web-apps/vendor/framework7-react

          # 3. server/Metrics
          echo "3. server/Metrics (production mode, patched)..."

          rm -f \
            src/server/Metrics/package-lock.json

          patch -p0 -d src < patches/patch-server_Metrics_package.json

          NODE_ENV=production npm install \
            --os freebsd \
            --cpu x64 \
            --cache "${TEMP_CACHE}" \
            --lockfile-version 3 \
            --ignore-scripts \
            --prefix src/server/Metrics

          # 4-5. server/FileConverter, server/Common
          for subdir in FileConverter Common; do
            echo "server/${subdir} (production mode)..."

            NODE_ENV=production npm install \
              --os freebsd \
              --cpu x64 \
              --cache "${TEMP_CACHE}" \
              --lockfile-version 3 \
              --ignore-scripts \
              --prefix "src/server/${subdir}"
          done

      - name: Phase 1 - Production mode installations (6-8)
        run: |
          set -e

          # 6. server
          echo "6. server (production mode, patched)..."

          rm -f \
            src/server/package-lock.json

          patch -p0 -d src < patches/patch-server_package.json

          NODE_ENV=production npm install \
            --os freebsd \
            --cpu x64 \
            --cache "${TEMP_CACHE}" \
            --lockfile-version 3 \
            --ignore-scripts \
            --prefix src/server

          # 7. server/DocService
          echo "7. server/DocService (production mode, patched)..."

          rm -f \
            src/server/DocService/package-lock.json

          patch -p0 -d src < patches/patch-server_DocService_package.json

          NODE_ENV=production npm install \
            --os freebsd \
            --cpu x64 \
            --cache "${TEMP_CACHE}" \
            --lockfile-version 3 \
            --ignore-scripts \
            --prefix src/server/DocService

          # 8. document-server-integration
          echo "8. document-server-integration (production mode, --omit=dev)..."

          NODE_ENV=production npm install \
            --os freebsd \
            --cpu x64 \
            --cache "${TEMP_CACHE}" \
            --lockfile-version 3 \
            --ignore-scripts \
            --omit=dev \
            --prefix src/document-server-integration/web/documentserver-example/nodejs

      - name: Phase 1 - Full mode installations (9-11)
        run: |
          set -e

          echo "GROUP B: Full mode installations"

          # 9. sdkjs
          echo "9. sdkjs (full mode, created package.json)..."

          cat > src/sdkjs/package.json << 'EOF'
          {
            "name": "sdkjs-build-deps",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "grunt-cli": "^1.5.0",
              "grunt": "^1.6.2"
            }
          }
          EOF

          npm install \
            --os freebsd \
            --cpu x64 \
            --cache "${TEMP_CACHE}" \
            --lockfile-version 3 \
            --ignore-scripts \
            --prefix src/sdkjs

          # 10. web-apps/build
          echo "10. web-apps/build (full mode, patched)..."

          patch -p0 -d src < patches/patch-web-apps_build_package.json

          npm install \
            --os freebsd \
            --cpu x64 \
            --cache "${TEMP_CACHE}" \
            --lockfile-version 3 \
            --ignore-scripts \
            --prefix src/web-apps/build

          # 11. document-server-package/home/npm
          echo "11. document-server-package/home/npm (full mode)..."

          npm install \
            --os freebsd \
            --cpu x64 \
            --cache "${TEMP_CACHE}" \
            --lockfile-version 3 \
            --ignore-scripts \
            --prefix src/document-server-package/common/documentserver/home/npm

      - name: Phase 1 - yao-pkg installations (12a-12b)
        run: |
          set -e

          mkdir -p \
            src/yao-pkg-arm64 \
            src/yao-pkg-x64

          cat > src/yao-pkg-arm64/package.json << 'EOF'
          {
            "name": "yao-pkg-seed",
            "version": "1.0.0",
            "private": true,
            "dependencies": {}
          }
          EOF

          cp \
            src/yao-pkg-arm64/package.json \
            src/yao-pkg-x64/package.json

          for arch in arm64 x64; do

            if [ "${arch}" = "arm64" ]; then
              label="12a"
            else
              label="12b"
            fi

            echo "${label}. yao-pkg-${arch} (full mode, ${arch})..."

            npm install \
              --os freebsd \
              --cpu "${arch}" \
              --cache "${TEMP_CACHE}" \
              --lockfile-version 3 \
              --ignore-scripts \
              --prefix "src/yao-pkg-${arch}" \
              "@yao-pkg/pkg@${YAO_PKG_VER}"

          done

          echo "Phase 1 dependency trees generated."
          du -sh "${TEMP_CACHE}"

      # ================================================================
      # PHASE 1: DIAGNOSE AND APPROVE LIFECYCLE SCRIPTS
      # ================================================================

      - name: Diagnose and approve npm lifecycle scripts
        run: |
          set -e

          echo "========================================"
          echo "NPM LIFECYCLE SCRIPT POLICY"
          echo "========================================"

          echo
          echo "Pending scripts before approval:"
          echo

          for dir in \
            src/server/Common \
            src/server/DocService \
            src/server/Metrics \
            src/yao-pkg-arm64 \
            src/yao-pkg-x64
          do
            echo
            echo "--- ${dir} ---"
            (
              cd "${dir}"
              npm approve-scripts --allow-scripts-pending
            )
          done

          echo
          echo "Approving expected lifecycle scripts..."

          (
            cd src/server/Common
            npm approve-scripts win-ca
          )

          (
            cd src/server/DocService
            npm approve-scripts oracledb sharp
          )

          (
            cd src/server/Metrics
            npm approve-scripts modern-syslog
          )

          (
            cd src/yao-pkg-arm64
            npm approve-scripts esbuild
          )

          (
            cd src/yao-pkg-x64
            npm approve-scripts esbuild
          )

          echo
          echo "Pending scripts after approval:"
          echo

          pending=0

          for dir in \
            src/server/Common \
            src/server/DocService \
            src/server/Metrics \
            src/yao-pkg-arm64 \
            src/yao-pkg-x64
          do
            echo
            echo "--- ${dir} ---"

            output=$(
              cd "${dir}" &&
              npm approve-scripts --allow-scripts-pending
            )

            if [ -n "${output}" && [ "${output}" != "No packages with unreviewed install scripts." ]; then
              echo "${output}"
              pending=1
            else
              echo "No pending lifecycle scripts."
            fi
          done

          if [ "${pending}" -ne 0 ]; then
            echo
            echo "ERROR: Unexpected lifecycle scripts remain unapproved."
            echo "Review the diagnostic output above before continuing."
            exit 1
          fi

          echo
          echo "All expected lifecycle scripts are approved."

      # ================================================================
      # CAPTURE PACKAGE-LOCK FILES AND APPROVED PACKAGE MANIFESTS
      # ================================================================

      - name: Capture package-lock files and package metadata
        run: |
          set -e

          echo "========================================"
          echo "CAPTURING PACKAGE-LOCK FILES"
          echo "========================================"

          rm -rf package-locks
          mkdir -p package-locks

          # Ordinary package-lock files are captured according to their
          # source-relative directory:
          #
          #   package-locks/<source-relative-directory>/package-lock.json
          #
          # The Yao pkg projects are the exception. They have separate
          # architecture-specific dependency trees and retain the existing
          # root-level naming convention used by the FreeBSD port.

          for rel_path in \
            sdkjs/build \
            web-apps/vendor/framework7-react \
            server/Metrics \
            server/FileConverter \
            server/Common \
            server \
            server/DocService \
            sdkjs \
            web-apps/build \
            document-server-package/common/documentserver/home/npm \
            document-server-integration/web/documentserver-example/nodejs
          do

            source="src/${rel_path}/package-lock.json"
            target="package-locks/${rel_path}/package-lock.json"

            if [ ! -f "${source}" ]; then
              echo "ERROR: Missing generated package-lock:"
              echo "  ${source}"
              exit 1
            fi

            mkdir -p "$(dirname "${target}")"

            cp \
              "${source}" \
              "${target}"

            echo "  ${target}"
          done

          echo
          echo "Capturing architecture-specific Yao package-lock files..."

          # The FreeBSD port selects one of these files using MACHINE_ARCH.
          # Preserve that interface while transitioning from npm-shrinkwrap
          # to package-lock.json.

          if [ ! -f src/yao-pkg-arm64/package-lock.json ]; then
            echo "ERROR: Missing Yao arm64 package-lock:"
            echo "  src/yao-pkg-arm64/package-lock.json"
            exit 1
          fi

          if [ ! -f src/yao-pkg-x64/package-lock.json ]; then
            echo "ERROR: Missing Yao x64 package-lock:"
            echo "  src/yao-pkg-x64/package-lock.json"
            exit 1
          fi

          cp \
            src/yao-pkg-arm64/package-lock.json \
            yao-pkg-npm-package-lock-aarch64.json

          cp \
            src/yao-pkg-x64/package-lock.json \
            yao-pkg-npm-package-lock-amd64.json

          echo "  yao-pkg-npm-package-lock-aarch64.json"
          echo "  yao-pkg-npm-package-lock-amd64.json"

          echo
          echo "Capturing package.json files containing generated metadata..."

          # sdkjs and Yao are generated by this workflow.
          cp src/sdkjs/package.json sdkjs-package.json
          cp src/yao-pkg-arm64/package.json yao-pkg-package.json

          # These package.json files contain npm12 allowScripts approvals
          # and therefore must accompany their package-lock files.
          cp src/server/Common/package.json server-Common-package.json
          cp src/server/DocService/package.json server-DocService-package.json
          cp src/server/Metrics/package.json server-Metrics-package.json

          echo
          echo "Package-lock inventory:"
          find package-locks \
            -type f \
            -name package-lock.json |
          sort

          lock_count=$(
            find package-locks \
              -type f \
              -name package-lock.json |
            wc -l
          )

          if [ "${lock_count}" -ne 11 ]; then
            echo
            echo "ERROR: Expected 11 ordinary package-lock files, found ${lock_count}."
            exit 1
          fi

          echo
          echo "Captured ${lock_count} ordinary package-lock files."
          echo "Captured 2 architecture-specific Yao package-lock files."

      # ================================================================
      # PHASE 2: REBUILD CACHE
      # ================================================================

      - name: Phase 2 - Production mode (1-5)
        run: |
          set -e

          echo "========================================"
          echo "PHASE 2: REBUILD CACHE (tarballs only)"
          echo "========================================"

          rm -rf "${TEMP_CACHE}"
          mkdir -p "${NPM_CACHE}"

          echo "Production mode installations:"

          # 1. sdkjs/build
          rm -rf src/sdkjs/build/node_modules

          NODE_ENV=production npm install \
            --os freebsd \
            --cpu x64 \
            --legacy-peer-deps \
            --no-audit \
            --no-fund \
            --cache "${NPM_CACHE}" \
            --ignore-scripts \
            --prefix src/sdkjs/build

          # 2. framework7-react
          rm -rf src/web-apps/vendor/framework7-react/node_modules

          NODE_ENV=production npm install \
            --os freebsd \
            --cpu x64 \
            --legacy-peer-deps \
            --no-audit \
            --no-fund \
            --cache "${NPM_CACHE}" \
            --ignore-scripts \
            --include=dev \
            --prefix src/web-apps/vendor/framework7-react

          # 3-5. server/Metrics, server/FileConverter, server/Common
          for subdir in Metrics FileConverter Common; do

            rm -rf "src/server/${subdir}/node_modules"

            NODE_ENV=production npm install \
              --os freebsd \
              --cpu x64 \
              --legacy-peer-deps \
              --no-audit \
              --no-fund \
              --cache "${NPM_CACHE}" \
              --ignore-scripts \
              --prefix "src/server/${subdir}"

          done

      - name: Phase 2 - Production mode (6-8)
        run: |
          set -e

          # 6-7. server and server/DocService
          for subdir in '' /DocService; do

            rm -rf "src/server${subdir}/node_modules"

            NODE_ENV=production npm install \
              --os freebsd \
              --cpu x64 \
              --legacy-peer-deps \
              --no-audit \
              --no-fund \
              --cache "${NPM_CACHE}" \
              --ignore-scripts \
              --prefix "src/server${subdir}"

          done

          # 8. document-server-integration
          rm -rf \
            src/document-server-integration/web/documentserver-example/nodejs/node_modules

          NODE_ENV=production npm install \
            --os freebsd \
            --cpu x64 \
            --legacy-peer-deps \
            --no-audit \
            --no-fund \
            --cache "${NPM_CACHE}" \
            --ignore-scripts \
            --omit=dev \
            --prefix src/document-server-integration/web/documentserver-example/nodejs

      - name: Phase 2 - Full mode (9-13)
        run: |
          set -e

          echo "Full mode installations:"

          # 9-11. sdkjs, web-apps/build, document-server-package
          for prefix in \
            src/sdkjs \
            src/web-apps/build \
            src/document-server-package/common/documentserver/home/npm
          do

            rm -rf "${prefix}/node_modules"

            npm install \
              --os freebsd \
              --cpu x64 \
              --legacy-peer-deps \
              --no-audit \
              --no-fund \
              --cache "${NPM_CACHE}" \
              --ignore-scripts \
              --prefix "${prefix}"

          done

          # 12a-12b. yao-pkg (arch-specific)
          for arch in arm64 x64; do

            rm -rf "src/yao-pkg-${arch}/node_modules"

            npm install \
              --os freebsd \
              --cpu "${arch}" \
              --legacy-peer-deps \
              --no-audit \
              --no-fund \
              --cache "${NPM_CACHE}" \
              --ignore-scripts \
              --prefix "src/yao-pkg-${arch}"

          done

          echo "Phase 2 complete: 13 directories cached"
          du -sh "${NPM_CACHE}/_cacache"

      # ================================================================
      # OFFLINE SMOKE TEST
      # ================================================================

      - name: Smoke test
        run: |
          set -e

          echo "--- Smoke-testing cache offline ---"

          success=0
          failed=0

          # 1-6: Production mode directories
          for npm_dir in \
            src/sdkjs/build \
            src/server/Metrics \
            src/server/FileConverter \
            src/server/Common \
            src/server \
            src/server/DocService
          do

            rm -rf "${npm_dir}/node_modules"

            if NODE_ENV=production npm install \
                --os freebsd \
                --cpu x64 \
                --offline \
                --legacy-peer-deps \
                --no-audit \
                --no-fund \
                --cache "${NPM_CACHE}" \
                --ignore-scripts \
                --prefix "${npm_dir}" >/dev/null 2>&1
            then
              success=$((success + 1))
            else
              echo "✗ FAILED: ${npm_dir#src/}"
              failed=$((failed + 1))
            fi

          done

          # 7. framework7-react
          rm -rf src/web-apps/vendor/framework7-react/node_modules

          if NODE_ENV=production npm install \
              --os freebsd \
              --cpu x64 \
              --offline \
              --legacy-peer-deps \
              --no-audit \
              --no-fund \
              --cache "${NPM_CACHE}" \
              --ignore-scripts \
              --include=dev \
              --prefix src/web-apps/vendor/framework7-react >/dev/null 2>&1
          then
            success=$((success + 1))
          else
            echo "✗ FAILED: framework7-react"
            failed=$((failed + 1))
          fi

          # 8. document-server-integration
          rm -rf \
            src/document-server-integration/web/documentserver-example/nodejs/node_modules

          if NODE_ENV=production npm install \
              --os freebsd \
              --cpu x64 \
              --offline \
              --legacy-peer-deps \
              --no-audit \
              --no-fund \
              --cache "${NPM_CACHE}" \
              --ignore-scripts \
              --omit=dev \
              --prefix src/document-server-integration/web/documentserver-example/nodejs >/dev/null 2>&1
          then
            success=$((success + 1))
          else
            echo "✗ FAILED: document-server-integration"
            failed=$((failed + 1))
          fi

          # 9-11: Full mode directories, x64
          for npm_dir in \
            src/sdkjs \
            src/web-apps/build \
            src/document-server-package/common/documentserver/home/npm
          do

            rm -rf "${npm_dir}/node_modules"

            if npm install \
                --os freebsd \
                --cpu x64 \
                --offline \
                --legacy-peer-deps \
                --no-audit \
                --no-fund \
                --cache "${NPM_CACHE}" \
                --ignore-scripts \
                --prefix "${npm_dir}" >/dev/null 2>&1
            then
              success=$((success + 1))
            else
              echo "✗ FAILED: ${npm_dir#src/}"
              failed=$((failed + 1))
            fi

          done

          # 12a-12b: yao-pkg
          for arch in arm64 x64; do

            rm -rf "src/yao-pkg-${arch}/node_modules"

            if npm install \
                --os freebsd \
                --cpu "${arch}" \
                --offline \
                --legacy-peer-deps \
                --no-audit \
                --no-fund \
                --cache "${NPM_CACHE}" \
                --ignore-scripts \
                --prefix "src/yao-pkg-${arch}" >/dev/null 2>&1
            then
              success=$((success + 1))
            else
              echo "✗ FAILED: yao-pkg-${arch}"
              failed=$((failed + 1))
            fi

          done

          echo
          echo "Smoke test results: ${success} passed, ${failed} failed"

          if [ "${failed}" -gt 0 ]; then
            exit 1
          fi

      # ================================================================
      # STATISTICS
      # ================================================================

      - name: Report statistics
        run: |
          set -e

          echo "========================================"
          echo "FINAL CACHE STATISTICS"
          echo "========================================"

          file_count=$(
            find "${NPM_CACHE}/_cacache" -type f |
            wc -l
          )

          echo "Total cached files: ${file_count}"

          cache_size=$(
            du -sh "${NPM_CACHE}/_cacache" |
            awk '{print $1}'
          )

          echo "Total cache size: ${cache_size}"

          tarball_size=$(
            du -sh "${NPM_CACHE}/_cacache/content-v2" |
            awk '{print $1}'
          )

          echo "Tarballs: ${tarball_size}"

          packument_size=$(
            du -sh "${NPM_CACHE}/_cacache/index-v5" |
            awk '{print $1}'
          )

          echo "Packuments: ${packument_size}"

          package_lock_count=$(
            find package-locks \
              -name package-lock.json |
            wc -l
          )

          echo "Package-lock files: ${package_lock_count}"

          echo
          echo "Node versions:"
          echo "  FreeBSD target:       ${FREEBSD_NODE_VER}"
          echo "  Published pkg-fetch: ${PUBLISHED_NODE_VER}"

          echo
          echo "pkg-fetch:"
          echo "  @yao-pkg/pkg:         ${YAO_PKG_VER}"
          echo "  @yao-pkg/pkg-fetch:   ${PKG_FETCH_VER}"
          echo "  Baseline:             $(grep '^PKG_FETCH_BASELINE=' pkg-fetch-build-info.txt | cut -d= -f2-)"
          echo "  Leapfrog:             $(grep '^PKG_FETCH_LEAPFROG=' pkg-fetch-build-info.txt | cut -d= -f2-)"
          echo "  HEAD SHA:             $(grep '^PKG_FETCH_HEAD_SHA=' pkg-fetch-build-info.txt | cut -d= -f2-)"

          echo
          echo "Strategy: Minimal-packument with 13 package-lock files"
          echo "Flags used: --legacy-peer-deps --no-audit --no-fund"
          echo "Platform flags: --os freebsd --cpu x64 (or arm64)"

      # ================================================================
      # REMOVE OLD SHRINKWRAP METADATA
      # ================================================================

      - name: Remove obsolete shrinkwrap metadata
        run: |
          set -e

          echo "========================================"
          echo "REMOVING OBSOLETE SHRINKWRAP METADATA"
          echo "========================================"

          # Remove the old tracked shrinkwrap directory from the repository.
          rm -rf shrinkwrap
          git rm -r --ignore-unmatch shrinkwrap

          # Remove the old root-level Yao shrinkwrap files, if present.
          git rm \
            --ignore-unmatch \
            yao-pkg-npm-shrinkwrap-aarch64.json \
            yao-pkg-npm-shrinkwrap-amd64.json

          # Remove stale generated files from previous workflow versions.
          rm -f \
            yao-pkg-npm-shrinkwrap-aarch64.json \
            yao-pkg-npm-shrinkwrap-amd64.json

          echo
          echo "Obsolete shrinkwrap metadata removed."

      # ================================================================
      # CLEAN CACHE LOGS
      # ================================================================

      - name: Clean generated cache metadata
        run: |
          set -e

          rm -rf \
            "${NPM_CACHE}/_logs" \
            "${NPM_CACHE}/_update-notifier-last-checked"

      # ================================================================
      # COMMIT DEVELOPMENT METADATA
      # ================================================================

      - name: Commit development metadata
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add \
            "extra-patch-pkg-fetch_patches_node.v${FREEBSD_NODE_VER}.patch" \
            package-locks \
            yao-pkg-npm-package-lock-aarch64.json \
            yao-pkg-npm-package-lock-amd64.json \
            sdkjs-package.json \
            yao-pkg-package.json \
            server-Common-package.json \
            server-DocService-package.json \
            server-Metrics-package.json

          git add -u

          if git diff --cached --quiet; then
            echo "No repository changes."
            exit 0
          fi

          git status --short

          git commit \
            -m "Update npm cache development metadata"

          git push \
            origin \
            "HEAD:${{ github.ref_name }}"
