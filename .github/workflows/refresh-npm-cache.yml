# .github/workflows/refresh-npm-cache.yml
#
# Populates the OnlyOffice DocumentServer npm _cacache for use in
# offline poudriere builds.  The resulting commit is tagged with the
# same scheme used in the port's GH_TUPLE, e.g. v9.1.0.177-20250223.
#
# Workflow inputs let you override every version variable so the same
# file works for future releases without editing.
#
# Required repository secret:  none (uses the built-in GITHUB_TOKEN).
# Optional repository secret:  GPG_PRIVATE_KEY + GPG_PASSPHRASE if you
#   want signed tags (see the "Sign tag" step comments).
#
# IMPORTANT — why --ignore-scripts is used for native packages:
#
#   sharp, modern-syslog, and optipng-bin all have postinstall scripts
#   that either compile a native addon or download a prebuilt binary.
#   Running those scripts on the Ubuntu runner would deposit Linux ELF
#   binaries into the cache that are useless (and wrong) for a FreeBSD
#   jail.  The port handles native compilation itself inside the jail
#   using the system libvips, libc, etc.  All the cache needs to
#   supply is the source tarballs and pure-JS dependencies, so every
#   install of those three packages uses --ignore-scripts here.

name: Refresh npm Cache

on:
  workflow_dispatch:
    inputs:
      ds_version:
        description: 'DISTVERSION (e.g. 9.1.0)'
        required: true
        default: '9.2.1'
      ds_build:
        description: 'DS_BUILD number (e.g. 177)'
        required: true
        default: '8'
      node_version:
        description: 'PKGFETCH_NODE_VERSION (e.g. 20.19.5)'
        required: true
        default: '20.20.0'
      sharp_ver:
        description: 'DS_SHARP_VER (e.g. 0.32.6)'
        required: true
        default: '0.32.6'
      modern_syslog_ver:
        description: 'DS_MODERN_SYSLOG_VER (e.g. 1.2.0)'
        required: true
        default: '1.2.0'
      yao_pkg_ver:
        description: '@yao-pkg/pkg version (e.g. 6.9.0)'
        required: true
        default: '6.14.1'

jobs:
  build-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      DS_TAG: "v${{ github.event.inputs.ds_version }}.${{ github.event.inputs.ds_build }}"
      NODE_VER: "${{ github.event.inputs.node_version }}"
      SHARP_VER: "${{ github.event.inputs.sharp_ver }}"
      SYSLOG_VER: "${{ github.event.inputs.modern_syslog_ver }}"
      YAO_PKG_VER: "${{ github.event.inputs.yao_pkg_ver }}"
      # All npm operations write to this single cache directory.
      # At the end we commit its _cacache sub-directory.
      NPM_CACHE: "${{ github.workspace }}/npm-cache"

    steps:
      # ------------------------------------------------------------------ #
      #  1. Check out this cache repository (where we will commit results) #
      # ------------------------------------------------------------------ #
      - name: Checkout npm-cache repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------ #
      #  2. Pin the exact Node.js version the port uses                    #
      # ------------------------------------------------------------------ #
      - name: Set up Node.js ${{ env.NODE_VER }}
        uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VER }}"

      # ------------------------------------------------------------------ #
      #  3. Clone ONLYOFFICE source repositories at the release tag        #
      #     We only need the directories that contain package.json files.  #
      # ------------------------------------------------------------------ #
      - name: Clone ONLYOFFICE/web-apps (for web-apps/build)
        run: |
          git clone --depth 1 --branch "$DS_TAG" \
            https://github.com/ONLYOFFICE/web-apps.git \
            src/web-apps

      - name: Clone ONLYOFFICE/server (for server, DocService, Metrics)
        run: |
          git clone --depth 1 --branch "$DS_TAG" \
            https://github.com/ONLYOFFICE/server.git \
            src/server

      - name: Clone ONLYOFFICE/sdkjs (for sdkjs)
        run: |
          git clone --depth 1 --branch "$DS_TAG" \
            https://github.com/ONLYOFFICE/sdkjs.git \
            src/sdkjs

      # ------------------------------------------------------------------ #
      #  4. Create a minimal package.json for the yao-pkg install          #
      #     The real port uses files from FILESDIR; we replicate the       #
      #     minimal structure needed to pull the correct package version.  #
      # ------------------------------------------------------------------ #
      - name: Create yao-pkg workspace
        run: |
          mkdir -p src/yao-pkg
          cat > src/yao-pkg/package.json <<EOF
          {
            "name": "yao-pkg-cache-seed",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@yao-pkg/pkg": "$YAO_PKG_VER"
            }
          }
          EOF

      # ------------------------------------------------------------------ #
      #  5. Populate the npm cache — mirrors do-build in the port Makefile #
      #                                                                    #
      #  --cache "$NPM_CACHE" routes every download through our target     #
      #  directory so a single _cacache is built up across all installs.   #
      #                                                                    #
      #  Packages with native addons or binary postinstalls                #
      #  (sharp, modern-syslog, optipng-bin) are ALWAYS installed with     #
      #  --ignore-scripts.  We want source tarballs in the cache, not      #
      #  Linux ELF binaries that would be wrong inside a FreeBSD jail.     #
      # ------------------------------------------------------------------ #

      # -- web-apps/build --------------------------------------------------
      - name: npm install web-apps/build — patch-package
        working-directory: src/web-apps/build
        run: npm install --cache "$NPM_CACHE" patch-package

      # optipng-bin postinstall downloads a prebuilt Linux binary; skip it.
      # The port patches the postinstall to use the system optipng instead.
      - name: npm install web-apps/build — optipng-bin@5.1.0 (ignore-scripts)
        working-directory: src/web-apps/build
        run: npm install --cache "$NPM_CACHE" --ignore-scripts optipng-bin@5.1.0

      # -- server ----------------------------------------------------------
      - name: npm install server — grunt-cli
        working-directory: src/server
        run: npm install --cache "$NPM_CACHE" grunt-cli

      - name: npm install server — grunt
        working-directory: src/server
        run: npm install --cache "$NPM_CACHE" grunt

      # -- server/DocService -----------------------------------------------
      # The port runs sharp twice: --ignore-scripts first, then a full build
      # inside the jail against the FreeBSD libvips.  We only ever need the
      # source tarball in the cache, so --ignore-scripts is sufficient here.
      - name: npm install DocService — sharp (ignore-scripts)
        working-directory: src/server/DocService
        run: npm install --cache "$NPM_CACHE" --ignore-scripts "sharp@$SHARP_VER"

      - name: npm install DocService — patch-package
        working-directory: src/server/DocService
        run: npm install --cache "$NPM_CACHE" patch-package

      # -- server/Metrics --------------------------------------------------
      # Same reasoning as sharp above.
      - name: npm install Metrics — modern-syslog (ignore-scripts)
        working-directory: src/server/Metrics
        run: npm install --cache "$NPM_CACHE" --ignore-scripts "modern-syslog@$SYSLOG_VER"

      - name: npm install Metrics — patch-package
        working-directory: src/server/Metrics
        run: npm install --cache "$NPM_CACHE" patch-package

      # -- sdkjs -----------------------------------------------------------
      - name: npm install sdkjs — grunt-cli
        working-directory: src/sdkjs
        run: npm install --cache "$NPM_CACHE" grunt-cli

      - name: npm install sdkjs — grunt
        working-directory: src/sdkjs
        run: npm install --cache "$NPM_CACHE" grunt

      # -- yao-pkg ---------------------------------------------------------
      - name: npm install yao-pkg — @yao-pkg/pkg
        working-directory: src/yao-pkg
        run: npm install --cache "$NPM_CACHE" "@yao-pkg/pkg@$YAO_PKG_VER"

      # ------------------------------------------------------------------  #
      #  6. Verify the cache is self-sufficient (offline smoke-test)        #
      #     Re-run every install with --prefer-offline against the cache    #
      #     we just built.  Any miss is a hard error.                       #
      #     Native packages are smoke-tested with --ignore-scripts only,    #
      #     consistent with how the cache was populated.                    #
      # ------------------------------------------------------------------  #
      - name: Smoke-test cache offline — web-apps/build
        working-directory: src/web-apps/build
        run: |
          rm -rf node_modules
          npm install --prefer-offline --cache "$NPM_CACHE" patch-package
          npm install --prefer-offline --cache "$NPM_CACHE" --ignore-scripts optipng-bin@5.1.0

      - name: Smoke-test cache offline — server
        working-directory: src/server
        run: |
          rm -rf node_modules
          npm install --prefer-offline --cache "$NPM_CACHE" grunt-cli
          npm install --prefer-offline --cache "$NPM_CACHE" grunt

      - name: Smoke-test cache offline — server/DocService
        working-directory: src/server/DocService
        run: |
          rm -rf node_modules
          npm install --prefer-offline --cache "$NPM_CACHE" --ignore-scripts "sharp@$SHARP_VER"
          npm install --prefer-offline --cache "$NPM_CACHE" patch-package

      - name: Smoke-test cache offline — server/Metrics
        working-directory: src/server/Metrics
        run: |
          rm -rf node_modules
          npm install --prefer-offline --cache "$NPM_CACHE" --ignore-scripts "modern-syslog@$SYSLOG_VER"
          npm install --prefer-offline --cache "$NPM_CACHE" patch-package

      - name: Smoke-test cache offline — sdkjs
        working-directory: src/sdkjs
        run: |
          rm -rf node_modules
          npm install --prefer-offline --cache "$NPM_CACHE" grunt-cli
          npm install --prefer-offline --cache "$NPM_CACHE" grunt

      - name: Smoke-test cache offline — yao-pkg
        working-directory: src/yao-pkg
        run: |
          rm -rf node_modules
          npm install --prefer-offline --cache "$NPM_CACHE" "@yao-pkg/pkg@$YAO_PKG_VER"

      # ------------------------------------------------------------------ #
      #  7. Clean up artefacts that must not live in the committed cache   #
      #     Mirror what create-caches-tarball does in the port Makefile.   #
      # ------------------------------------------------------------------ #
      - name: Clean transient cache artefacts
        run: |
          rm -rf \
            "$NPM_CACHE/_logs" \
            "$NPM_CACHE/_update-notifier-last-checked"

      # ------------------------------------------------------------------  #
      #  8. Replace _cacache and yao-pkg manifests in this repo and commit  #
      #                                                                     #
      #  package.json and package-lock.json are committed here alongside    #
      #  _cacache so the port Makefile can copy them from WRKSRC_npm_cache  #
      #  instead of carrying them as static files/ entries.  This keeps     #
      #  the lockfile and the cache guaranteed in sync.                     #
      # ------------------------------------------------
        run: |
          DATE=$(date -u +%Y%m%d)
          NEW_TAG="${DS_TAG}-${DATE}"

          # Replace the _cacache subtree" _cacache

          # Replace the yao-pkg manifests with the freshly resolved copies.
          # package-lock.json is genera versions; package.json is the seed we created but
          # npm may have normalised it, so capture both.
          cp src/yaoo-pkg/package-lock.json yao-pkg-package-lock.json

          git config user.name  "github-actions[bot]"
          git config us     git add _cacache yao-pkg-package.json yao-pkg-package-lock.json
          git commit -m "npm cache for OnlyOffice DS ${DS_TE_KEY + GPG_PASSPHRASE secrets) ---
          # Uncomment the block below and remove the plain `git tag` line to
          # getts.GPG_PRIVATE_KEY }}" | gpg --batch --import
          # echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --batch --passphrase-fd 0 \ # git tag -s "$NEW_TAG" -m "OnlyOffice DS ${DS_TAG} npm cache (${DATE})"

          git tag "$NEW_TAG" -m "OnlyOffice DS ${DS_Tgs

          echo ""
          echo "::notice::Committed and pushed tag: $NEW_TAG"
          echo "::notice::Update your port Gfice-DS-npm-cache:${NEW_TAG}:npm_cache"
