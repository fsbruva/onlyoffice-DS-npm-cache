# .github/workflows/refresh-npm-cache.yml
#
# Populates the OnlyOffice DocumentServer npm _cacache for use in
# offline poudriere builds. The resulting commit is tagged with the
# same scheme used in the port's GH_TUPLE, e.g. v9.1.0.177-20250223.
#
# NOTE: workflow_dispatch only fires from the repository's default branch.
# Merge this file to your default branch before attempting to trigger it.
#
# WHY package-lock.json is deleted before bare npm install:
#
#   When npm installs with a package-lock.json present, it reads resolved
#   tarball URLs directly from the lockfile and never fetches packuments
#   (registry metadata) from the npm registry. Packuments are NOT written
#   to _cacache. Later, when the jail runs "npm install grunt-cli" inside a
#   directory like server/, npm must rebuild the full ideal tree and fetches
#   packuments for every package in the tree — including pre-existing ones
#   like @eslint/compat. Without packuments in cache, --offline fails with
#   ENOTCACHED. Deleting the lockfile forces npm to go through full registry
#   resolution, caching both packuments and tarballs for every package.
#
#   The port Makefile is updated in parallel to also delete these lockfiles
#   before its npm install calls, so the jail uses the same lock-file-free
#   resolution path and finds the matching packuments and tarballs in cache.
#
# WHY --ignore-scripts is used for native packages:
#
#   sharp, modern-syslog, and optipng-bin have postinstall scripts that
#   compile native addons or download prebuilt binaries for the host OS.
#   Running those on the Ubuntu runner would deposit Linux ELF binaries
#   into the cache that are useless inside a FreeBSD jail. The port builds
#   these natively inside the jail using system libvips, libc, etc.

name: Refresh npm Cache

on:
  workflow_dispatch:
    inputs:
      ds_version:
        description: 'DISTVERSION (e.g. 9.1.0)'
        required: true
        default: '9.1.0'
      ds_build:
        description: 'DS_BUILD number (e.g. 177)'
        required: true
        default: '177'
      node_version:
        description: 'PKGFETCH_NODE_VERSION (e.g. 20.19.5)'
        required: true
        default: '20.19.5'
      sharp_ver:
        description: 'DS_SHARP_VER (e.g. 0.32.6)'
        required: true
        default: '0.32.6'
      modern_syslog_ver:
        description: 'DS_MODERN_SYSLOG_VER (e.g. 1.2.0)'
        required: true
        default: '1.2.0'
      yao_pkg_ver:
        description: '@yao-pkg/pkg version (e.g. 6.9.0)'
        required: true
        default: '6.9.0'

jobs:
  build-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      DS_TAG:      "v${{ github.event.inputs.ds_version }}.${{ github.event.inputs.ds_build }}"
      NODE_VER:    "${{ github.event.inputs.node_version }}"
      SHARP_VER:   "${{ github.event.inputs.sharp_ver }}"
      SYSLOG_VER:  "${{ github.event.inputs.modern_syslog_ver }}"
      YAO_PKG_VER: "${{ github.event.inputs.yao_pkg_ver }}"
      NPM_CACHE:   "${{ github.workspace }}/npm-cache"

    steps:
      - name: Checkout npm-cache repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js ${{ github.event.inputs.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VER }}"

      - name: Clone ONLYOFFICE/web-apps at tag ${{ env.DS_TAG }}
        run: |
          git clone \
            --depth 1 \
            --branch "${{ env.DS_TAG }}" \
            --single-branch \
            https://github.com/ONLYOFFICE/web-apps.git \
            src/web-apps

      - name: Clone ONLYOFFICE/server at tag ${{ env.DS_TAG }}
        run: |
          git clone \
            --depth 1 \
            --branch "${{ env.DS_TAG }}" \
            --single-branch \
            https://github.com/ONLYOFFICE/server.git \
            src/server

      - name: Clone ONLYOFFICE/sdkjs at tag ${{ env.DS_TAG }}
        run: |
          git clone \
            --depth 1 \
            --branch "${{ env.DS_TAG }}" \
            --single-branch \
            https://github.com/ONLYOFFICE/sdkjs.git \
            src/sdkjs

      - name: Verify cloned tags
        run: |
          echo "=== web-apps ===" && git -C src/web-apps describe --tags
          echo "=== server    ===" && git -C src/server  describe --tags
          echo "=== sdkjs     ===" && git -C src/sdkjs   describe --tags

      - name: Create yao-pkg workspace
        run: |
          mkdir -p src/yao-pkg
          cat > src/yao-pkg/package.json << 'EOF'
          {
            "name": "yao-pkg-cache-seed",
            "version": "1.0.0",
            "private": true,
            "dependencies": {}
          }
          EOF

      # ------------------------------------------------------------------ #
      #  Phase 1: bare installs — cache the full existing package.json tree #
      #                                                                      #
      #  package-lock.json is deleted first in every directory. With no     #
      #  lockfile, npm must fetch packuments for all packages from the npm  #
      #  registry and write them to _cacache. Without this step, npm reads  #
      #  resolved URLs from the lockfile and skips packument fetching        #
      #  entirely, leaving the cache incomplete for offline jail builds.    #
      #                                                                      #
      #  --ignore-scripts prevents any native compile or binary download    #
      #  scripts from running on the Ubuntu runner.                         #
      # ------------------------------------------------------------------ #

      - name: "web-apps/build: cache full package.json tree"
        working-directory: src/web-apps/build
        run: |
          rm -f package-lock.json
          npm install --cache "${{ env.NPM_CACHE }}" --ignore-scripts

      - name: "server: cache full package.json tree"
        working-directory: src/server
        run: |
          rm -f package-lock.json
          npm install --cache "${{ env.NPM_CACHE }}" --ignore-scripts

      - name: "server/DocService: cache full package.json tree"
        working-directory: src/server/DocService
        run: |
          rm -f package-lock.json
          npm install --cache "${{ env.NPM_CACHE }}" --ignore-scripts

      - name: "server/Metrics: cache full package.json tree"
        working-directory: src/server/Metrics
        run: |
          rm -f package-lock.json
          npm install --cache "${{ env.NPM_CACHE }}" --ignore-scripts

      - name: "sdkjs: cache full package.json tree"
        working-directory: src/sdkjs
        run: |
          rm -f package-lock.json
          npm install --cache "${{ env.NPM_CACHE }}" --ignore-scripts

      # ------------------------------------------------------------------ #
      #  Phase 2: port-specific installs — mirror the port's do-build       #
      # ------------------------------------------------------------------ #

      - name: "web-apps/build: npm install patch-package"
        working-directory: src/web-apps/build
        run: npm install --cache "${{ env.NPM_CACHE }}" patch-package

      - name: "web-apps/build: npm install optipng-bin@5.1.0 (ignore-scripts)"
        working-directory: src/web-apps/build
        run: npm install --cache "${{ env.NPM_CACHE }}" --ignore-scripts optipng-bin@5.1.0

      - name: "server: npm install grunt-cli"
        working-directory: src/server
        run: npm install --cache "${{ env.NPM_CACHE }}" grunt-cli

      - name: "server: npm install grunt"
        working-directory: src/server
        run: npm install --cache "${{ env.NPM_CACHE }}" grunt

      - name: "DocService: npm install sharp@${{ env.SHARP_VER }} (ignore-scripts)"
        working-directory: src/server/DocService
        run: npm install --cache "${{ env.NPM_CACHE }}" --ignore-scripts "sharp@${{ env.SHARP_VER }}"

      - name: "DocService: npm install patch-package"
        working-directory: src/server/DocService
        run: npm install --cache "${{ env.NPM_CACHE }}" patch-package

      - name: "Metrics: npm install modern-syslog@${{ env.SYSLOG_VER }} (ignore-scripts)"
        working-directory: src/server/Metrics
        run: npm install --cache "${{ env.NPM_CACHE }}" --ignore-scripts "modern-syslog@${{ env.SYSLOG_VER }}"

      - name: "Metrics: npm install patch-package"
        working-directory: src/server/Metrics
        run: npm install --cache "${{ env.NPM_CACHE }}" patch-package

      - name: "sdkjs: npm install grunt-cli"
        working-directory: src/sdkjs
        run: npm install --cache "${{ env.NPM_CACHE }}" grunt-cli

      - name: "sdkjs: npm install grunt"
        working-directory: src/sdkjs
        run: npm install --cache "${{ env.NPM_CACHE }}" grunt

      - name: "yao-pkg: npm install @yao-pkg/pkg@${{ env.YAO_PKG_VER }}"
        working-directory: src/yao-pkg
        run: npm install --cache "${{ env.NPM_CACHE }}" "@yao-pkg/pkg@${{ env.YAO_PKG_VER }}"

      - name: Verify cache was populated
        run: |
          echo "Cache location: ${{ env.NPM_CACHE }}"
          echo "--- _cacache entry count ---"
          find "${{ env.NPM_CACHE }}/_cacache" -type f | wc -l
          echo "--- _cacache size ---"
          du -sh "${{ env.NPM_CACHE }}/_cacache"

      # ------------------------------------------------------------------ #
      #  Offline smoke-tests                                                 #
      #  Mirrors the jail exactly: no lockfile, --offline, same two phases. #
      # ------------------------------------------------------------------ #

      - name: "Smoke-test: web-apps/build"
        working-directory: src/web-apps/build
        run: |
          rm -rf node_modules package-lock.json
          npm install --offline --cache "${{ env.NPM_CACHE }}" --ignore-scripts
          npm install --offline --cache "${{ env.NPM_CACHE }}" patch-package
          npm install --offline --cache "${{ env.NPM_CACHE }}" --ignore-scripts optipng-bin@5.1.0

      - name: "Smoke-test: server"
        working-directory: src/server
        run: |
          rm -rf node_modules package-lock.json
          npm install --offline --cache "${{ env.NPM_CACHE }}" --ignore-scripts
          npm install --offline --cache "${{ env.NPM_CACHE }}" grunt-cli
          npm install --offline --cache "${{ env.NPM_CACHE }}" grunt

      - name: "Smoke-test: server/DocService"
        working-directory: src/server/DocService
        run: |
          rm -rf node_modules package-lock.json
          npm install --offline --cache "${{ env.NPM_CACHE }}" --ignore-scripts
          npm install --offline --cache "${{ env.NPM_CACHE }}" --ignore-scripts "sharp@${{ env.SHARP_VER }}"
          npm install --offline --cache "${{ env.NPM_CACHE }}" patch-package

      - name: "Smoke-test: server/Metrics"
        working-directory: src/server/Metrics
        run: |
          rm -rf node_modules package-lock.json
          npm install --offline --cache "${{ env.NPM_CACHE }}" --ignore-scripts
          npm install --offline --cache "${{ env.NPM_CACHE }}" --ignore-scripts "modern-syslog@${{ env.SYSLOG_VER }}"
          npm install --offline --cache "${{ env.NPM_CACHE }}" patch-package

      - name: "Smoke-test: sdkjs"
        working-directory: src/sdkjs
        run: |
          rm -rf node_modules package-lock.json
          npm install --offline --cache "${{ env.NPM_CACHE }}" --ignore-scripts
          npm install --offline --cache "${{ env.NPM_CACHE }}" grunt-cli
          npm install --offline --cache "${{ env.NPM_CACHE }}" grunt

      - name: "Smoke-test: yao-pkg"
        working-directory: src/yao-pkg
        run: |
          rm -rf node_modules
          npm install --offline --cache "${{ env.NPM_CACHE }}" "@yao-pkg/pkg@${{ env.YAO_PKG_VER }}"

      - name: Clean transient cache artefacts
        run: |
          rm -rf "${{ env.NPM_CACHE }}/_logs"
          rm -rf "${{ env.NPM_CACHE }}/_update-notifier-last-checked"

      - name: Commit and tag
        run: |
          DATE=$(date -u +%Y%m%d)
          NEW_TAG="${{ env.DS_TAG }}-${DATE}"

          rm -rf _cacache
          cp -r "${{ env.NPM_CACHE }}/_cacache" _cacache

          cp src/yao-pkg/package.json      yao-pkg-package.json
          cp src/yao-pkg/package-lock.json yao-pkg-package-lock.json

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add _cacache yao-pkg-package.json yao-pkg-package-lock.json
          git commit -m "npm cache for OnlyOffice DS ${{ env.DS_TAG }} (${DATE})"

          # To use signed tags, store your key in repository secrets as
          # GPG_PRIVATE_KEY and GPG_PASSPHRASE, then replace the plain
          # git tag line below with:
          #
          #   echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          #   echo "${{ secrets.GPG_PASSPHRASE }}" | \
          #     gpg --batch --passphrase-fd 0 --pinentry-mode loopback --quiet true
          #   git tag -s "$NEW_TAG" -m "OnlyOffice DS ${{ env.DS_TAG }} npm cache (${DATE})"

          git tag "$NEW_TAG" -m "OnlyOffice DS ${{ env.DS_TAG }} npm cache (${DATE})"
          git push origin HEAD --tags

          echo "::notice::Committed and pushed tag: $NEW_TAG"
          echo "::notice::Update your port GH_TUPLE line to:"
          echo "::notice::  fsbruva:onlyoffice-DS-npm-cache:${NEW_TAG}:npm_cache"
