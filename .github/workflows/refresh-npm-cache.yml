# .github/workflows/refresh-npm-cache.yml
#
# Populates the OnlyOffice DocumentServer npm _cacache for use in
# offline poudriere builds. The resulting commit is tagged with the
# same scheme used in the port's GH_TUPLE, e.g. v9.1.0.177-20250223.
#
# Workflow inputs let you override every version variable so the same
# file works for future releases without editing.
#
# Required repository secret:  none (uses the built-in GITHUB_TOKEN).
# Optional repository secret:  GPG_PRIVATE_KEY + GPG_PASSPHRASE if you
#   want signed tags (see the "Sign tag" step comments).
#
# NOTE: workflow_dispatch only fires from the repository's default branch.
# Merge this file to your default branch before attempting to trigger it.
#
# IMPORTANT - why --ignore-scripts is used for native packages:
#   sharp, modern-syslog, and optipng-bin all have postinstall scripts
#   that either compile a native addon or download a prebuilt binary.
#   Running those on the Ubuntu runner would deposit Linux ELF binaries
#   into the cache that are useless inside a FreeBSD jail. The port
#   handles native compilation itself inside the jail using the system
#   libvips, libc, etc. All the cache needs to supply is the source
#   tarballs and pure-JS dependencies.

name: Refresh npm Cache

on:
  workflow_dispatch:
    inputs:
      ds_version:
        description: 'DISTVERSION (e.g. 9.1.0)'
        required: true
        default: '9.2.1'
      ds_build:
        description: 'DS_BUILD number (e.g. 177)'
        required: true
        default: '8'
      node_version:
        description: 'PKGFETCH_NODE_VERSION (e.g. 20.19.5)'
        required: true
        default: '20.20.0'
      sharp_ver:
        description: 'DS_SHARP_VER (e.g. 0.32.6)'
        required: true
        default: '0.32.6'
      modern_syslog_ver:
        description: 'DS_MODERN_SYSLOG_VER (e.g. 1.2.0)'
        required: true
        default: '1.2.0'
      yao_pkg_ver:
        description: '@yao-pkg/pkg version (e.g. 6.9.0)'
        required: true
        default: '6.14.1'

jobs:
  build-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      DS_TAG: "v${{ github.event.inputs.ds_version }}.${{ github.event.inputs.ds_build }}"
      NODE_VER: "${{ github.event.inputs.node_version }}"
      SHARP_VER: "${{ github.event.inputs.sharp_ver }}"
      SYSLOG_VER: "${{ github.event.inputs.modern_syslog_ver }}"
      YAO_PKG_VER: "${{ github.event.inputs.yao_pkg_ver }}"
      NPM_CACHE: "${{ github.workspace }}/npm-cache"

    steps:
      - name: Checkout npm-cache repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js ${{ env.NODE_VER }}
        uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VER }}"

      - name: Clone ONLYOFFICE/web-apps
        run: |
          git clone --depth 1 --branch "$DS_TAG" \
            https://github.com/ONLYOFFICE/web-apps.git \
            src/web-apps

      - name: Clone ONLYOFFICE/server
        run: |
          git clone --depth 1 --branch "$DS_TAG" \
            https://github.com/ONLYOFFICE/server.git \
            src/server

      - name: Clone ONLYOFFICE/sdkjs
        run: |
          git clone --depth 1 --branch "$DS_TAG" \
            https://github.com/ONLYOFFICE/sdkjs.git \
            src/sdkjs

      - name: Create yao-pkg workspace
        run: |
          mkdir -p src/yao-pkg
          cat > src/yao-pkg/package.json << EOF
          {
            "name": "yao-pkg-cache-seed",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@yao-pkg/pkg": "$YAO_PKG_VER"
            }
          }
          EOF

      # web-apps/build
      - name: "web-apps/build: npm install patch-package"
        working-directory: src/web-apps/build
        run: npm install --cache "$NPM_CACHE" patch-package

      - name: "web-apps/build: npm install optipng-bin@5.1.0 (ignore-scripts)"
        working-directory: src/web-apps/build
        run: npm install --cache "$NPM_CACHE" --ignore-scripts optipng-bin@5.1.0

      # server
      - name: "server: npm install grunt-cli"
        working-directory: src/server
        run: npm install --cache "$NPM_CACHE" grunt-cli

      - name: "server: npm install grunt"
        working-directory: src/server
        run: npm install --cache "$NPM_CACHE" grunt

      # server/DocService
      - name: "DocService: npm install sharp (ignore-scripts)"
        working-directory: src/server/DocService
        run: npm install --cache "$NPM_CACHE" --ignore-scripts "sharp@$SHARP_VER"

      - name: "DocService: npm install patch-package"
        working-directory: src/server/DocService
        run: npm install --cache "$NPM_CACHE" patch-package

      # server/Metrics
      - name: "Metrics: npm install modern-syslog (ignore-scripts)"
        working-directory: src/server/Metrics
        run: npm install --cache "$NPM_CACHE" --ignore-scripts "modern-syslog@$SYSLOG_VER"

      - name: "Metrics: npm install patch-package"
        working-directory: src/server/Metrics
        run: npm install --cache "$NPM_CACHE" patch-package

      # sdkjs
      - name: "sdkjs: npm install grunt-cli"
        working-directory: src/sdkjs
        run: npm install --cache "$NPM_CACHE" grunt-cli

      - name: "sdkjs: npm install grunt"
        working-directory: src/sdkjs
        run: npm install --cache "$NPM_CACHE" grunt

      # yao-pkg
      - name: "yao-pkg: npm install @yao-pkg/pkg"
        working-directory: src/yao-pkg
        run: npm install --cache "$NPM_CACHE" "@yao-pkg/pkg@$YAO_PKG_VER"

      # Offline smoke-tests — any cache miss is a hard failure
      - name: "Smoke-test: web-apps/build"
        working-directory: src/web-apps/build
        run: |
          rm -rf node_modules
          npm install --offline --cache "$NPM_CACHE" patch-package
          npm install --offline --cache "$NPM_CACHE" --ignore-scripts optipng-bin@5.1.0

      - name: "Smoke-test: server"
        working-directory: src/server
        run: |
          rm -rf node_modules
          npm install --offline --cache "$NPM_CACHE" grunt-cli
          npm install --offline --cache "$NPM_CACHE" grunt

      - name: "Smoke-test: server/DocService"
        working-directory: src/server/DocService
        run: |
          rm -rf node_modules
          npm install --offline --cache "$NPM_CACHE" --ignore-scripts "sharp@$SHARP_VER"
          npm install --offline --cache "$NPM_CACHE" patch-package

      - name: "Smoke-test: server/Metrics"
        working-directory: src/server/Metrics
        run: |
          rm -rf node_modules
          npm install --offline --cache "$NPM_CACHE" --ignore-scripts "modern-syslog@$SYSLOG_VER"
          npm install --offline --cache "$NPM_CACHE" patch-package

      - name: "Smoke-test: sdkjs"
        working-directory: src/sdkjs
        run: |
          rm -rf node_modules
          npm install --offline --cache "$NPM_CACHE" grunt-cli
          npm install --offline --cache "$NPM_CACHE" grunt

      - name: "Smoke-test: yao-pkg"
        working-directory: src/yao-pkg
        run: |
          rm -rf node_modules
          npm install --offline --cache "$NPM_CACHE" "@yao-pkg/pkg@$YAO_PKG_VER"

      - name: Clean transient cache artefacts
        run: |
          rm -rf "$NPM_CACHE/_logs"
          rm -rf "$NPM_CACHE/_update-notifier-last-checked"

      - name: Commit and tag
        run: |
          DATE=$(date -u +%Y%m%d)
          NEW_TAG="${DS_TAG}-${DATE}"

          rm -rf _cacache
          cp -r "$NPM_CACHE/_cacache" _cacache

          cp src/yao-pkg/package.json      yao-pkg-package.json
          cp src/yao-pkg/package-lock.json yao-pkg-package-lock.json

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add _cacache yao-pkg-package.json yao-pkg-package-lock.json
          git commit -m "npm cache for OnlyOffice DS ${DS_TAG} (${DATE})"

          # To use signed tags instead, store your key in repository secrets as
          # GPG_PRIVATE_KEY and GPG_PASSPHRASE, then replace the plain git tag
          # line below with:
          #
          #   echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          #   echo "${{ secrets.GPG_PASSPHRASE }}" | \
          #     gpg --batch --passphrase-fd 0 --pinentry-mode loopback --quiet true
          #   git tag -s "$NEW_TAG" -m "OnlyOffice DS ${DS_TAG} npm cache (${DATE})"

          git tag "$NEW_TAG" -m "OnlyOffice DS ${DS_TAG} npm cache (${DATE})"
          git push origin HEAD --tags

          echo "::notice::Committed and pushed tag: $NEW_TAG"
          echo "::notice::Update your port GH_TUPLE line to:"
          echo "::notice::  fsbruva:onlyoffice-DS-npm-cache:${NEW_TAG}:npm_cache"
