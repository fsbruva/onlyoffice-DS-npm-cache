# .cirrus.yml
#
# TWO-PHASE CACHE BUILD - PRODUCTION-MATCHED STRATEGY
#
# Phase 1: Generate/update shrinkwraps (temporary cache, then deleted)
# Phase 2: Rebuild cache using updated shrinkwraps (tarballs only)
# Phase 3: Install yao-pkg only (minimal packuments)
#
# KEY: Match NODE_ENV and flags used by actual build scripts
#
# Shrinkwrap files (11 dirs - tarballs only, ZERO packuments):
#   All captured after npm "fixes up" to current version
#
#   Production mode (NODE_ENV=production):
#     1. sdkjs/build
#     2. framework7-react  (but with --include=dev)
#     3. server/Metrics
#     4. server/FileConverter
#     5. server/Common
#     6. server
#     7. server/DocService
#     8. document-server-integration
#
#   Full mode (NODE_ENV=<unset>):
#     9. sdkjs
#    10. web-apps/build
#    11. ds-package/home/npm
#
# Package-lock files (1 dir - minimal packuments):
#   1. yao-pkg
#
# Expected cache size: ~95-110MB
# Packument overhead: <1%

env:
  DS_VERSION:          "9.3.1"
  DS_BUILD:            "8"
  NODE_VERSION:        "20.20.0"
  SHARP_VER:           "0.32.6"
  YAO_PKG_VER:         "6.14.1"

  GITHUB_TOKEN: ENCRYPTED[cb63ddb701139b4dac8e4493476ef1ae09fa0078c69f2c153d968d93106a48a2263a08a5337848cc5d2641531b40e2fc]

  DS_TAG: "v${DS_VERSION}.${DS_BUILD}"
  NPM_CACHE: "/tmp/npm-cache"
  TEMP_CACHE: "/tmp/temp-cache"

build_npm_cache_task:
  name: "Build npm Cache (Production-Matched)"
  trigger_type: manual

  freebsd_instance:
    image_family: freebsd-14-3
    cpu: 4
    memory: 8GB
    disk: 50

  timeout_in: 60m

  install_script:
    - NODE_MAJOR=$(echo "${NODE_VERSION}" | cut -d'.' -f1)
    - echo "Node major version: ${NODE_MAJOR}"
    - pkg install -y "npm-node${NODE_MAJOR}" git
    - node --version
    - npm --version

  clone_script:
    - git clone --depth 1
        "https://x-access-token:${GITHUB_TOKEN}@github.com/${CIRRUS_REPO_FULL_NAME}.git"
        "${CIRRUS_WORKING_DIR}"
    - git config user.name  "cirrus-ci[bot]"
    - git config user.email "cirrus-ci[bot]@users.noreply.github.com"

  clone_sources_script:
    - echo "Building cache for DS_TAG=${DS_TAG}"
    - git clone --depth 1 --branch "${DS_TAG}" --single-branch
        https://github.com/ONLYOFFICE/web-apps.git src/web-apps
    - git clone --depth 1 --branch "${DS_TAG}" --single-branch
        https://github.com/ONLYOFFICE/server.git src/server
    - git clone --depth 1 --branch "${DS_TAG}" --single-branch
        https://github.com/ONLYOFFICE/sdkjs.git src/sdkjs
    - git clone --depth 1 --branch "${DS_TAG}" --single-branch
        https://github.com/ONLYOFFICE/document-server-integration.git src/document-server-integration
    - git clone --depth 1 --branch "${DS_TAG}" --single-branch
        https://github.com/ONLYOFFICE/document-server-package.git src/document-server-package
    - echo "=== web-apps    ===" && git -C src/web-apps                   describe --tags
    - echo "=== server      ===" && git -C src/server                     describe --tags
    - echo "=== sdkjs       ===" && git -C src/sdkjs                      describe --tags
    - echo "=== integration ===" && git -C src/document-server-integration describe --tags
    - echo "=== ds-package  ===" && git -C src/document-server-package     describe --tags

  clone_ports_tree_script:
    - echo "--- Cloning FreeBSD ports tree (shallow) ---"
    - git clone --depth 1 https://github.com/freebsd/freebsd-ports.git /tmp/freebsd-ports
    - echo "  ✓ Ports tree cloned to /tmp/freebsd-ports"

  copy_patches_script:
    - echo "--- Creating patches for version 9.3.1 ---"
    - mkdir -p patches

    # server/package.json patch (add grunt, change npm-run-all to concurrently)
    - |
      cat > patches/patch-server_package.json << 'PATCH_EOF'
      --- server/package.json.orig	2026-02-23 07:24:11 UTC
      +++ server/package.json
      @@ -4,9 +4,11 @@
         "homepage": "https://www.onlyoffice.com",
         "private": true,
         "dependencies": {
      +    "grunt": "^1.6.1",
      +    "grunt-cli": "^1.5.0",
           "license-downloader": "1.0.8",
           "license-report": "6.5.0",
      -    "npm-run-all": "4.1.5"
      +    "concurrently": "^9.2.0"
         },
         "devDependencies": {
           "@eslint/compat": "1.2.3",
      PATCH_EOF
      echo "  ✓ Created patch-server_package.json (for 9.3.1)"

    # server/DocService patch (multer + patch-package)
    - |
      cat > patches/patch-server_DocService_package.json << 'PATCH_EOF'
      --- server/DocService/package.json.orig	2026-02-23 07:24:11 UTC
      +++ server/DocService/package.json
      @@ -28,7 +28,8 @@
           "mime-db": "1.53.0",
           "ms": "2.1.3",
           "mssql": "11.0.1",
      -    "multer": "1.4.4",
      +    "multer": "2.0.2",
      +    "patch-package": "^8.0.0",
           "multi-integer-range": "5.2.0",
           "multiparty": "4.2.3",
           "mysql2": "3.13.0",
      PATCH_EOF
      echo "  ✓ Created patch-server_DocService_package.json (multer + patch-package)"

    # web-apps/build patch (add patch-package + optipng-bin, add postinstall script)
    - |
      cat > patches/patch-web-apps_build_package.json << 'PATCH_EOF'
      --- web-apps/build/package.json.orig	2026-02-23 07:24:11 UTC
      +++ web-apps/build/package.json
      @@ -40,8 +40,12 @@
           }
         },
         "devDependencies": {
      -    "chai": "^5.1.0",
      -    "grunt-mocha": "^1.2.0",
      -    "mocha": "^10.2.0"
      +    "chai": "^5.1.0"
      +  },
      +  "dependencies": {
      +    "patch-package": "^8.0.0",
      +    "optipng-bin": "5.1.0"
      +  },
      +  "scripts": {
      +    "postinstall": "patch-package"
         }
       }
      PATCH_EOF
      echo "  ✓ Created patch-web-apps_build_package.json (patch-package + optipng-bin)"

  # ================================================================== #
  # PHASE 1: GENERATE/UPDATE SHRINKWRAPS (temporary cache)             #
  # ================================================================== #
  phase1_generate_shrinkwraps_script:
    - echo "========================================"
    - echo "PHASE 1: GENERATE/UPDATE SHRINKWRAPS"
    - echo "========================================"
    - mkdir -p "${TEMP_CACHE}"

    # GROUP A: Production mode dirs (NODE_ENV=production)
    # These are called by python/node build scripts with NODE_ENV=production
    - echo "GROUP A: Production mode installations"

    # 1. sdkjs/build (upstream shrinkwrap, production mode)
    - echo "1. sdkjs/build (production mode)..."
    - NODE_ENV=production npm install --cache "${TEMP_CACHE}" --ignore-scripts --prefix src/sdkjs/build
    - echo "  ✓ npm fixed up shrinkwrap to current version"

    # 2. framework7-react (upstream shrinkwrap, production mode BUT --include=dev)
    - echo "2. framework7-react (production mode + --include=dev)..."
    - NODE_ENV=production npm install --cache "${TEMP_CACHE}" --ignore-scripts --include=dev --prefix src/web-apps/vendor/framework7-react
    - echo "  ✓ npm fixed up shrinkwrap to current version"

    # 3. server/Metrics (upstream shrinkwrap, production mode)
    - echo "3. server/Metrics (production mode)..."
    - NODE_ENV=production npm install --cache "${TEMP_CACHE}" --ignore-scripts --prefix src/server/Metrics
    - echo "  ✓ npm fixed up shrinkwrap to current version"

    # 4. server/FileConverter (upstream shrinkwrap, production mode)
    - echo "4. server/FileConverter (production mode)..."
    - NODE_ENV=production npm install --cache "${TEMP_CACHE}" --ignore-scripts --prefix src/server/FileConverter
    - echo "  ✓ npm fixed up shrinkwrap to current version"

    # 5. server/Common (upstream shrinkwrap, production mode)
    - echo "5. server/Common (production mode)..."
    - NODE_ENV=production npm install --cache "${TEMP_CACHE}" --ignore-scripts --prefix src/server/Common
    - echo "  ✓ npm fixed up shrinkwrap to current version"

    # 6. server (delete upstream shrinkwrap, patch, install production mode, generate new shrinkwrap)
    - echo "6. server (production mode, patched)..."
    - rm -f src/server/npm-shrinkwrap.json
    - patch -p0 -d src < patches/patch-server_package.json
    - NODE_ENV=production npm install --cache "${TEMP_CACHE}" --ignore-scripts --prefix src/server
    - cd src/server && npm shrinkwrap && cd -
    - echo "  ✓ server/npm-shrinkwrap.json generated"

    # 7. server/DocService (delete upstream shrinkwrap, patch, install production mode, generate new shrinkwrap)
    - echo "7. server/DocService (production mode, patched)..."
    - rm -f src/server/DocService/npm-shrinkwrap.json
    - patch -p0 -d src < patches/patch-server_DocService_package.json
    - NODE_ENV=production npm install --cache "${TEMP_CACHE}" --ignore-scripts --prefix src/server/DocService
    - cd src/server/DocService && npm shrinkwrap && cd -
    - echo "  ✓ server/DocService/npm-shrinkwrap.json generated"

    # 8. document-server-integration (production mode, --omit=dev matches npm ci behavior)
    - echo "8. document-server-integration (production mode, --omit=dev)..."
    - NODE_ENV=production npm install --cache "${TEMP_CACHE}" --ignore-scripts --omit=dev --prefix src/document-server-integration/web/documentserver-example/nodejs
    - cd src/document-server-integration/web/documentserver-example/nodejs && npm shrinkwrap && cd -
    - echo "  ✓ document-server-integration/npm-shrinkwrap.json generated"

    # GROUP B: Full mode dirs (NODE_ENV=<unset>)
    # These are called by Makefile with no NODE_ENV set
    - echo ""
    - echo "GROUP B: Full mode installations"

    # 9. sdkjs (create package.json with grunt, full mode)
    - echo "9. sdkjs (full mode, created package.json)..."
    - |
      cat > src/sdkjs/package.json << 'EOF'
      {
        "name": "sdkjs-build-deps",
        "version": "1.0.0",
        "private": true,
        "dependencies": {
          "grunt-cli": "^1.5.0",
          "grunt": "^1.6.1"
        }
      }
      EOF
    - npm install --cache "${TEMP_CACHE}" --ignore-scripts --prefix src/sdkjs
    - cd src/sdkjs && npm shrinkwrap && cd -
    - echo "  ✓ sdkjs/package.json created"
    - echo "  ✓ sdkjs/npm-shrinkwrap.json generated"

    # 10. web-apps/build (patch, full mode)
    - echo "10. web-apps/build (full mode, patched)..."
    - patch -p0 -d src < patches/patch-web-apps_build_package.json
    - npm install --cache "${TEMP_CACHE}" --ignore-scripts --prefix src/web-apps/build
    - cd src/web-apps/build && npm shrinkwrap && cd -
    - echo "  ✓ web-apps/build/npm-shrinkwrap.json generated"

    # 11. document-server-package/home/npm (full mode)
    - echo "11. document-server-package/home/npm (full mode)..."
    - npm install --cache "${TEMP_CACHE}" --ignore-scripts --prefix src/document-server-package/common/documentserver/home/npm
    - cd src/document-server-package/common/documentserver/home/npm && npm shrinkwrap && cd -
    - echo "  ✓ document-server-package/npm-shrinkwrap.json generated"

    - echo ""
    - echo "Phase 1 complete:"
    - echo "  - 8 production mode shrinkwrap dirs (including 5 fixed-up upstream)"
    - echo "  - 3 full mode shrinkwrap dirs"
    - echo "  - All 11 shrinkwraps updated to npm 11.7.0 format"
    - echo "Temporary cache size: $(du -sh ${TEMP_CACHE} | awk '{print $1}')"

  # ================================================================== #
  # PHASE 2: DELETE CACHE AND REBUILD (tarballs only)                 #
  # ================================================================== #
  phase2_delete_and_rebuild_script:
    - echo "========================================"
    - echo "PHASE 2: REBUILD CACHE (tarballs only)"
    - echo "========================================"
    - echo "Deleting temporary cache..."
    - rm -rf "${TEMP_CACHE}"
    - echo "Creating production cache..."
    - mkdir -p "${NPM_CACHE}"
    - echo ""
    - echo "Reinstalling with updated shrinkwraps (npm will only cache tarballs)..."

    # Install all 11 shrinkwrap dirs matching production/full modes
    # Remove node_modules first to force cache hydration

    # Production mode dirs
    - echo "Production mode installations:"
    - rm -rf src/sdkjs/build/node_modules
    - NODE_ENV=production npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/sdkjs/build
    - rm -rf src/web-apps/vendor/framework7-react/node_modules
    - NODE_ENV=production npm install --cache "${NPM_CACHE}" --ignore-scripts --include=dev --prefix src/web-apps/vendor/framework7-react
    - rm -rf src/server/Metrics/node_modules
    - NODE_ENV=production npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/server/Metrics
    - rm -rf src/server/FileConverter/node_modules
    - NODE_ENV=production npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/server/FileConverter
    - rm -rf src/server/Common/node_modules
    - NODE_ENV=production npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/server/Common
    - rm -rf src/server/node_modules
    - NODE_ENV=production npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/server
    - rm -rf src/server/DocService/node_modules
    - NODE_ENV=production npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/server/DocService
    - rm -rf src/document-server-integration/web/documentserver-example/nodejs/node_modules
    - NODE_ENV=production npm install --cache "${NPM_CACHE}" --ignore-scripts --omit=dev --prefix src/document-server-integration/web/documentserver-example/nodejs

    # Full mode dirs
    - echo "Full mode installations:"
    - rm -rf src/sdkjs/node_modules
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/sdkjs
    - rm -rf src/web-apps/build/node_modules
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/web-apps/build
    - rm -rf src/document-server-package/common/documentserver/home/npm/node_modules
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/document-server-package/common/documentserver/home/npm

    - echo ""
    - echo "Phase 2 complete: 11 directories cached (tarballs only, ZERO packuments)"
    - echo "  Production mode (8): sdkjs/build, framework7-react, server/Metrics,"
    - echo "                       server/FileConverter, server/Common, server,"
    - echo "                       server/DocService, ds-integration"
    - echo "  Full mode (3): sdkjs, web-apps/build, ds-package"
    - echo "Production cache size: $(du -sh ${NPM_CACHE}/_cacache | awk '{print $1}')"

  # ================================================================== #
  # PHASE 3: YAO-PKG ONLY (minimal packuments)                         #
  # ================================================================== #
  phase3_yao_pkg_script:
    - echo "========================================"
    - echo "PHASE 3: YAO-PKG (minimal packuments)"
    - echo "========================================"

    # yao-pkg (only package-lock dir, full mode matches Makefile)
    - echo "Installing yao-pkg (@yao-pkg/pkg, @esbuild packages)..."
    - mkdir -p src/yao-pkg
    - |
      cat > src/yao-pkg/package.json << 'EOF'
      {
        "name": "yao-pkg-cache-seed",
        "version": "1.0.0",
        "private": true,
        "dependencies": {}
      }
      EOF
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/yao-pkg "@yao-pkg/pkg@${YAO_PKG_VER}"
    - |
      for ARCH in x64 arm64; do
        npm cache add --force --cache "${NPM_CACHE}" "@esbuild/freebsd-${ARCH}"
      done
    - echo "  ✓ yao-pkg/package-lock.json"

    - echo ""
    - echo "Phase 3 complete: yao-pkg cached (minimal packuments)"

  capture_artifacts_script:
    - echo "--- Capturing artifacts ---"
    - mkdir -p src/shrinkwrap

    # Capture ALL 11 shrinkwrap files (including fixed-up upstream ones)
    - echo "Capturing all 11 shrinkwrap files..."
    - mkdir -p src/shrinkwrap/sdkjs/build
    - mkdir -p src/shrinkwrap/web-apps/vendor/framework7-react
    - mkdir -p src/shrinkwrap/web-apps/build
    - mkdir -p src/shrinkwrap/server
    - mkdir -p src/shrinkwrap/server/Metrics
    - mkdir -p src/shrinkwrap/server/FileConverter
    - mkdir -p src/shrinkwrap/server/Common
    - mkdir -p src/shrinkwrap/server/DocService
    - mkdir -p src/shrinkwrap/sdkjs
    - mkdir -p src/shrinkwrap/document-server-package/common/documentserver/home/npm
    - mkdir -p src/shrinkwrap/document-server-integration/web/documentserver-example/nodejs

    # Copy all shrinkwraps (production mode first, then full mode)
    - echo "  Production mode shrinkwraps:"
    - cp src/sdkjs/build/npm-shrinkwrap.json src/shrinkwrap/sdkjs/build/
    - echo "    ✓ sdkjs/build"
    - cp src/web-apps/vendor/framework7-react/npm-shrinkwrap.json src/shrinkwrap/web-apps/vendor/framework7-react/
    - echo "    ✓ framework7-react"
    - cp src/server/Metrics/npm-shrinkwrap.json src/shrinkwrap/server/Metrics/
    - echo "    ✓ server/Metrics"
    - cp src/server/FileConverter/npm-shrinkwrap.json src/shrinkwrap/server/FileConverter/
    - echo "    ✓ server/FileConverter"
    - cp src/server/Common/npm-shrinkwrap.json src/shrinkwrap/server/Common/
    - echo "    ✓ server/Common"
    - cp src/server/npm-shrinkwrap.json src/shrinkwrap/server/
    - echo "    ✓ server"
    - cp src/server/DocService/npm-shrinkwrap.json src/shrinkwrap/server/DocService/
    - echo "    ✓ server/DocService"
    - cp src/document-server-integration/web/documentserver-example/nodejs/npm-shrinkwrap.json src/shrinkwrap/document-server-integration/web/documentserver-example/nodejs/
    - echo "    ✓ document-server-integration"

    - echo "  Full mode shrinkwraps:"
    - cp src/sdkjs/npm-shrinkwrap.json src/shrinkwrap/sdkjs/
    - echo "    ✓ sdkjs"
    - cp src/web-apps/build/npm-shrinkwrap.json src/shrinkwrap/web-apps/build/
    - echo "    ✓ web-apps/build"
    - cp src/document-server-package/common/documentserver/home/npm/npm-shrinkwrap.json src/shrinkwrap/document-server-package/common/documentserver/home/npm/
    - echo "    ✓ document-server-package"

    - |
      shrinkwrap_count=$(find src/shrinkwrap -name npm-shrinkwrap.json | wc -l)
      echo ""
      echo "  Total: ${shrinkwrap_count} shrinkwrap files captured"
      echo "  All updated to npm 11.7.0 format (no fixup warnings during port build)"

    # Capture created sdkjs/package.json
    - echo "Capturing sdkjs/package.json..."
    - cp src/sdkjs/package.json src/sdkjs-package.json

    # Capture yao-pkg files
    - echo "Capturing yao-pkg files..."
    - cp src/yao-pkg/package.json src/yao-pkg-package.json
    - cp src/yao-pkg/package-lock.json src/yao-pkg-package-lock.json

  generate_pkg_fetch_patch_script:
    - echo "--- Generating pkg-fetch FreeBSD node patch ---"
    - mkdir -p /tmp/patch-workspace
    - cd /tmp/patch-workspace

    - npm install --cache "${NPM_CACHE}" patch-package
    - npm install --cache "${NPM_CACHE}" "@yao-pkg/pkg@${YAO_PKG_VER}"

    - PKG_FETCH_VERSION=$(grep '"@yao-pkg/pkg-fetch"' node_modules/@yao-pkg/pkg/package.json | cut -d'"' -f4 | sed 's/\^//')
    - echo "  pkg-fetch version: ${PKG_FETCH_VERSION}"

    - NODE_MAJOR=$(echo "${NODE_VERSION}" | cut -d'.' -f1)
    - echo "  Node major version: ${NODE_MAJOR}"

    - mkdir -p freebsd-patches
    - |
      set -e
      echo "  Using FreeBSD ports tree from /tmp/freebsd-ports..."

      NODE_PORT_DIR="/tmp/freebsd-ports/www/node${NODE_MAJOR}/files"
      if [ ! -d "${NODE_PORT_DIR}" ]; then
        echo "ERROR: node${NODE_MAJOR} port directory not found"
        exit 1
      fi

      patch_count=0
      for patch_file in ${NODE_PORT_DIR}/patch-*; do
        if [ -f "${patch_file}" ]; then
          cp "${patch_file}" freebsd-patches/
          patch_count=$((patch_count + 1))
        fi
      done
      echo "  Copied ${patch_count} FreeBSD node${NODE_MAJOR} patches"

      if [ "${patch_count}" -eq 0 ]; then
        echo "ERROR: No FreeBSD node${NODE_MAJOR} patches found"
        exit 1
      fi

    - cd node_modules/@yao-pkg/pkg-fetch/patches
    - |
      for patch_file in /tmp/patch-workspace/freebsd-patches/patch-*; do
        if [ -f "${patch_file}" ]; then
          sed 's#^--- #--- node/#g; s#^+++ #+++ node/#g' "${patch_file}" >> "node.v${NODE_VERSION}.cpp.patch"
        fi
      done

    - cd /tmp/patch-workspace
    - npx patch-package "@yao-pkg/pkg-fetch"

    - cd patches
    - PATCH_FILE=$(ls @yao-pkg+pkg-fetch+*.patch 2>/dev/null | head -1)
    - UPSTREAM_URL="https://github.com/yao-pkg/pkg-fetch/raw/refs/tags/v${PKG_FETCH_VERSION}/patches/node.v${NODE_VERSION}.cpp.patch"
    - |
      {
        echo "${UPSTREAM_URL}"
        echo "+ local FreeBSD patches"
        grep -v '^diff --git\|^index ' "${PATCH_FILE}" | \
          sed 's#^--- a/node_modules#--- yao-pkg/node_modules#g; s#^+++ b/node_modules#+++ yao-pkg/node_modules#g'
      } > "${CIRRUS_WORKING_DIR}/extra-patch-pkg-fetch_patches_node.v${NODE_VERSION}.cpp.patch"

    - cd "${CIRRUS_WORKING_DIR}"
    - echo "--- Patch generated: $(wc -l < extra-patch-pkg-fetch_patches_node.v${NODE_VERSION}.cpp.patch) lines ---"

  smoke_test_script:
    - echo "--- Smoke-testing cache offline ---"
    - |
      # Test all 11 shrinkwrap dirs with appropriate NODE_ENV

      success=0
      failed=0

      # Production mode dirs
      echo "Testing production mode dirs:"
      PROD_DIRS="
      src/sdkjs/build
      src/server/Metrics
      src/server/FileConverter
      src/server/Common
      src/server
      src/server/DocService
      "

      for npm_dir in ${PROD_DIRS}; do
        if [ -f "${npm_dir}/package.json" ]; then
          rm -rf "${npm_dir}/node_modules"
          if NODE_ENV=production npm install --offline --cache "${NPM_CACHE}" --ignore-scripts \
              --prefix "${npm_dir}" >/dev/null 2>&1; then
            success=$((success + 1))
          else
            echo "  ✗ FAILED: ${npm_dir#src/}"
            failed=$((failed + 1))
          fi
        fi
      done

      # framework7-react (production + --include=dev)
      rm -rf src/web-apps/vendor/framework7-react/node_modules
      if NODE_ENV=production npm install --offline --cache "${NPM_CACHE}" --ignore-scripts \
          --include=dev --prefix src/web-apps/vendor/framework7-react >/dev/null 2>&1; then
        success=$((success + 1))
      else
        echo "  ✗ FAILED: framework7-react"
        failed=$((failed + 1))
      fi

      # document-server-integration (production + --omit=dev)
      rm -rf src/document-server-integration/web/documentserver-example/nodejs/node_modules
      if NODE_ENV=production npm install --offline --cache "${NPM_CACHE}" --ignore-scripts \
          --omit=dev --prefix src/document-server-integration/web/documentserver-example/nodejs >/dev/null 2>&1; then
        success=$((success + 1))
      else
        echo "  ✗ FAILED: document-server-integration"
        failed=$((failed + 1))
      fi

      # Full mode dirs
      echo "Testing full mode dirs:"
      FULL_DIRS="
      src/sdkjs
      src/web-apps/build
      src/document-server-package/common/documentserver/home/npm
      "

      for npm_dir in ${FULL_DIRS}; do
        if [ -f "${npm_dir}/package.json" ]; then
          rm -rf "${npm_dir}/node_modules"
          if npm install --offline --cache "${NPM_CACHE}" --ignore-scripts \
              --prefix "${npm_dir}" >/dev/null 2>&1; then
            success=$((success + 1))
          else
            echo "  ✗ FAILED: ${npm_dir#src/}"
            failed=$((failed + 1))
          fi
        fi
      done

      # Test yao-pkg (package-lock, full mode)
      rm -rf src/yao-pkg/node_modules
      if npm install --offline --cache "${NPM_CACHE}" --ignore-scripts \
          --prefix src/yao-pkg "@yao-pkg/pkg@${YAO_PKG_VER}" >/dev/null 2>&1; then
        success=$((success + 1))
      else
        echo "  ✗ FAILED: yao-pkg"
        failed=$((failed + 1))
      fi

      echo ""
      echo "--- Smoke-test results ---"
      echo "  Success: ${success}"
      echo "  Failed:  ${failed}"

      if [ ${failed} -gt 0 ]; then
        echo ""
        echo "ERROR: ${failed} directories failed offline install"
        exit 1
      fi

      echo "--- All directories passed offline test ---"

  report_script:
    - echo "========================================"
    - echo "FINAL CACHE STATISTICS"
    - echo "========================================"
    - |
      file_count=$(find "${NPM_CACHE}/_cacache" -type f | wc -l)
      echo "  Total cached files: ${file_count}"
    - |
      cache_size=$(du -sh "${NPM_CACHE}/_cacache" | awk '{print $1}')
      echo "  Total cache size:   ${cache_size}"
    - |
      tarball_size=$(du -sh "${NPM_CACHE}/_cacache/content-v2" | awk '{print $1}')
      echo "  Tarballs:           ${tarball_size}"
    - |
      packument_size=$(du -sh "${NPM_CACHE}/_cacache/index-v5" | awk '{print $1}')
      echo "  Packuments:         ${packument_size}"
    - |
      shrinkwrap_count=$(find src/shrinkwrap -name npm-shrinkwrap.json 2>/dev/null | wc -l)
      echo "  Shrinkwrap files:   ${shrinkwrap_count} (all updated to npm 11.7.0)"
    - echo ""
    - echo "Strategy summary:"
    - echo "  Phase 1: Installed/updated all 11 dirs (npm fixed up old shrinkwraps)"
    - echo "  Phase 2: Reinstalled 11 dirs with updated shrinkwraps (tarballs only)"
    - echo "  Phase 3: Installed yao-pkg with package-lock (minimal packuments)"
    - echo ""
    - echo "All shrinkwraps captured and updated to npm 11.7.0 format"
    - echo "Port build will see NO 'old lockfile' warnings"
    - echo ""
    - echo "Shrinkwrap dirs (11):"
    - echo "  Production mode (8): sdkjs/build, framework7-react, server/Metrics,"
    - echo "                       server/FileConverter, server/Common, server,"
    - echo "                       server/DocService, ds-integration"
    - echo "  Full mode (3): sdkjs, web-apps/build, ds-package"
    - echo ""
    - echo "Package-lock dirs (1): yao-pkg only"

  commit_script:
    - DATE=$(date -u +%Y%m%d%H%M)
    - NEW_TAG="${DS_TAG}-${DATE}-prodmatch"
    - echo "Committing as tag ${NEW_TAG}"

    - rm -rf "${NPM_CACHE}/_logs"
    - rm -rf "${NPM_CACHE}/_update-notifier-last-checked"

    - rm -rf _cacache shrinkwrap
    - cp -r "${NPM_CACHE}/_cacache" _cacache
    - cp -r src/shrinkwrap shrinkwrap
    - cp src/sdkjs-package.json sdkjs-package.json
    - cp src/yao-pkg-package.json yao-pkg-package.json
    - cp src/yao-pkg-package-lock.json yao-pkg-package-lock.json

    - git add _cacache shrinkwrap/ sdkjs-package.json yao-pkg-package.json yao-pkg-package-lock.json "extra-patch-pkg-fetch_patches_node.v${NODE_VERSION}.cpp.patch"
    - git commit -m "npm cache for OnlyOffice DS ${DS_TAG} (${DATE}) - production-matched (11 shrinkwrap + 1 package-lock, all updated)"
    - git tag "${NEW_TAG}" -m "OnlyOffice DS ${DS_TAG} production-matched cache (${DATE})"
    - git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${CIRRUS_REPO_FULL_NAME}.git" HEAD --tags
    - echo ""
    - echo "✓ Pushed tag ${NEW_TAG}"
    - echo ""
    - echo "Artifacts committed:"
    - echo "  - _cacache/ (npm cache, ~95-110MB)"
    - echo "  - shrinkwrap/ (ALL 11 shrinkwrap files, updated to npm 11.7.0)"
    - echo "  - sdkjs-package.json (created file)"
    - echo "  - yao-pkg files"
    - echo "  - extra-patch-pkg-fetch patch"
    - echo ""
    - echo "Update GH_TUPLE to:"
    - echo "  fsbruva:onlyoffice-DS-npm-cache:${NEW_TAG}:npm_cache"
