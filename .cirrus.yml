# .cirrus.yml
#
# SINGLE-PHASE TIERED CACHE BUILD - OPTIMIZED
#
# Strategy:
#   - Only delete shrinkwrap from server/* (generates lockfiles for these)
#   - Keep shrinkwrap in sdkjs/build and web-apps/vendor/* (use their pinned versions)
#   - Cache document-server-integration/nodejs (required by build scripts)
#   - Clean old lockfiles before committing new ones
#
# CACHE_TIER controls which directories are cached:
#   Tier 1: Makefile-explicit only
#   Tier 2: Server dirs + essential (RECOMMENDED - targets ~160MB)
#   Tier 3: Add vendor libraries (safe fallback)
#   Tier 4: Full discovery (all directories)

env:
  DS_VERSION:          "9.3.0"
  DS_BUILD:            "138"
  NODE_VERSION:        "20.20.0"
  SHARP_VER:           "0.32.6"
  MODERN_SYSLOG_VER:   "1.2.0"
  YAO_PKG_VER:         "6.14.1"

  # Tier selection: 1 (minimal), 2 (recommended), 3 (safe), 4 (full)
  CACHE_TIER:          "1"

  GITHUB_TOKEN: ENCRYPTED[cb63ddb701139b4dac8e4493476ef1ae09fa0078c69f2c153d968d93106a48a2263a08a5337848cc5d2641531b40e2fc]

  DS_TAG: "v${DS_VERSION}.${DS_BUILD}"
  NPM_CACHE: "/tmp/npm-cache"
  PORTS_BASE: "https://cgit.freebsd.org/ports/plain/www/onlyoffice-documentserver"

build_npm_cache_task:
  name: "Build npm Cache (Single-Phase Tier ${CACHE_TIER})"
  trigger_type: manual

  freebsd_instance:
    image_family: freebsd-14-3
    cpu: 4
    memory: 8GB
    disk: 50

  timeout_in: 60m

  install_script:
    # Extract node major version from NODE_VERSION
    - NODE_MAJOR=$(echo "${NODE_VERSION}" | cut -d'.' -f1)
    - echo "Node major version: ${NODE_MAJOR}"
    - echo "Installing npm-node${NODE_MAJOR}..."
    - pkg install -y "npm-node${NODE_MAJOR}" git
    - node --version
    - npm --version

  clone_script:
    - git clone --depth 1
        "https://x-access-token:${GITHUB_TOKEN}@github.com/${CIRRUS_REPO_FULL_NAME}.git"
        "${CIRRUS_WORKING_DIR}"
    - git config user.name  "cirrus-ci[bot]"
    - git config user.email "cirrus-ci[bot]@users.noreply.github.com"

  clone_sources_script:
    - echo "Building cache for DS_TAG=${DS_TAG}"
    - git clone --depth 1 --branch "${DS_TAG}" --single-branch
        https://github.com/ONLYOFFICE/web-apps.git src/web-apps
    - git clone --depth 1 --branch "${DS_TAG}" --single-branch
        https://github.com/ONLYOFFICE/server.git src/server
    - git clone --depth 1 --branch "${DS_TAG}" --single-branch
        https://github.com/ONLYOFFICE/sdkjs.git src/sdkjs
    - git clone --depth 1 --branch "${DS_TAG}" --single-branch
        https://github.com/ONLYOFFICE/document-server-integration.git src/document-server-integration
    - git clone --depth 1 --branch "${DS_TAG}" --single-branch
        https://github.com/ONLYOFFICE/document-server-package.git src/document-server-package
    - echo "=== web-apps ===" && git -C src/web-apps describe --tags
    - echo "=== server    ===" && git -C src/server  describe --tags
    - echo "=== sdkjs     ===" && git -C src/sdkjs   describe --tags
    - echo "=== integration ===" && git -C src/document-server-integration describe --tags
    - echo "=== server-package  ===" && git -C src/document-server-package describe --tags

  apply_patches_script:
    - echo "--- Fetching FreeBSD port patches ---"
    - mkdir -p patches
    - fetch -o patches/patch-server_package.json "${PORTS_BASE}/files/patch-server_package.json" || echo "WARN: patch not found"
    - fetch -o patches/patch-web-apps_build_package.json "${PORTS_BASE}/files/patch-web-apps_build_package.json" || echo "WARN: patch not found"

    # Create custom multer patch (not yet in ports tree)
    - echo "--- Creating custom multer patch for server/DocService ---"
    - |
      cat > patches/patch-server_DocService_package.json << 'EOF'
      --- server/DocService/package.json.orig	2026-02-23 07:24:11.000000000 +0000
      +++ server/DocService/package.json	2026-02-25 03:48:37.203046000 +0000
      @@ -28,7 +28,7 @@
           "mime-db": "1.53.0",
           "ms": "2.1.3",
           "mssql": "11.0.1",
      -    "multer": "1.4.4",
      +    "multer": "2.0.2",
           "multi-integer-range": "5.2.0",
           "multiparty": "4.2.3",
           "mysql2": "3.13.0",
      EOF

    - echo "--- Applying patches ---"
    - if [ -f patches/patch-server_package.json ]; then
        patch -p0 -d src < patches/patch-server_package.json && echo "  ✓ Applied server package.json";
      fi
    - if [ -f patches/patch-web-apps_build_package.json ]; then
        patch -p0 -d src < patches/patch-web-apps_build_package.json && echo "  ✓ Applied web-apps/build package.json";
      fi
    - if [ -f patches/patch-server_DocService_package.json ]; then
        patch -p0 -d src < patches/patch-server_DocService_package.json && echo "  ✓ Applied server/DocService package.json (multer)";
      fi

  delete_shrinkwrap_script:
    - echo "--- Deleting npm-shrinkwrap.json files (server/* only) ---"
    - |
      echo "  Directories with npm-shrinkwrap.json in server/*:"
      find src/server -type f -name npm-shrinkwrap.json \
        -exec dirname {} \; | sort -u > /tmp/shrinkwrap-dirs.txt

      dir_count=$(wc -l < /tmp/shrinkwrap-dirs.txt)
      cat /tmp/shrinkwrap-dirs.txt | sed 's|^src/|    |'
      echo "  Found ${dir_count} shrinkwrap directories in server"
    - find src/server -type f -name npm-shrinkwrap.json -delete
    - echo "  ✓ Server shrinkwrap files deleted (will generate package-lock.json)"
    - echo "  Note: Keeping shrinkwrap in sdkjs/build and web-apps/vendor/* (reduces cache size)"

  discover_npm_dirs_script:
    - echo "--- Discovering npm directories (Tier ${CACHE_TIER}) ---"
    - |
      case "${CACHE_TIER}" in
        1)
          echo "  Tier 1: Makefile-explicit only (minimal)"
          cat > /tmp/npm-dirs.txt << 'EOF'
      src/web-apps/build
      src/server
      src/server/Common
      src/server/DocService
      src/server/FileConverter
      src/server/Metrics
      src/sdkjs/build
      src/document-server-integration/web/documentserver-example/nodejs
      src/document-server-package/common/documentserver/home/npm
      src/yao-pkg
      EOF
          ;;

        2)
          echo "  Tier 2: Server dirs + essential (RECOMMENDED)"
          echo "  Target: ~160MB cache (server lockfiles + shrinkwrap elsewhere)"
          cat > /tmp/npm-dirs.txt << 'EOF'
      src/web-apps/build
      src/server
      src/server/Common
      src/server/DocService
      src/server/FileConverter
      src/server/Metrics
      src/server/SpellChecker
      src/sdkjs/build
      src/web-apps/vendor/framework7-react
      src/document-server-integration/web/documentserver-example/nodejs
      src/document-server-package/common/documentserver/home/npm
      src/yao-pkg
      EOF
          ;;

        3)
          echo "  Tier 3: Include additional vendor libraries (safe fallback)"
          echo "  Expected: ~200MB cache"
          cat > /tmp/npm-dirs.txt << 'EOF'
      src/web-apps/build
      src/web-apps/build/sprites
      src/server
      src/server/Common
      src/server/DocService
      src/server/FileConverter
      src/server/Metrics
      src/server/SpellChecker
      src/sdkjs/build
      src/sdkjs/build/deserializer
      src/web-apps/vendor/backbone
      src/web-apps/vendor/framework7-react
      src/web-apps/vendor/underscore
      src/document-server-integration/web/documentserver-example/nodejs
      src/document-server-package/common/documentserver/home/npm
      src/yao-pkg
      EOF
          ;;

        4)
          echo "  Tier 4: Full discovery (all directories)"
          echo "  Expected: ~295MB cache"
          find src -type f -name package.json \
            ! -path "*/v8_89/*" \
            ! -path "*/document-server-package/php-laravel/*" \
            ! -path "*/onlyoffice.github.io/*" \
            ! -path "*/perfect-scrollbar/*" \
            -exec dirname {} \; | sort -u > /tmp/npm-dirs.txt
          ;;

        *)
          echo "ERROR: Invalid CACHE_TIER=${CACHE_TIER}. Must be 1, 2, 3, or 4."
          exit 1
          ;;
      esac

      dir_count=$(wc -l < /tmp/npm-dirs.txt)
      echo "  Selected ${dir_count} directories for caching:"
      cat /tmp/npm-dirs.txt | sed 's|^src/|    |'

  # ================================================================== #
  # SINGLE PHASE: Cache all directories and generate lockfiles        #
  # ================================================================== #
  cache_all_dirs_script:
    - echo "========================================"
    - echo "CACHING ALL DIRECTORIES"
    - echo "========================================"
    - |
      dir_count=$(wc -l < /tmp/npm-dirs.txt)
      echo "  Processing ${dir_count} directories..."

      success=0
      failed=0

      while IFS= read -r npm_dir; do
        if [ -f "${npm_dir}/package.json" ]; then
          dir_name="${npm_dir#src/}"

          if npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix "${npm_dir}" "${npm_dir}" 2>&1 | grep -v "^npm warn" > /dev/null; then
            success=$((success + 1))

            if [ -f "${npm_dir}/package-lock.json" ]; then
              echo "  ✓ ${dir_name} (lockfile generated)"
            else
              echo "  ○ ${dir_name} (using shrinkwrap)"
            fi
          else
            echo "  ✗ ${dir_name} (install failed)"
            failed=$((failed + 1))
          fi
        fi
      done < /tmp/npm-dirs.txt

      echo ""
      echo "--- Install summary ---"
      echo "  Success: ${success}"
      echo "  Failed: ${failed}"
      echo "  Total: ${dir_count}"

      if [ ${failed} -gt 0 ]; then
        echo "WARNING: ${failed} directories failed (continuing anyway)"
      fi

  port_specific_deps_script:
    - echo "--- Installing port-specific dependencies ---"
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/web-apps/build patch-package
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/web-apps/build optipng-bin@5.1.0
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/server grunt-cli
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/server grunt
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/server/DocService "sharp@${SHARP_VER}"
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/server/DocService patch-package
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/server/Metrics "modern-syslog@${MODERN_SYSLOG_VER}"
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/server/Metrics patch-package
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/sdkjs grunt-cli
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/sdkjs grunt

  cache_yao_pkg_script:
    - echo "--- Caching yao-pkg ---"
    - mkdir -p src/yao-pkg
    - |
      cat > src/yao-pkg/package.json << 'EOF'
      {
        "name": "yao-pkg-cache-seed",
        "version": "1.0.0",
        "private": true,
        "dependencies": {}
      }
      EOF
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/yao-pkg "@yao-pkg/pkg@${YAO_PKG_VER}"

  capture_lockfiles_script:
    - echo "--- Capturing lockfiles (only from server/* directories) ---"
    - mkdir -p src/lockfiles
    - |
      lockfile_count=0
      while IFS= read -r server_dir; do
        if [ -f "${server_dir}/package-lock.json" ]; then
          rel_path="${server_dir#src/}"
          target_dir="src/lockfiles/${rel_path}"
          mkdir -p "${target_dir}"
          cp "${server_dir}/package-lock.json" "${target_dir}/package-lock.json"
          lockfile_count=$((lockfile_count + 1))
          echo "  Saved: ${rel_path}/package-lock.json"
        fi
      done < /tmp/shrinkwrap-dirs.txt

      echo "  Total lockfiles captured: ${lockfile_count}"
      echo "  (sdkjs/build and framework7-react keep their shrinkwrap files)"

  generate_pkg_fetch_patch_script:
    - echo "--- Generating pkg-fetch FreeBSD node patch ---"
    - mkdir -p /tmp/patch-workspace
    - mkdir -p /tmp/freebsd-ports
    - cd /tmp/patch-workspace

    - npm install --cache "${NPM_CACHE}" patch-package
    - npm install --cache "${NPM_CACHE}" "@yao-pkg/pkg@${YAO_PKG_VER}"

    - PKG_FETCH_VERSION=$(cat node_modules/@yao-pkg/pkg/package.json | grep -A1 '"@yao-pkg/pkg-fetch"' | tail -1 | cut -d'"' -f4 | sed 's/\^//')
    - echo "  pkg-fetch version: ${PKG_FETCH_VERSION}"

    - NODE_MAJOR=$(echo "${NODE_VERSION}" | cut -d'.' -f1)
    - echo "  Node major version: ${NODE_MAJOR}"

    - echo "  Fetching FreeBSD node${NODE_MAJOR} patches..."
    - mkdir -p freebsd-patches
    - |
      set -e

      echo "  Cloning FreeBSD ports tree (shallow)..."
      git clone --depth 1 https://github.com/freebsd/freebsd-ports.git /tmp/freebsd-ports

      NODE_PORT_DIR="/tmp/freebsd-ports/www/node${NODE_MAJOR}/files"

      if [ ! -d "${NODE_PORT_DIR}" ]; then
        echo "ERROR: node${NODE_MAJOR} port directory not found"
        exit 1
      fi

      patch_count=0
      for patch_file in ${NODE_PORT_DIR}/patch-*; do
        if [ -f "${patch_file}" ]; then
          cp "${patch_file}" freebsd-patches/
          patch_count=$((patch_count + 1))
        fi
      done

      echo "  Copied ${patch_count} FreeBSD node${NODE_MAJOR} patches"

      if [ "${patch_count}" -eq 0 ]; then
        echo "ERROR: No FreeBSD node${NODE_MAJOR} patches found"
        exit 1
      fi

    - cd node_modules/@yao-pkg/pkg-fetch/patches
    - cp "node.v${NODE_VERSION}.cpp.patch" "node.v${NODE_VERSION}.cpp.patch.orig"

    - echo "  Appending FreeBSD patches..."
    - |
      for patch_file in /tmp/patch-workspace/freebsd-patches/patch-*; do
        if [ -f "${patch_file}" ]; then
          sed 's#^--- #--- node/#g; s#^+++ #+++ node/#g' "${patch_file}" >> "node.v${NODE_VERSION}.cpp.patch"
        fi
      done

    - cd /tmp/patch-workspace
    - echo "  Generating patch-package diff..."
    - npx patch-package "@yao-pkg/pkg-fetch"

    - cd patches
    - PATCH_FILE=$(ls @yao-pkg+pkg-fetch+*.patch 2>/dev/null | head -1)
    - UPSTREAM_URL="https://github.com/yao-pkg/pkg-fetch/raw/v${PKG_FETCH_VERSION}/patches/node.v${NODE_VERSION}.cpp.patch"
    - |
      {
        echo "${UPSTREAM_URL}"
        echo "+ local FreeBSD patches"
        grep -v '^diff --git' "${PATCH_FILE}" | \
          sed 's#^--- a/node_modules#--- yao-pkg/node_modules#g; s#^+++ b/node_modules#+++ yao-pkg/node_modules#g'
      } > "${CIRRUS_WORKING_DIR}/extra-patch-pkg-fetch_patches_node.v${NODE_VERSION}.cpp.patch"

    - cd "${CIRRUS_WORKING_DIR}"
    - echo "--- Patch generated: $(wc -l < extra-patch-pkg-fetch_patches_node.v${NODE_VERSION}.cpp.patch) lines ---"

  smoke_test_script:
    - echo "--- Smoke-testing cache offline ---"
    - |
      dir_count=$(wc -l < /tmp/npm-dirs.txt)
      echo "  Testing ${dir_count} directories..."

      success=0
      failed=0

      while IFS= read -r npm_dir; do
        if [ -f "${npm_dir}/package.json" ]; then
          rm -rf "${npm_dir}/node_modules"

          if npm install --offline --cache "${NPM_CACHE}" --ignore-scripts --prefix "${npm_dir}" "${npm_dir}" >/dev/null 2>&1; then
            success=$((success + 1))
          else
            dir_name="${npm_dir#src/}"
            echo "  ✗ FAILED: ${dir_name}"
            failed=$((failed + 1))
          fi
        fi
      done < /tmp/npm-dirs.txt

      # Also test yao-pkg
      rm -rf src/yao-pkg/node_modules
      if npm install --offline --cache "${NPM_CACHE}" --ignore-scripts --prefix src/yao-pkg "@yao-pkg/pkg@${YAO_PKG_VER}" >/dev/null 2>&1; then
        success=$((success + 1))
      else
        echo "  ✗ FAILED: yao-pkg"
        failed=$((failed + 1))
      fi

      echo ""
      echo "--- Smoke-test results ---"
      echo "  Success: ${success}"
      echo "  Failed: ${failed}"

      if [ ${failed} -gt 0 ]; then
        echo ""
        echo "ERROR: ${failed} directories failed offline install"
        echo "Try increasing CACHE_TIER or adding specific failing directories"
        exit 1
      fi

      echo "--- All directories passed offline test ---"

  report_script:
    - echo "========================================"
    - echo "FINAL CACHE STATISTICS (Tier ${CACHE_TIER})"
    - echo "========================================"
    - |
      file_count=$(find "${NPM_CACHE}/_cacache" -type f | wc -l)
      echo "  Total files: ${file_count}"
    - |
      cache_size=$(du -sh "${NPM_CACHE}/_cacache" | awk '{print $1}')
      echo "  Total size: ${cache_size}"
    - |
      dir_count=$(wc -l < /tmp/npm-dirs.txt)
      echo "  Directories cached: ${dir_count}"
    - |
      lockfile_count=$(find lockfiles -name package-lock.json 2>/dev/null | wc -l)
      echo "  Lockfiles generated (server only): ${lockfile_count}"
    - echo ""
    - echo "Strategy: Server uses lockfiles, sdkjs/framework7 use shrinkwrap"

  commit_script:
    - DATE=$(date -u +%Y%m%d%H%M)
    - NEW_TAG="${DS_TAG}-${DATE}-tier${CACHE_TIER}"
    - echo "Committing as tag ${NEW_TAG}"

    # Clean up cache
    - rm -rf "${NPM_CACHE}/_logs"
    - rm -rf "${NPM_CACHE}/_update-notifier-last-checked"

    # Remove old cache and lockfiles from repo
    - echo "--- Removing old artifacts from repo ---"
    - rm -rf _cacache
    - rm -rf lockfiles
    - echo "  ✓ Old cache and lockfiles removed"

    # Copy new artifacts
    - echo "--- Copying new artifacts ---"
    - cp -r "${NPM_CACHE}/_cacache" _cacache
    - echo "  ✓ Cache copied"

    # Copy lockfiles (only from server/*)
    - echo "--- Copying new lockfiles ---"
    - cp -r "src/lockfiles" lockfiles
    - echo "Lockfiles copied"

    # Copy yao-pkg manifests
    - cp src/yao-pkg/package.json      yao-pkg-package.json
    - cp src/yao-pkg/package-lock.json yao-pkg-package-lock.json
    - echo "  ✓ yao-pkg manifests copied"

    # Add all artifacts
    - git add _cacache lockfiles/ yao-pkg-package.json yao-pkg-package-lock.json "extra-patch-pkg-fetch_patches_node.v${NODE_VERSION}.cpp.patch"
    - git commit -m "npm cache Tier ${CACHE_TIER} (server lockfiles only) for OnlyOffice DS ${DS_TAG} (${DATE})"
    - git tag "${NEW_TAG}" -m "OnlyOffice DS ${DS_TAG} Tier ${CACHE_TIER} optimized cache (${DATE})"
    - git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${CIRRUS_REPO_FULL_NAME}.git" HEAD --tags
    - echo ""
    - echo "✓ Successfully pushed tag ${NEW_TAG}"
    - echo ""
    - echo "Artifacts committed:"
    - echo "  - _cacache/ (npm cache)"
    - echo "  - lockfiles/ (server/* only - sdkjs/framework7 use shrinkwrap)"
    - echo "  - yao-pkg manifests"
    - echo "  - extra-patch-pkg-fetch patch"
    - echo ""
    - echo "Update your port GH_TUPLE to:"
    - echo "  fsbruva:onlyoffice-DS-npm-cache:${NEW_TAG}:npm_cache"
