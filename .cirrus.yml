# .cirrus.yml
#
# TWO-PHASE CACHE BUILD - MINIMIZED PACKUMENT STRATEGY
#
# Phase 1: Generate shrinkwraps (temporary cache, then deleted)
# Phase 2: Rebuild cache using shrinkwraps (tarballs only)
# Phase 3: Install package-lock dirs (packuments only for manual additions)
#
# Shrinkwrap files (9 dirs - tarballs only, no packuments):
#   1. sdkjs/build              (upstream shrinkwrap)
#   2. framework7-react         (upstream shrinkwrap)
#   3. server/Metrics           (upstream shrinkwrap)
#   4. sdkjs                    (created package.json with grunt)
#   5. server                   (patched with grunt)
#   6. server/Common            (generated shrinkwrap)
#   7. server/FileConverter     (patched with ms, generated shrinkwrap)
#   8. ds-package/home/npm      (generated shrinkwrap)
#   9. ds-integration/nodejs    (generated shrinkwrap, --omit=dev)
#
# Package-lock files (3 dirs - packuments cached for manual installs):
#   1. web-apps/build           (port adds patch-package, optipng-bin)
#   2. server/DocService        (port adds patch-package, sharp)
#   3. yao-pkg                  (port adds @yao-pkg/pkg)
#
# Expected cache size: ~110-130MB (vs ~160MB current)
# Packument overhead: ~1-2% (only for 3 package-lock dirs)

env:
  DS_VERSION:          "9.3.1"
  DS_BUILD:            "8"
  NODE_VERSION:        "20.20.0"
  SHARP_VER:           "0.32.6"
  YAO_PKG_VER:         "6.14.1"

  GITHUB_TOKEN: ENCRYPTED[cb63ddb701139b4dac8e4493476ef1ae09fa0078c69f2c153d968d93106a48a2263a08a5337848cc5d2641531b40e2fc]

  DS_TAG: "v${DS_VERSION}.${DS_BUILD}"
  NPM_CACHE: "/tmp/npm-cache"
  TEMP_CACHE: "/tmp/temp-cache"
  PORTS_BASE: "https://cgit.freebsd.org/ports/plain/www/onlyoffice-documentserver"

build_npm_cache_task:
  name: "Build npm Cache (Two-Phase Optimized)"
  trigger_type: manual

  freebsd_instance:
    image_family: freebsd-14-3
    cpu: 4
    memory: 8GB
    disk: 50

  timeout_in: 60m

  install_script:
    - NODE_MAJOR=$(echo "${NODE_VERSION}" | cut -d'.' -f1)
    - echo "Node major version: ${NODE_MAJOR}"
    - pkg install -y "npm-node${NODE_MAJOR}" git
    - node --version
    - npm --version

  clone_script:
    - git clone --depth 1
        "https://x-access-token:${GITHUB_TOKEN}@github.com/${CIRRUS_REPO_FULL_NAME}.git"
        "${CIRRUS_WORKING_DIR}"
    - git config user.name  "cirrus-ci[bot]"
    - git config user.email "cirrus-ci[bot]@users.noreply.github.com"

  clone_sources_script:
    - echo "Building cache for DS_TAG=${DS_TAG}"
    - git clone --depth 1 --branch "${DS_TAG}" --single-branch
        https://github.com/ONLYOFFICE/web-apps.git src/web-apps
    - git clone --depth 1 --branch "${DS_TAG}" --single-branch
        https://github.com/ONLYOFFICE/server.git src/server
    - git clone --depth 1 --branch "${DS_TAG}" --single-branch
        https://github.com/ONLYOFFICE/sdkjs.git src/sdkjs
    - git clone --depth 1 --branch "${DS_TAG}" --single-branch
        https://github.com/ONLYOFFICE/document-server-integration.git src/document-server-integration
    - git clone --depth 1 --branch "${DS_TAG}" --single-branch
        https://github.com/ONLYOFFICE/document-server-package.git src/document-server-package
    - echo "=== web-apps    ===" && git -C src/web-apps                   describe --tags
    - echo "=== server      ===" && git -C src/server                     describe --tags
    - echo "=== sdkjs       ===" && git -C src/sdkjs                      describe --tags
    - echo "=== integration ===" && git -C src/document-server-integration describe --tags
    - echo "=== ds-package  ===" && git -C src/document-server-package     describe --tags

  fetch_patches_script:
    - echo "--- Fetching FreeBSD port patches ---"
    - mkdir -p patches
    - fetch -o patches/patch-server_package.json "${PORTS_BASE}/files/patch-server_package.json"
    - fetch -o patches/patch-server_FileConverter_package.json "${PORTS_BASE}/files/patch-server_FileConverter_package.json"
    - fetch -o patches/patch-web-apps_build_package.json "${PORTS_BASE}/files/patch-web-apps_build_package.json"

    - echo "--- Creating custom multer patch for server/DocService ---"
    - |
      cat > patches/patch-server_DocService_package.json << 'EOF'
      --- server/DocService/package.json.orig	2026-02-23 07:24:11.000000000 +0000
      +++ server/DocService/package.json	2026-02-25 03:48:37.203046000 +0000
      @@ -28,7 +28,7 @@
           "mime-db": "1.53.0",
           "ms": "2.1.3",
           "mssql": "11.0.1",
      -    "multer": "1.4.4",
      +    "multer": "2.0.2",
           "multi-integer-range": "5.2.0",
           "multiparty": "4.2.3",
           "mysql2": "3.13.0",
      EOF

  # ================================================================== #
  # PHASE 1: GENERATE SHRINKWRAPS (temporary cache)                    #
  # ================================================================== #
  phase1_generate_shrinkwraps_script:
    - echo "========================================"
    - echo "PHASE 1: GENERATE SHRINKWRAPS"
    - echo "========================================"
    - mkdir -p "${TEMP_CACHE}"

    # 1. Upstream shrinkwrap dirs (already have shrinkwrap)
    - echo "1. Installing upstream shrinkwrap dirs..."
    - npm install --cache "${TEMP_CACHE}" --ignore-scripts --prefix src/sdkjs/build src/sdkjs/build
    - npm install --cache "${TEMP_CACHE}" --ignore-scripts --prefix src/web-apps/vendor/framework7-react src/web-apps/vendor/framework7-react
    - npm install --cache "${TEMP_CACHE}" --ignore-scripts --prefix src/server/Metrics src/server/Metrics
    - echo "  ✓ sdkjs/build, framework7-react, server/Metrics"

    # 2. server (patch to add grunt, then shrinkwrap)
    - echo "2. Patching server/package.json (grunt)..."
    - patch -p0 -d src < patches/patch-server_package.json
    - npm install --cache "${TEMP_CACHE}" --ignore-scripts --prefix src/server src/server
    - cd src/server && npm shrinkwrap && cd -
    - echo "  ✓ server/npm-shrinkwrap.json generated"

    # 3. sdkjs (create package.json with grunt)
    - echo "3. Creating sdkjs/package.json (grunt)..."
    - |
      cat > src/sdkjs/package.json << 'EOF'
      {
        "name": "sdkjs-build-deps",
        "version": "1.0.0",
        "private": true,
        "dependencies": {
          "grunt-cli": "^1.4.3",
          "grunt": "^1.6.1"
        }
      }
      EOF
    - npm install --cache "${TEMP_CACHE}" --ignore-scripts --prefix src/sdkjs src/sdkjs
    - cd src/sdkjs && npm shrinkwrap && cd -
    - echo "  ✓ sdkjs/package.json created"
    - echo "  ✓ sdkjs/npm-shrinkwrap.json generated"

    # 4. server/FileConverter (patch to add ms)
    - echo "4. Patching server/FileConverter/package.json (ms)..."
    - patch -p0 -d src < patches/patch-server_FileConverter_package.json
    - npm install --cache "${TEMP_CACHE}" --ignore-scripts --prefix src/server/FileConverter src/server/FileConverter
    - cd src/server/FileConverter && npm shrinkwrap && cd -
    - echo "  ✓ server/FileConverter/npm-shrinkwrap.json generated"

    # 5. server/Common
    - echo "5. Installing server/Common..."
    - npm install --cache "${TEMP_CACHE}" --ignore-scripts --prefix src/server/Common src/server/Common
    - cd src/server/Common && npm shrinkwrap && cd -
    - echo "  ✓ server/Common/npm-shrinkwrap.json generated"

    # 6. document-server-package/home/npm
    - echo "6. Installing document-server-package/home/npm..."
    - npm install --cache "${TEMP_CACHE}" --ignore-scripts --prefix src/document-server-package/common/documentserver/home/npm src/document-server-package/common/documentserver/home/npm
    - cd src/document-server-package/common/documentserver/home/npm && npm shrinkwrap && cd -
    - echo "  ✓ document-server-package/.../npm-shrinkwrap.json generated"

    # 7. document-server-integration (--omit=dev)
    - echo "7. Installing document-server-integration/nodejs (--omit=dev)..."
    - npm install --cache "${TEMP_CACHE}" --ignore-scripts --omit=dev --prefix src/document-server-integration/web/documentserver-example/nodejs src/document-server-integration/web/documentserver-example/nodejs
    - cd src/document-server-integration/web/documentserver-example/nodejs && npm shrinkwrap && cd -
    - echo "  ✓ document-server-integration/.../npm-shrinkwrap.json generated"

    - echo ""
    - echo "Phase 1 complete: 9 shrinkwrap files generated"
    - echo "Temporary cache size: $(du -sh ${TEMP_CACHE} | awk '{print $1}')"

  # ================================================================== #
  # PHASE 2: DELETE CACHE AND REBUILD (tarballs only)                 #
  # ================================================================== #
  phase2_delete_and_rebuild_script:
    - echo "========================================"
    - echo "PHASE 2: REBUILD CACHE (tarballs only)"
    - echo "========================================"
    - echo "Deleting temporary cache..."
    - rm -rf "${TEMP_CACHE}"
    - echo "Creating production cache..."
    - mkdir -p "${NPM_CACHE}"
    - echo ""
    - echo "Reinstalling with shrinkwraps (npm will only cache tarballs)..."

    # Install all 9 shrinkwrap dirs
    # npm sees shrinkwrap file → only caches tarballs, NOT packuments
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/sdkjs/build src/sdkjs/build
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/web-apps/vendor/framework7-react src/web-apps/vendor/framework7-react
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/server/Metrics src/server/Metrics
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/sdkjs src/sdkjs
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/server src/server
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/server/Common src/server/Common
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/server/FileConverter src/server/FileConverter
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/document-server-package/common/documentserver/home/npm src/document-server-package/common/documentserver/home/npm
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --omit=dev --prefix src/document-server-integration/web/documentserver-example/nodejs src/document-server-integration/web/documentserver-example/nodejs

    - echo ""
    - echo "Phase 2 complete: 9 directories cached (tarballs only)"
    - echo "Production cache size: $(du -sh ${NPM_CACHE}/_cacache | awk '{print $1}')"

  # ================================================================== #
  # PHASE 3: PACKAGE-LOCK DIRS (cache packuments for manual installs) #
  # ================================================================== #
  phase3_packagelock_dirs_script:
    - echo "========================================"
    - echo "PHASE 3: PACKAGE-LOCK DIRS"
    - echo "========================================"
    - echo "Installing dirs where port adds packages (caches packuments)..."

    # web-apps/build
    - echo "1. web-apps/build (patch-package, optipng-bin)..."
    - patch -p0 -d src < patches/patch-web-apps_build_package.json
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/web-apps/build src/web-apps/build
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/web-apps/build patch-package
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/web-apps/build optipng-bin@5.1.0
    - echo "  ✓ web-apps/build/package-lock.json"

    # server/DocService
    - echo "2. server/DocService (patch-package, sharp)..."
    - patch -p0 -d src < patches/patch-server_DocService_package.json
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/server/DocService src/server/DocService
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/server/DocService patch-package
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/server/DocService "sharp@${SHARP_VER}"
    - echo "  ✓ server/DocService/package-lock.json"

    # yao-pkg
    - echo "3. yao-pkg (@yao-pkg/pkg, @esbuild packages)..."
    - mkdir -p src/yao-pkg
    - |
      cat > src/yao-pkg/package.json << 'EOF'
      {
        "name": "yao-pkg-cache-seed",
        "version": "1.0.0",
        "private": true,
        "dependencies": {}
      }
      EOF
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/yao-pkg "@yao-pkg/pkg@${YAO_PKG_VER}"
    - |
      for ARCH in x64 arm64; do
        npm cache add --force --cache "${NPM_CACHE}" "@esbuild/freebsd-${ARCH}"
      done
    - echo "  ✓ yao-pkg/package-lock.json"

    - echo ""
    - echo "Phase 3 complete: 3 directories with packuments cached"

  capture_artifacts_script:
    - echo "--- Capturing artifacts ---"
    - mkdir -p src/shrinkwrap src/lockfiles

    # Capture shrinkwraps (9 files)
    - echo "Capturing shrinkwrap files..."
    - mkdir -p src/shrinkwrap/sdkjs
    - mkdir -p src/shrinkwrap/server/Common
    - mkdir -p src/shrinkwrap/server/FileConverter
    - mkdir -p src/shrinkwrap/document-server-package/common/documentserver/home/npm
    - mkdir -p src/shrinkwrap/document-server-integration/web/documentserver-example/nodejs

    - cp src/sdkjs/npm-shrinkwrap.json src/shrinkwrap/sdkjs/
    - cp src/server/npm-shrinkwrap.json src/shrinkwrap/server/
    - cp src/server/Common/npm-shrinkwrap.json src/shrinkwrap/server/Common/
    - cp src/server/FileConverter/npm-shrinkwrap.json src/shrinkwrap/server/FileConverter/
    - cp src/document-server-package/common/documentserver/home/npm/npm-shrinkwrap.json src/shrinkwrap/document-server-package/common/documentserver/home/npm/
    - cp src/document-server-integration/web/documentserver-example/nodejs/npm-shrinkwrap.json src/shrinkwrap/document-server-integration/web/documentserver-example/nodejs/

    # Note: sdkjs/build, framework7-react, server/Metrics keep upstream shrinkwrap (not captured)

    - |
      shrinkwrap_count=$(find src/shrinkwrap -name npm-shrinkwrap.json | wc -l)
      echo "  Captured ${shrinkwrap_count} shrinkwrap files"

    # Capture package-locks (3 files)
    - echo "Capturing package-lock files..."
    - mkdir -p src/lockfiles/web-apps/build
    - mkdir -p src/lockfiles/server/DocService

    - cp src/web-apps/build/package-lock.json src/lockfiles/web-apps/build/
    - cp src/server/DocService/package-lock.json src/lockfiles/server/DocService/

    - |
      lockfile_count=$(find src/lockfiles -name package-lock.json | wc -l)
      echo "  Captured ${lockfile_count} package-lock files"

    # Capture created sdkjs/package.json
    - echo "Capturing sdkjs/package.json..."
    - cp src/sdkjs/package.json src/sdkjs-package.json

    # Capture yao-pkg files
    - echo "Capturing yao-pkg files..."
    - cp src/yao-pkg/package.json src/yao-pkg-package.json
    - cp src/yao-pkg/package-lock.json src/yao-pkg-package-lock.json

  generate_pkg_fetch_patch_script:
    - echo "--- Generating pkg-fetch FreeBSD node patch ---"
    - mkdir -p /tmp/patch-workspace
    - cd /tmp/patch-workspace

    - npm install --cache "${NPM_CACHE}" patch-package
    - npm install --cache "${NPM_CACHE}" "@yao-pkg/pkg@${YAO_PKG_VER}"

    - PKG_FETCH_VERSION=$(grep '"@yao-pkg/pkg-fetch"' node_modules/@yao-pkg/pkg/package.json | cut -d'"' -f4 | sed 's/\^//')
    - echo "  pkg-fetch version: ${PKG_FETCH_VERSION}"

    - NODE_MAJOR=$(echo "${NODE_VERSION}" | cut -d'.' -f1)

    - mkdir -p freebsd-patches
    - |
      set -e
      echo "  Cloning FreeBSD ports tree (shallow)..."
      git clone --depth 1 https://github.com/freebsd/freebsd-ports.git /tmp/freebsd-ports

      NODE_PORT_DIR="/tmp/freebsd-ports/www/node${NODE_MAJOR}/files"
      if [ ! -d "${NODE_PORT_DIR}" ]; then
        echo "ERROR: node${NODE_MAJOR} port directory not found"
        exit 1
      fi

      patch_count=0
      for patch_file in ${NODE_PORT_DIR}/patch-*; do
        if [ -f "${patch_file}" ]; then
          cp "${patch_file}" freebsd-patches/
          patch_count=$((patch_count + 1))
        fi
      done
      echo "  Copied ${patch_count} FreeBSD node${NODE_MAJOR} patches"

    - cd node_modules/@yao-pkg/pkg-fetch/patches
    - |
      for patch_file in /tmp/patch-workspace/freebsd-patches/patch-*; do
        if [ -f "${patch_file}" ]; then
          sed 's#^--- #--- node/#g; s#^+++ #+++ node/#g' "${patch_file}" >> "node.v${NODE_VERSION}.cpp.patch"
        fi
      done

    - cd /tmp/patch-workspace
    - npx patch-package "@yao-pkg/pkg-fetch"

    - cd patches
    - PATCH_FILE=$(ls @yao-pkg+pkg-fetch+*.patch 2>/dev/null | head -1)
    - UPSTREAM_URL="https://github.com/yao-pkg/pkg-fetch/raw/refs/tags/v${PKG_FETCH_VERSION}/patches/node.v${NODE_VERSION}.cpp.patch"
    - |
      {
        echo "${UPSTREAM_URL}"
        echo "+ local FreeBSD patches"
        grep -v '^diff --git\|^index ' "${PATCH_FILE}" | \
          sed 's#^--- a/node_modules#--- yao-pkg/node_modules#g; s#^+++ b/node_modules#+++ yao-pkg/node_modules#g'
      } > "${CIRRUS_WORKING_DIR}/extra-patch-pkg-fetch_patches_node.v${NODE_VERSION}.cpp.patch"

    - cd "${CIRRUS_WORKING_DIR}"
    - echo "--- Patch generated: $(wc -l < extra-patch-pkg-fetch_patches_node.v${NODE_VERSION}.cpp.patch) lines ---"

  smoke_test_script:
    - echo "--- Smoke-testing cache offline ---"
    - |
      # Test all 9 shrinkwrap dirs
      SHRINKWRAP_DIRS="
      src/sdkjs/build
      src/web-apps/vendor/framework7-react
      src/server/Metrics
      src/sdkjs
      src/server
      src/server/Common
      src/server/FileConverter
      src/document-server-package/common/documentserver/home/npm
      "

      success=0
      failed=0

      for npm_dir in ${SHRINKWRAP_DIRS}; do
        if [ -f "${npm_dir}/package.json" ]; then
          rm -rf "${npm_dir}/node_modules"
          if npm install --offline --cache "${NPM_CACHE}" --ignore-scripts \
              --prefix "${npm_dir}" "${npm_dir}" >/dev/null 2>&1; then
            success=$((success + 1))
          else
            echo "  ✗ FAILED: ${npm_dir#src/}"
            failed=$((failed + 1))
          fi
        fi
      done

      # Test integration (--omit=dev)
      INTEGRATION_DIR="src/document-server-integration/web/documentserver-example/nodejs"
      rm -rf "${INTEGRATION_DIR}/node_modules"
      if npm install --offline --cache "${NPM_CACHE}" --ignore-scripts \
          --omit=dev --prefix "${INTEGRATION_DIR}" "${INTEGRATION_DIR}" >/dev/null 2>&1; then
        success=$((success + 1))
      else
        echo "  ✗ FAILED: document-server-integration/nodejs"
        failed=$((failed + 1))
      fi

      # Test 3 package-lock dirs
      PACKAGELOCK_DIRS="
      src/web-apps/build
      src/server/DocService
      "

      for npm_dir in ${PACKAGELOCK_DIRS}; do
        if [ -f "${npm_dir}/package.json" ]; then
          rm -rf "${npm_dir}/node_modules"
          if npm install --offline --cache "${NPM_CACHE}" --ignore-scripts \
              --prefix "${npm_dir}" "${npm_dir}" >/dev/null 2>&1; then
            success=$((success + 1))
          else
            echo "  ✗ FAILED: ${npm_dir#src/}"
            failed=$((failed + 1))
          fi
        fi
      done

      # Test yao-pkg
      rm -rf src/yao-pkg/node_modules
      if npm install --offline --cache "${NPM_CACHE}" --ignore-scripts \
          --prefix src/yao-pkg "@yao-pkg/pkg@${YAO_PKG_VER}" >/dev/null 2>&1; then
        success=$((success + 1))
      else
        echo "  ✗ FAILED: yao-pkg"
        failed=$((failed + 1))
      fi

      echo ""
      echo "--- Smoke-test results ---"
      echo "  Success: ${success}"
      echo "  Failed:  ${failed}"

      if [ ${failed} -gt 0 ]; then
        echo ""
        echo "ERROR: ${failed} directories failed offline install"
        exit 1
      fi

      echo "--- All directories passed offline test ---"

  report_script:
    - echo "========================================"
    - echo "FINAL CACHE STATISTICS"
    - echo "========================================"
    - |
      file_count=$(find "${NPM_CACHE}/_cacache" -type f | wc -l)
      echo "  Total cached files: ${file_count}"
    - |
      cache_size=$(du -sh "${NPM_CACHE}/_cacache" | awk '{print $1}')
      echo "  Total cache size:   ${cache_size}"
    - |
      tarball_size=$(du -sh "${NPM_CACHE}/_cacache/content-v2" | awk '{print $1}')
      echo "  Tarballs:           ${tarball_size}"
    - |
      packument_size=$(du -sh "${NPM_CACHE}/_cacache/index-v5" | awk '{print $1}')
      echo "  Packuments:         ${packument_size}"
    - |
      shrinkwrap_count=$(find src/shrinkwrap -name npm-shrinkwrap.json 2>/dev/null | wc -l)
      echo "  Shrinkwrap files:   ${shrinkwrap_count}"
    - |
      lockfile_count=$(find src/lockfiles -name package-lock.json 2>/dev/null | wc -l)
      echo "  Package-lock files: ${lockfile_count}"
    - echo ""
    - echo "Strategy summary:"
    - echo "  Phase 1: Generated 9 shrinkwrap files (temp cache deleted)"
    - echo "  Phase 2: Installed 9 dirs with shrinkwrap (tarballs only)"
    - echo "  Phase 3: Installed 3 dirs with package-lock (packuments for manual installs)"
    - echo ""
    - echo "Shrinkwrap dirs (9): sdkjs/build, framework7-react, server/Metrics,"
    - echo "                     sdkjs, server, server/Common, server/FileConverter,"
    - echo "                     ds-package/home/npm, ds-integration/nodejs"
    - echo ""
    - echo "Package-lock dirs (3): web-apps/build, server/DocService, yao-pkg"

  commit_script:
    - DATE=$(date -u +%Y%m%d%H%M)
    - NEW_TAG="${DS_TAG}-${DATE}"
    - echo "Committing as tag ${NEW_TAG}"

    - rm -rf "${NPM_CACHE}/_logs"
    - rm -rf "${NPM_CACHE}/_update-notifier-last-checked"

    - rm -rf _cacache shrinkwrap lockfiles
    - cp -r "${NPM_CACHE}/_cacache" _cacache
    - cp -r src/shrinkwrap shrinkwrap
    - cp -r src/lockfiles lockfiles
    - cp src/sdkjs-package.json sdkjs-package.json
    - cp src/yao-pkg-package.json yao-pkg-package.json
    - cp src/yao-pkg-package-lock.json yao-pkg-package-lock.json

    - git add _cacache shrinkwrap/ lockfiles/ sdkjs-package.json yao-pkg-package.json yao-pkg-package-lock.json "extra-patch-pkg-fetch_patches_node.v${NODE_VERSION}.cpp.patch"
    - git commit -m "npm cache for OnlyOffice DS ${DS_TAG} (${DATE}) - two-phase optimized (9 shrinkwrap + 3 package-lock)"
    - git tag "${NEW_TAG}" -m "OnlyOffice DS ${DS_TAG} optimized cache (${DATE})"
    - git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${CIRRUS_REPO_FULL_NAME}.git" HEAD --tags
    - echo ""
    - echo "✓ Pushed tag ${NEW_TAG}"
    - echo ""
    - echo "Artifacts committed:"
    - echo "  - _cacache/ (npm cache, ~110-130MB)"
    - echo "  - shrinkwrap/ (6 generated shrinkwrap files)"
    - echo "  - lockfiles/ (3 package-lock.json files)"
    - echo "  - sdkjs-package.json (created file)"
    - echo "  - yao-pkg files"
    - echo "  - extra-patch-pkg-fetch patch"
    - echo ""
    - echo "Update GH_TUPLE to:"
    - echo "  fsbruva:onlyoffice-DS-npm-cache:${NEW_TAG}:npm_cache"
