# .cirrus.yml
#
# TWO-PHASE CACHE BUILD STRATEGY:
#   Phase 1: Generate optimal package-lock.json files
#   Phase 2: Rebuild cache using only exact versions from lockfiles
#
# This results in a much smaller cache by eliminating version exploration.

env:
  DS_VERSION:          "9.2.1"
  DS_BUILD:            "8"
  NODE_VERSION:        "20.20.0"
  SHARP_VER:           "0.32.6"
  MODERN_SYSLOG_VER:   "1.2.0"
  YAO_PKG_VER:         "6.14.1"

  GITHUB_TOKEN: ENCRYPTED[cb63ddb701139b4dac8e4493476ef1ae09fa0078c69f2c153d968d93106a48a2263a08a5337848cc5d2641531b40e2fc]

  DS_TAG: "v${DS_VERSION}.${DS_BUILD}"
  NPM_CACHE: "/tmp/npm-cache"
  NPM_CACHE_PHASE1: "/tmp/npm-cache-phase1"
  PORTS_BASE: "https://cgit.freebsd.org/ports/plain/www/onlyoffice-documentserver"

build_npm_cache_task:
  name: "Build npm Cache (Two-Phase)"
  trigger_type: manual

  freebsd_instance:
    image_family: freebsd-14-3
    cpu: 4
    memory: 8GB
    disk: 50

  timeout_in: 60m

  install_script:
    - pkg install -y npm-node20 git
    - node --version
    - npm --version

  clone_script:
    - git clone --depth 1
        "https://x-access-token:${GITHUB_TOKEN}@github.com/${CIRRUS_REPO_FULL_NAME}.git"
        "${CIRRUS_WORKING_DIR}"
    - git config user.name  "cirrus-ci[bot]"
    - git config user.email "cirrus-ci[bot]@users.noreply.github.com"

  clone_sources_script:
    - echo "Building cache for DS_TAG=${DS_TAG}"
    - git clone --depth 1 --branch "${DS_TAG}" --single-branch
        https://github.com/ONLYOFFICE/web-apps.git src/web-apps
    - git clone --depth 1 --branch "${DS_TAG}" --single-branch
        https://github.com/ONLYOFFICE/server.git src/server
    - git clone --depth 1 --branch "${DS_TAG}" --single-branch
        https://github.com/ONLYOFFICE/sdkjs.git src/sdkjs
    - echo "=== web-apps ===" && git -C src/web-apps describe --tags
    - echo "=== server    ===" && git -C src/server  describe --tags
    - echo "=== sdkjs     ===" && git -C src/sdkjs   describe --tags

  apply_patches_script:
    - echo "--- Fetching FreeBSD port patches ---"
    - mkdir -p patches
    - fetch -o patches/patch-server_package.json "${PORTS_BASE}/files/patch-server_package.json" || echo "WARN: patch not found"
    - fetch -o patches/patch-web-apps_build_package.json "${PORTS_BASE}/files/patch-web-apps_build_package.json" || echo "WARN: patch not found"
    - echo "--- Applying patches ---"
    - if [ -f patches/patch-server_package.json ]; then
        patch -p0 -d src < patches/patch-server_package.json && echo "  ✓ Applied server package.json";
      fi
    - if [ -f patches/patch-web-apps_build_package.json ]; then
        patch -p0 -d src < patches/patch-web-apps_build_package.json && echo "  ✓ Applied web-apps/build package.json";
      fi

  delete_shrinkwrap_script:
    - echo "--- Deleting npm-shrinkwrap.json files ---"
    - |
      echo "  Directories that had npm-shrinkwrap.json:"
      find src -type f -name npm-shrinkwrap.json -exec dirname {} \; | sed 's|^|    |'
      shrinkwrap_count=$(find src -type f -name npm-shrinkwrap.json | wc -l)
      echo "  Total: ${shrinkwrap_count} files"
    - find src -type f -name npm-shrinkwrap.json -delete
    - echo "  ✓ All shrinkwrap files deleted"

  discover_npm_dirs_script:
    - echo "--- Discovering npm package directories ---"
    - |
      find src -type f -name package.json \
        ! -path "*/v8_89/*" \
        ! -path "*/document-server-integration/*" \
        ! -path "*/document-server-package/*" \
        ! -path "*/onlyoffice.github.io/*" \
        ! -path "*/perfect-scrollbar/*" \
        -exec dirname {} \; | sort -u > /tmp/npm-dirs.txt

      dir_count=$(wc -l < /tmp/npm-dirs.txt)
      echo "  Found ${dir_count} npm directories"

  create_yao_pkg_script:
    - mkdir -p src/yao-pkg
    - |
      cat > src/yao-pkg/package.json << 'EOF'
      {
        "name": "yao-pkg-cache-seed",
        "version": "1.0.0",
        "private": true,
        "dependencies": {}
      }
      EOF
    - echo "src/yao-pkg" >> /tmp/npm-dirs.txt

  # ================================================================== #
  # PHASE 1: DISCOVERY - Generate optimal package-lock.json files     #
  # ================================================================== #
  phase1_discovery_script:
    - echo "========================================"
    - echo "PHASE 1: DISCOVERY - Generating Lockfiles"
    - echo "========================================"
    - |
      dir_count=$(wc -l < /tmp/npm-dirs.txt)
      echo "  Processing ${dir_count} directories to generate package-lock.json..."
      echo "  (This phase caches many versions during resolution)"

      success=0

      while IFS= read -r npm_dir; do
        if [ -f "${npm_dir}/package.json" ]; then
          dir_name="${npm_dir#src/}"

          # Run npm install to generate package-lock.json
          # Uses Phase 1 cache (will be discarded later)
          if npm install --cache "${NPM_CACHE_PHASE1}" --ignore-scripts --prefix "${npm_dir}" "${npm_dir}" 2>&1 | grep -v "^npm warn" > /dev/null; then
            success=$((success + 1))

            # Check if package-lock.json was generated
            if [ -f "${npm_dir}/package-lock.json" ]; then
              echo "  ✓ ${dir_name} (lockfile generated)"
            else
              echo "  ○ ${dir_name} (no lockfile - already exists or not needed)"
            fi
          else
            echo "  ✗ ${dir_name} (install failed)"
          fi
        fi
      done < /tmp/npm-dirs.txt

      echo ""
      echo "--- Phase 1 complete ---"
      echo "  Processed: ${success}/${dir_count} directories"

  # Port-specific versions in Phase 1
  phase1_port_deps_script:
    - echo "--- Phase 1: Port-specific dependencies ---"
    - npm install --cache "${NPM_CACHE_PHASE1}" --ignore-scripts --prefix src/web-apps/build patch-package
    - npm install --cache "${NPM_CACHE_PHASE1}" --ignore-scripts --prefix src/web-apps/build optipng-bin@5.1.0
    - npm install --cache "${NPM_CACHE_PHASE1}" --ignore-scripts --prefix src/server grunt-cli
    - npm install --cache "${NPM_CACHE_PHASE1}" --ignore-scripts --prefix src/server grunt
    - npm install --cache "${NPM_CACHE_PHASE1}" --ignore-scripts --prefix src/server/DocService "sharp@${SHARP_VER}"
    - npm install --cache "${NPM_CACHE_PHASE1}" --ignore-scripts --prefix src/server/DocService patch-package
    - npm install --cache "${NPM_CACHE_PHASE1}" --ignore-scripts --prefix src/server/Metrics "modern-syslog@${MODERN_SYSLOG_VER}"
    - npm install --cache "${NPM_CACHE_PHASE1}" --ignore-scripts --prefix src/server/Metrics patch-package
    - npm install --cache "${NPM_CACHE_PHASE1}" --ignore-scripts --prefix src/sdkjs/build grunt-cli
    - npm install --cache "${NPM_CACHE_PHASE1}" --ignore-scripts --prefix src/sdkjs/build grunt
    - npm install --cache "${NPM_CACHE_PHASE1}" --ignore-scripts --prefix src/yao-pkg "@yao-pkg/pkg@${YAO_PKG_VER}"

  # Capture generated lockfiles
  capture_lockfiles_script:
    - echo "--- Capturing generated package-lock.json files ---"
    - mkdir -p /tmp/lockfiles
    - |
      lockfile_count=0
      while IFS= read -r npm_dir; do
        if [ -f "${npm_dir}/package-lock.json" ]; then
          # Save the lockfile with path encoding
          lockfile_path=$(echo "${npm_dir}" | sed 's|/|__|g')
          cp "${npm_dir}/package-lock.json" "/tmp/lockfiles/${lockfile_path}.json"
          lockfile_count=$((lockfile_count + 1))
        fi
      done < /tmp/npm-dirs.txt

      echo "  Captured ${lockfile_count} package-lock.json files"
    - ls -lh /tmp/lockfiles/ | tail -20

  # Report Phase 1 cache size
  phase1_report_script:
    - echo "--- Phase 1 Cache Statistics ---"
    - |
      if [ -d "${NPM_CACHE_PHASE1}/_cacache" ]; then
        file_count=$(find "${NPM_CACHE_PHASE1}/_cacache" -type f | wc -l)
        cache_size=$(du -sh "${NPM_CACHE_PHASE1}/_cacache" | awk '{print $1}')
        echo "  Phase 1 cache size: ${cache_size}"
        echo "  Phase 1 cache files: ${file_count}"
        echo "  (This cache includes many versions during resolution)"
      fi

  # ================================================================== #
  # PHASE 2: OPTIMIZED REBUILD - Cache only exact versions            #
  # ================================================================== #
  phase2_prepare_script:
    - echo "========================================"
    - echo "PHASE 2: OPTIMIZED REBUILD"
    - echo "========================================"
    - echo "--- Removing Phase 1 cache (will be rebuilt with lockfiles) ---"
    - rm -rf "${NPM_CACHE_PHASE1}"
    - echo "  ✓ Phase 1 cache removed"
    - echo ""
    - echo "--- Removing node_modules from all directories ---"
    - |
      while IFS= read -r npm_dir; do
        rm -rf "${npm_dir}/node_modules"
      done < /tmp/npm-dirs.txt
    - echo "  ✓ All node_modules removed"

  phase2_rebuild_script:
    - echo "--- Phase 2: Rebuilding cache with lockfiles (exact versions only) ---"
    - |
      dir_count=$(wc -l < /tmp/npm-dirs.txt)
      echo "  Processing ${dir_count} directories..."
      echo "  (This phase caches ONLY exact versions from lockfiles)"

      success=0

      while IFS= read -r npm_dir; do
        if [ -f "${npm_dir}/package.json" ]; then
          dir_name="${npm_dir#src/}"

          # Now npm install will use the package-lock.json that was generated in Phase 1
          if npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix "${npm_dir}" "${npm_dir}" 2>&1 | grep -v "^npm warn" > /dev/null; then
            success=$((success + 1))
          else
            echo "  ✗ ${dir_name} (rebuild failed)"
          fi
        fi
      done < /tmp/npm-dirs.txt

      echo ""
      echo "--- Phase 2 complete ---"
      echo "  Rebuilt: ${success}/${dir_count} directories"

  # Port-specific versions in Phase 2
  phase2_port_deps_script:
    - echo "--- Phase 2: Port-specific dependencies ---"
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/web-apps/build patch-package
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/web-apps/build optipng-bin@5.1.0
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/server grunt-cli
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/server grunt
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/server/DocService "sharp@${SHARP_VER}"
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/server/DocService patch-package
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/server/Metrics "modern-syslog@${MODERN_SYSLOG_VER}"
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/server/Metrics patch-package
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/sdkjs/build grunt-cli
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/sdkjs/build grunt
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/yao-pkg "@yao-pkg/pkg@${YAO_PKG_VER}"

  generate_pkg_fetch_patch_script:
    - echo "--- Generating pkg-fetch FreeBSD node patch ---"
    - mkdir -p /tmp/patch-workspace
    - cd /tmp/patch-workspace
    - npm install --cache "${NPM_CACHE}" --ignore-scripts patch-package
    - npm install --cache "${NPM_CACHE}" --ignore-scripts "@yao-pkg/pkg@${YAO_PKG_VER}"
    - PKG_FETCH_VERSION=$(cat node_modules/@yao-pkg/pkg/package.json | grep -A1 '"@yao-pkg/pkg-fetch"' | tail -1 | cut -d'"' -f4 | sed 's/\^//')
    - echo "  pkg-fetch version: ${PKG_FETCH_VERSION}"

    # Fetch FreeBSD node20 patches from GitHub mirror (robust, no HTML scraping)
    - echo "  Fetching FreeBSD node20 patches from GitHub..."
    - mkdir -p freebsd-patches
    - |
      set -e
      # Use GitHub API to list files in www/node20/files/
      GITHUB_API="https://api.github.com/repos/freebsd/freebsd-ports/contents/www/node20/files"

      echo "    Querying GitHub API..."
      patch_files=$(fetch -qo - "${GITHUB_API}" | grep '"name":' | grep 'patch-.*\.patch' | cut -d'"' -f4)

      patch_count=0
      for patch_file in ${patch_files}; do
        echo "    Downloading ${patch_file}..."
        GITHUB_RAW="https://raw.githubusercontent.com/freebsd/freebsd-ports/main/www/node20/files/${patch_file}"
        if fetch -o "freebsd-patches/${patch_file}" "${GITHUB_RAW}" 2>/dev/null; then
          patch_count=$((patch_count + 1))
        fi
      done

      echo "  Downloaded ${patch_count} FreeBSD patches"

    # Backup original pkg-fetch patch
    - cd node_modules/@yao-pkg/pkg-fetch/patches
    - cp "node.v${NODE_VERSION}.cpp.patch" "node.v${NODE_VERSION}.cpp.patch.orig"

    # Append FreeBSD patches with modified paths
    - echo "  Appending FreeBSD patches to pkg-fetch node patch..."
    - |
      for patch_file in /tmp/patch-workspace/freebsd-patches/patch-*; do
        if [ -f "${patch_file}" ]; then
          sed 's#^--- #--- node/#g; s#^+++ #+++ node/#g' "${patch_file}" >> "node.v${NODE_VERSION}.cpp.patch"
        fi
      done

    # Generate patch-package diff
    - cd /tmp/patch-workspace
    - echo "  Generating patch-package diff..."
    - npx patch-package "@yao-pkg/pkg-fetch"

    # Process and create final patch
    - cd patches
    - PATCH_FILE=$(ls @yao-pkg+pkg-fetch+*.patch 2>/dev/null | head -1)
    - UPSTREAM_URL="https://github.com/yao-pkg/pkg-fetch/raw/v${PKG_FETCH_VERSION}/patches/node.v${NODE_VERSION}.cpp.patch"
    - |
      {
        echo "${UPSTREAM_URL}"
        echo "+ local FreeBSD patches"
        grep -v '^diff --git' "${PATCH_FILE}" | \
          sed 's#^--- a/node_modules#--- yao-pkg/node_modules#g; s#^+++ b/node_modules#+++ yao-pkg/node_modules#g'
      } > "${CIRRUS_WORKING_DIR}/extra-patch-pkg-fetch_patches_node.v${NODE_VERSION}.cpp.patch"

    # Verify
    - cd "${CIRRUS_WORKING_DIR}"
    - |
      line_count=$(wc -l < "extra-patch-pkg-fetch_patches_node.v${NODE_VERSION}.cpp.patch")
      echo "--- Patch generated: ${line_count} lines ---"

  smoke_test_script:
    - echo "--- Smoke-testing Phase 2 cache offline ---"
    - |
      dir_count=$(wc -l < /tmp/npm-dirs.txt)
      echo "  Testing ${dir_count} directories..."

      success=0
      failed=0

      while IFS= read -r npm_dir; do
        if [ -f "${npm_dir}/package.json" ]; then
          rm -rf "${npm_dir}/node_modules"

          if npm install --offline --cache "${NPM_CACHE}" --ignore-scripts --prefix "${npm_dir}" "${npm_dir}" >/dev/null 2>&1; then
            success=$((success + 1))
          else
            dir_name="${npm_dir#src/}"
            echo "  ✗ FAILED: ${dir_name}"
            failed=$((failed + 1))
          fi
        fi
      done < /tmp/npm-dirs.txt

      echo ""
      echo "--- Smoke-test results ---"
      echo "  Success: ${success}"
      echo "  Failed: ${failed}"

      if [ ${failed} -gt 0 ]; then
        echo ""
        echo "ERROR: ${failed} directories failed offline install"
        exit 1
      fi

      echo "--- All directories passed offline test ---"

  report_script:
    - echo "========================================"
    - echo "FINAL CACHE STATISTICS"
    - echo "========================================"
    - |
      file_count=$(find "${NPM_CACHE}/_cacache" -type f | wc -l)
      echo "  Total files: ${file_count}"
    - |
      cache_size=$(du -sh "${NPM_CACHE}/_cacache" | awk '{print $1}')
      echo "  Total size: ${cache_size}"
    - |
      dir_count=$(wc -l < /tmp/npm-dirs.txt)
      echo "  Directories cached: ${dir_count}"
    - |
      lockfile_count=$(ls /tmp/lockfiles/*.json 2>/dev/null | wc -l)
      echo "  Lockfiles generated: ${lockfile_count}"
    - echo ""
    - echo "Two-phase optimization complete!"

  commit_lockfiles_script:
    - echo "--- Committing generated package-lock.json files ---"
    - |
      # Create directory structure in repo
      mkdir -p lockfiles

      # Copy all generated lockfiles
      lockfile_count=0
      while IFS= read -r npm_dir; do
        if [ -f "${npm_dir}/package-lock.json" ]; then
          # Preserve directory structure
          rel_path="${npm_dir#src/}"
          target_dir="lockfiles/${rel_path}"
          mkdir -p "${target_dir}"
          cp "${npm_dir}/package-lock.json" "${target_dir}/package-lock.json"
          lockfile_count=$((lockfile_count + 1))
          echo "  Saved: ${rel_path}/package-lock.json"
        fi
      done < /tmp/npm-dirs.txt

      echo "  Total lockfiles saved: ${lockfile_count}"

  commit_script:
    - DATE=$(date -u +%Y%m%d%H)
    - NEW_TAG="${DS_TAG}-${DATE}-CI"
    - echo "Committing as tag ${NEW_TAG}"
    - rm -rf "${NPM_CACHE}/_logs"
    - rm -rf "${NPM_CACHE}/_update-notifier-last-checked"
    - rm -rf _cacache
    - cp -r "${NPM_CACHE}/_cacache" _cacache
    - cp src/yao-pkg/package.json      yao-pkg-package.json
    - cp src/yao-pkg/package-lock.json yao-pkg-package-lock.json
    - git add _cacache lockfiles/ yao-pkg-package.json yao-pkg-package-lock.json "extra-patch-pkg-fetch_patches_node.v${NODE_VERSION}.cpp.patch"
    - git commit -m "npm cache (TWO-PHASE OPTIMIZED) for OnlyOffice DS ${DS_TAG} (${DATE})"
    - git tag "${NEW_TAG}" -m "OnlyOffice DS ${DS_TAG} two-phase optimized cache (${DATE})"
    - git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${CIRRUS_REPO_FULL_NAME}.git" HEAD --tags
    - echo ""
    - echo "✓ Successfully pushed tag ${NEW_TAG}"
    - echo ""
    - echo "Update your port GH_TUPLE to:"
    - echo "  fsbruva:onlyoffice-DS-npm-cache:${NEW_TAG}:npm_cache"
