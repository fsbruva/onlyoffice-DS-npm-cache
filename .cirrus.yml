# .cirrus.yml
#
# SINGLE-PHASE CACHE BUILD - MAKEFILE-EXPLICIT DIRECTORIES
#
# Install order (minimizes cache size and version duplication):
#   1. Shrinkwrap-pinned dirs  (sdkjs/build, web-apps/vendor/framework7-react) — deterministic baseline
#   2. Upstream dirs           (server/*, web-apps/build, home/npm) — lockfile generation
#   3. document-server-integration — upstream, but --omit=dev (eslint devDeps not needed)
#   4. Port-specific deps      (grunt, sharp, modern-syslog, etc.) — added on top of upstream
#   5. yao-pkg                 — self-contained, last
#
# Shrinkwrap strategy:
#   - src/sdkjs/build        : shrinkwrap KEPT   (pinned, no port patches)
#   - src/server/*           : shrinkwrap DELETED (3 dirs patched, lockfiles regenerated)
#   - All other dirs         : no shrinkwrap present

env:
  DS_VERSION:          "9.3.1"
  DS_BUILD:            "8"
  NODE_VERSION:        "20.20.0"
  SHARP_VER:           "0.32.6"
  YAO_PKG_VER:         "6.14.1"

  GITHUB_TOKEN: ENCRYPTED[cb63ddb701139b4dac8e4493476ef1ae09fa0078c69f2c153d968d93106a48a2263a08a5337848cc5d2641531b40e2fc]

  DS_TAG: "v${DS_VERSION}.${DS_BUILD}"
  NPM_CACHE: "/tmp/npm-cache"
  PORTS_BASE: "https://cgit.freebsd.org/ports/plain/www/onlyoffice-documentserver"

build_npm_cache_task:
  name: "Build npm Cache"
  trigger_type: manual

  freebsd_instance:
    image_family: freebsd-14-3
    cpu: 4
    memory: 8GB
    disk: 50

  timeout_in: 60m

  install_script:
    - NODE_MAJOR=$(echo "${NODE_VERSION}" | cut -d'.' -f1)
    - echo "Node major version: ${NODE_MAJOR}"
    - pkg install -y "npm-node${NODE_MAJOR}" git
    - node --version
    - npm --version

  clone_script:
    - git clone --depth 1
        "https://x-access-token:${GITHUB_TOKEN}@github.com/${CIRRUS_REPO_FULL_NAME}.git"
        "${CIRRUS_WORKING_DIR}"
    - git config user.name  "cirrus-ci[bot]"
    - git config user.email "cirrus-ci[bot]@users.noreply.github.com"

  clone_sources_script:
    - echo "Building cache for DS_TAG=${DS_TAG}"
    - git clone --depth 1 --branch "${DS_TAG}" --single-branch
        https://github.com/ONLYOFFICE/web-apps.git src/web-apps
    - git clone --depth 1 --branch "${DS_TAG}" --single-branch
        https://github.com/ONLYOFFICE/server.git src/server
    - git clone --depth 1 --branch "${DS_TAG}" --single-branch
        https://github.com/ONLYOFFICE/sdkjs.git src/sdkjs
    - git clone --depth 1 --branch "${DS_TAG}" --single-branch
        https://github.com/ONLYOFFICE/document-server-integration.git src/document-server-integration
    - git clone --depth 1 --branch "${DS_TAG}" --single-branch
        https://github.com/ONLYOFFICE/document-server-package.git src/document-server-package
    - echo "=== web-apps    ===" && git -C src/web-apps                   describe --tags
    - echo "=== server      ===" && git -C src/server                     describe --tags
    - echo "=== sdkjs       ===" && git -C src/sdkjs                      describe --tags
    - echo "=== integration ===" && git -C src/document-server-integration describe --tags
    - echo "=== ds-package  ===" && git -C src/document-server-package     describe --tags

  apply_patches_script:
    - echo "--- Fetching FreeBSD port patches ---"
    - mkdir -p patches
    - fetch -o patches/patch-server_package.json "${PORTS_BASE}/files/patch-server_package.json" || echo "WARN: patch not found"
    - fetch -o patches/patch-web-apps_build_package.json "${PORTS_BASE}/files/patch-web-apps_build_package.json" || echo "WARN: patch not found"

    - echo "--- Creating custom multer patch for server/DocService ---"
    - |
      cat > patches/patch-server_DocService_package.json << 'EOF'
      --- server/DocService/package.json.orig	2026-02-23 07:24:11.000000000 +0000
      +++ server/DocService/package.json	2026-02-25 03:48:37.203046000 +0000
      @@ -28,7 +28,7 @@
           "mime-db": "1.53.0",
           "ms": "2.1.3",
           "mssql": "11.0.1",
      -    "multer": "1.4.4",
      +    "multer": "2.0.2",
           "multi-integer-range": "5.2.0",
           "multiparty": "4.2.3",
           "mysql2": "3.13.0",
      EOF

    - echo "--- Applying patches ---"
    - if [ -f patches/patch-server_package.json ]; then
        patch -p0 -d src < patches/patch-server_package.json && echo "  ✓ Applied server package.json";
      fi
    - if [ -f patches/patch-web-apps_build_package.json ]; then
        patch -p0 -d src < patches/patch-web-apps_build_package.json && echo "  ✓ Applied web-apps/build package.json";
      fi
    - if [ -f patches/patch-server_DocService_package.json ]; then
        patch -p0 -d src < patches/patch-server_DocService_package.json && echo "  ✓ Applied server/DocService package.json (multer)";
      fi

  delete_shrinkwrap_script:
    # Only delete shrinkwrap for server/* — sdkjs/build and framework7-react keep their shrinkwrap (pinned, unpatched).
    # Within server/*, only 3 dirs are actually patched, but we delete all shrinkwrap files
    # there so npm regenerates consistent lockfiles across the whole server subtree.
    - echo "--- Deleting npm-shrinkwrap.json files (server/* only) ---"
    - |
      find src/server -type f -name npm-shrinkwrap.json \
        -exec dirname {} \; | sort -u > /tmp/shrinkwrap-dirs.txt

      dir_count=$(wc -l < /tmp/shrinkwrap-dirs.txt)
      cat /tmp/shrinkwrap-dirs.txt | sed 's|^src/|    |'
      echo "  Found ${dir_count} shrinkwrap directories in server"
    - rm src/server/npm-shrinkwrap.json
    - rm src/server/Common/npm-shrinkwrap.json
    - rm src/server/DocService/npm-shrinkwrap.json
    - rm src/server/FileConverter/npm-shrinkwrap.json
    - echo "  ✓ server/* shrinkwrap deleted — sdkjs/build and web-apps/vendor/framework7-react shrinkwrap retained"

  # ================================================================== #
  # PHASE 1: Shrinkwrap-pinned dirs                                    #
  # Installed first so their exact pinned versions become the cache    #
  # baseline. Any later dir sharing a dep will hit the cache rather    #
  # than pulling a different version.                                  #
  # ================================================================== #
  cache_shrinkwrap_dirs_script:
    - echo "========================================"
    - echo "PHASE 1: SHRINKWRAP-PINNED DIRECTORIES"
    - echo "========================================"
    - |
      # Add further entries here if additional shrinkwrap-retained dirs are identified
      SHRINKWRAP_DIRS="
      src/sdkjs/build
      src/web-apps/vendor/framework7-react
      "

      for npm_dir in ${SHRINKWRAP_DIRS}; do
        if [ -f "${npm_dir}/package.json" ]; then
          dir_name="${npm_dir#src/}"
          echo "  Installing (pinned): ${dir_name}"
          npm install \
            --cache "${NPM_CACHE}" \
            --ignore-scripts \
            --prefix "${npm_dir}" \
            "${npm_dir}" 2>&1 | grep -v "^npm warn"
          echo "  ✓ ${dir_name}"
        else
          echo "  SKIP (no package.json): ${npm_dir}"
        fi
      done

  # ================================================================== #
  # PHASE 2: Upstream dirs (server/*, web-apps/build, home/npm)       #
  # These run after the pinned baseline so shared deps are already     #
  # cached. server/* has no shrinkwrap so npm re-resolves and writes   #
  # package-lock.json files.                                           #
  # ================================================================== #
  cache_upstream_dirs_script:
    - echo "========================================"
    - echo "PHASE 2a: UPSTREAM DIRS (full deps)"
    - echo "========================================"
    - |
      # All Makefile-explicit dirs except: sdkjs/build (phase 1),
      # document-server-integration (phase 2b), and yao-pkg (phase 5)
      UPSTREAM_DIRS="
      src/web-apps/build
      src/server
      src/server/Common
      src/server/DocService
      src/server/FileConverter
      src/document-server-package/common/documentserver/home/npm
      "

      success=0
      failed=0

      for npm_dir in ${UPSTREAM_DIRS}; do
        if [ -f "${npm_dir}/package.json" ]; then
          dir_name="${npm_dir#src/}"
          npm install \
            --cache "${NPM_CACHE}" \
            --ignore-scripts \
            --prefix "${npm_dir}" \
            "${npm_dir}" 2>&1 | grep -v "^npm warn"

          if [ $? -eq 0 ]; then
            success=$((success + 1))
            if [ -f "${npm_dir}/package-lock.json" ]; then
              echo "  ✓ ${dir_name} (lockfile generated)"
            else
              echo "  ○ ${dir_name} (using shrinkwrap)"
            fi
          else
            echo "  ✗ ${dir_name} (install failed)"
            failed=$((failed + 1))
          fi
        fi
      done

      echo ""
      echo "Phase 2a: ${success} succeeded, ${failed} failed"
      if [ ${failed} -gt 0 ]; then
        echo "WARNING: ${failed} upstream dirs failed"
      fi

    - echo "========================================"
    - echo "PHASE 2b: DOCUMENT-SERVER-INTEGRATION (--omit=dev)"
    - echo "========================================"
    # eslint and airbnb-config are devDependencies here — not needed at build time.
    # --omit=dev keeps them out of the cache entirely.
    - |
      INTEGRATION_DIR="src/document-server-integration/web/documentserver-example/nodejs"
      if [ -f "${INTEGRATION_DIR}/package.json" ]; then
        npm install \
          --cache "${NPM_CACHE}" \
          --ignore-scripts \
          --omit=dev \
          --prefix "${INTEGRATION_DIR}" \
          "${INTEGRATION_DIR}" 2>&1 | grep -v "^npm warn"
        echo "  ✓ document-server-integration/nodejs (devDeps omitted)"
      else
        echo "  SKIP: ${INTEGRATION_DIR}/package.json not found"
      fi

    - echo "========================================"
    - echo "PHASE 2c: METRICS (--omit=optional)"
    - echo "========================================"
    # modern-syslog is optional, but not used by onlyoffice  — not needed at build time.
    # using the upstream shrinkwrap excludes modern-syslog
    - |
      METRICS_DIR="src/server/Metrics"
      if [ -f "${METRICS_DIR}/package.json" ]; then
        npm install \
          --cache "${NPM_CACHE}" \
          --ignore-scripts \
          --prefix "${METRICS_DIR}" \
          "${METRICS_DIR}" 2>&1 | grep -v "^npm warn"
        echo "  ✓ server/Metrics (optionalDeps omitted)"
      else
        echo "  SKIP: ${METRICS_DIR}/package.json not found"
      fi

  # ================================================================== #
  # PHASE 3: Port-specific dependencies                                #
  # Installed INTO the same prefix dirs as above, so they layer on     #
  # top of the upstream install. Shared transitive deps are already    #
  # cached from phases 1-2 — only unique port-specific entries added.  #
  # ================================================================== #
  port_specific_deps_script:
    - echo "========================================"
    - echo "PHASE 3: PORT-SPECIFIC DEPENDENCIES"
    - echo "========================================"
    - echo "  web-apps/build: patch-package"
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/web-apps/build patch-package
    - echo "  web-apps/build: optipng-bin@5.1.0"
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/web-apps/build optipng-bin@5.1.0
    - echo "  server: grunt-cli"
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/server grunt-cli
    - echo "  server: grunt"
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/server grunt
    - echo "  server/DocService: patch-package"
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/server/DocService patch-package
    - echo "  server/DocService: sharp@${SHARP_VER}"
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/server/DocService "sharp@${SHARP_VER}"
    - echo "  sdkjs: grunt-cli"
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/sdkjs grunt-cli
    - echo "  sdkjs: grunt"
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/sdkjs grunt

  # ================================================================== #
  # PHASE 4: yao-pkg (self-contained, no overlap with upstream)        #
  # ================================================================== #
  cache_yao_pkg_script:
    - echo "========================================"
    - echo "PHASE 4: YAO-PKG"
    - echo "========================================"
    - mkdir -p src/yao-pkg
    - |
      cat > src/yao-pkg/package.json << 'EOF'
      {
        "name": "yao-pkg-cache-seed",
        "version": "1.0.0",
        "private": true,
        "dependencies": {}
      }
      EOF
    - npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix src/yao-pkg "@yao-pkg/pkg@${YAO_PKG_VER}"
      # Need to explicitly add (and force) the arch/platforms we need for @esbuild
    - |
      for ARCH in x64 arm64; do
        npm cache add \
        --force \
        --cache "${NPM_CACHE}" \
        "@esbuild/freebsd-${ARCH}"
      done
    - echo "  ✓ yao-pkg cached"

  capture_lockfiles_script:
    - echo "--- Capturing lockfiles (server/* only) ---"
    - mkdir -p src/lockfiles
    - |
      lockfile_count=0
      while IFS= read -r server_dir; do
        if [ -f "${server_dir}/package-lock.json" ]; then
          rel_path="${server_dir#src/}"
          target_dir="src/lockfiles/${rel_path}"
          mkdir -p "${target_dir}"
          cp "${server_dir}/package-lock.json" "${target_dir}/package-lock.json"
          lockfile_count=$((lockfile_count + 1))
          echo "  Saved: ${rel_path}/package-lock.json"
        fi
      done < /tmp/shrinkwrap-dirs.txt

      echo "  Total lockfiles captured: ${lockfile_count}"
      echo "  sdkjs/build retains its shrinkwrap"

  generate_pkg_fetch_patch_script:
    - echo "--- Generating pkg-fetch FreeBSD node patch ---"
    - mkdir -p /tmp/patch-workspace
    - cd /tmp/patch-workspace

    - npm install --cache "${NPM_CACHE}" patch-package
    - npm install --cache "${NPM_CACHE}" "@yao-pkg/pkg@${YAO_PKG_VER}"

    - PKG_FETCH_VERSION=$(grep '"@yao-pkg/pkg-fetch"' node_modules/@yao-pkg/pkg/package.json | cut -d'"' -f4 | sed 's/\^//')
    - echo "  pkg-fetch version: ${PKG_FETCH_VERSION}"

    - NODE_MAJOR=$(echo "${NODE_VERSION}" | cut -d'.' -f1)

    - mkdir -p freebsd-patches
    - |
      set -e
      echo "  Cloning FreeBSD ports tree (shallow)..."
      git clone --depth 1 https://github.com/freebsd/freebsd-ports.git /tmp/freebsd-ports

      NODE_PORT_DIR="/tmp/freebsd-ports/www/node${NODE_MAJOR}/files"
      if [ ! -d "${NODE_PORT_DIR}" ]; then
        echo "ERROR: node${NODE_MAJOR} port directory not found"
        exit 1
      fi

      patch_count=0
      for patch_file in ${NODE_PORT_DIR}/patch-*; do
        if [ -f "${patch_file}" ]; then
          cp "${patch_file}" freebsd-patches/
          patch_count=$((patch_count + 1))
        fi
      done
      echo "  Copied ${patch_count} FreeBSD node${NODE_MAJOR} patches"

      if [ "${patch_count}" -eq 0 ]; then
        echo "ERROR: No FreeBSD node${NODE_MAJOR} patches found"
        exit 1
      fi

    - cd node_modules/@yao-pkg/pkg-fetch/patches
    - |
      for patch_file in /tmp/patch-workspace/freebsd-patches/patch-*; do
        if [ -f "${patch_file}" ]; then
          sed 's#^--- #--- node/#g; s#^+++ #+++ node/#g' "${patch_file}" >> "node.v${NODE_VERSION}.cpp.patch"
        fi
      done

    - cd /tmp/patch-workspace
    - npx patch-package "@yao-pkg/pkg-fetch"

    - cd patches
    - PATCH_FILE=$(ls @yao-pkg+pkg-fetch+*.patch 2>/dev/null | head -1)
      if [ -z "${PATCH_FILE}" ]; then
        echo "ERROR: patch-package produced no output file"
        exit 1
      fi

    - UPSTREAM_URL="https://github.com/yao-pkg/pkg-fetch/raw/refs/tags/v${PKG_FETCH_VERSION}/patches/node.v${NODE_VERSION}.cpp.patch"
    - |
      {
        echo "${UPSTREAM_URL}"
        echo "+ local FreeBSD patches"
        grep -v '^diff --git\|^index ' "${PATCH_FILE}" | \
          sed 's#^--- a/node_modules#--- yao-pkg/node_modules#g; s#^+++ b/node_modules#+++ yao-pkg/node_modules#g'
      } > "${CIRRUS_WORKING_DIR}/extra-patch-pkg-fetch_patches_node.v${NODE_VERSION}.cpp.patch"

    - cd "${CIRRUS_WORKING_DIR}"
    - echo "--- Patch generated: $(wc -l < extra-patch-pkg-fetch_patches_node.v${NODE_VERSION}.cpp.patch) lines ---"

  smoke_test_script:
    - echo "--- Smoke-testing cache offline ---"
    - |
      # Mirror phase 1+2a flags (no --omit=dev)
      PINNED_AND_UPSTREAM="
      src/sdkjs/build
      src/web-apps/build
      src/web-apps/vendor/framework7-react
      src/server
      src/server/Common
      src/server/DocService
      src/server/FileConverter
      src/document-server-package/common/documentserver/home/npm
      "

      success=0
      failed=0

      for npm_dir in ${PINNED_AND_UPSTREAM}; do
        if [ -f "${npm_dir}/package.json" ]; then
          rm -rf "${npm_dir}/node_modules"
          if npm install --offline --cache "${NPM_CACHE}" --ignore-scripts \
              --prefix "${npm_dir}" "${npm_dir}" >/dev/null 2>&1; then
            success=$((success + 1))
          else
            echo "  ✗ FAILED: ${npm_dir#src/}"
            failed=$((failed + 1))
          fi
        fi
      done

      # Phase 2b — mirror --omit=dev
      INTEGRATION_DIR="src/document-server-integration/web/documentserver-example/nodejs"
      rm -rf "${INTEGRATION_DIR}/node_modules"
      if npm install --offline --cache "${NPM_CACHE}" --ignore-scripts \
          --omit=dev --prefix "${INTEGRATION_DIR}" "${INTEGRATION_DIR}" >/dev/null 2>&1; then
        success=$((success + 1))
      else
        echo "  ✗ FAILED: document-server-integration/nodejs"
        failed=$((failed + 1))
      fi


      # Phase 2c — metrics run with npm ci
      METRICS_DIR="src/server/Metrics"
      rm -rf "${METRICS_DIR}/node_modules"
      if npm install --offline --cache "${NPM_CACHE}" --ignore-scripts \
          --prefix "${METRICS_DIR}" "${METRICS_DIR}" >/dev/null 2>&1; then
        success=$((success + 1))
      else
        echo "  ✗ FAILED: server/Metrics"
        failed=$((failed + 1))
      fi

      # Phase 4 — yao-pkg
      rm -rf src/yao-pkg/node_modules
      if npm install --offline --cache "${NPM_CACHE}" --ignore-scripts \
          --prefix src/yao-pkg "@yao-pkg/pkg@${YAO_PKG_VER}" >/dev/null 2>&1; then
        success=$((success + 1))
      else
        echo "  ✗ FAILED: yao-pkg"
        failed=$((failed + 1))
      fi

      echo ""
      echo "--- Smoke-test results ---"
      echo "  Success: ${success}"
      echo "  Failed:  ${failed}"

      if [ ${failed} -gt 0 ]; then
        echo ""
        echo "ERROR: ${failed} directories failed offline install"
        exit 1
      fi

      echo "--- All directories passed offline test ---"

  report_script:
    - echo "========================================"
    - echo "FINAL CACHE STATISTICS"
    - echo "========================================"
    - |
      file_count=$(find "${NPM_CACHE}/_cacache" -type f | wc -l)
      echo "  Total cached files : ${file_count}"
    - |
      cache_size=$(du -sh "${NPM_CACHE}/_cacache" | awk '{print $1}')
      echo "  Total cache size   : ${cache_size}"
    - |
      lockfile_count=$(find src/lockfiles -name package-lock.json 2>/dev/null | wc -l)
      echo "  Lockfiles captured : ${lockfile_count} (server/* only)"
    - echo ""
    - echo "Install order:"
    - echo "  1. sdkjs/build, vendor/framework7-react (shrinkwrap pinned — baseline)"
    - echo "  2a. server/*, web-apps/build, home/npm  (upstream, full deps)"
    - echo "  2b. document-server-integration         (upstream, --omit=dev)"
    - echo "  3. Port-specific deps    (grunt, sharp, optipng, etc.)"
    - echo "  4. yao-pkg               (self-contained)"

  commit_script:
    - DATE=$(date -u +%Y%m%d%H%M)
    - NEW_TAG="${DS_TAG}-${DATE}"
    - echo "Committing as tag ${NEW_TAG}"

    - rm -rf "${NPM_CACHE}/_logs"
    - rm -rf "${NPM_CACHE}/_update-notifier-last-checked"

    - rm -rf _cacache lockfiles
    - cp -r "${NPM_CACHE}/_cacache" _cacache
    - cp -r "src/lockfiles" lockfiles
    - cp src/yao-pkg/package.json      yao-pkg-package.json
    - cp src/yao-pkg/package-lock.json yao-pkg-package-lock.json

    - git add _cacache lockfiles/ yao-pkg-package.json yao-pkg-package-lock.json "extra-patch-pkg-fetch_patches_node.v${NODE_VERSION}.cpp.patch"
    - git commit -m "npm cache for OnlyOffice DS ${DS_TAG} (${DATE})"
    - git tag "${NEW_TAG}" -m "OnlyOffice DS ${DS_TAG} npm cache (${DATE})"
    - git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${CIRRUS_REPO_FULL_NAME}.git" HEAD --tags
    - echo ""
    - echo "✓ Pushed tag ${NEW_TAG}"
    - echo "Update GH_TUPLE to:"
    - echo "  fsbruva:onlyoffice-DS-npm-cache:${NEW_TAG}:npm_cache"
