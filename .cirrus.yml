# .cirrus.yml
#
# Builds the OnlyOffice DocumentServer npm _cacache on a real FreeBSD VM,
# then commits the result to this repository with a version tag.
#
# KEY DIFFERENCE FROM UPSTREAM SOURCES:
#   This build applies FreeBSD port patches BEFORE caching, ensuring the
#   cached dependency tree matches what poudriere will build offline.
#
# SETUP (one-time):
#   1. Create a GitHub Personal Access Token with 'repo' scope at:
#      https://github.com/settings/tokens
#   2. Store it as an encrypted variable named GITHUB_TOKEN in the Cirrus CI
#      repository settings at:
#      https://cirrus-ci.com/github/fsbruva/onlyoffice-DS-npm-cache
#   3. Replace the ENCRYPTED[...] placeholder below with the value Cirrus
#      gives you after encrypting the token.
#
# TRIGGERING:
#   - Go to https://cirrus-ci.com/github/fsbruva/onlyoffice-DS-npm-cache
#   - Find the "Build npm Cache" task and click the manual trigger button.
#   - To override version variables for a new release, set them temporarily
#     in the repository's environment variable overrides in the Cirrus CI UI
#     before triggering.
#
# VERSION VARIABLES:
#   Update the defaults below when the port's version variables change.
#   All of these can also be overridden per-run in the Cirrus CI web UI
#   without editing this file.

env:
  # --- Port version variables ---
  # Keep these in sync with the port Makefile.
  DS_VERSION:          "9.2.1"
  DS_BUILD:            "8"
  NODE_VERSION:        "20.20.0"   # PKGFETCH_NODE_VERSION
  SHARP_VER:           "0.32.6"    # DS_SHARP_VER
  MODERN_SYSLOG_VER:   "1.2.0"    # DS_MODERN_SYSLOG_VER
  YAO_PKG_VER:         "6.14.1"    # @yao-pkg/pkg version

  # --- Cirrus CI / GitHub config ---
  GITHUB_TOKEN: ENCRYPTED[cb63ddb701139b4dac8e4493476ef1ae09fa0078c69f2c153d968d93106a48a2263a08a5337848cc5d2641531b40e2fc]

  # Derived — do not edit
  DS_TAG: "v${DS_VERSION}.${DS_BUILD}"
  NPM_CACHE: "/tmp/npm-cache"
  
  # FreeBSD ports tree base URL
  PORTS_BASE: "https://cgit.freebsd.org/ports/plain/www/onlyoffice-documentserver"

build_npm_cache_task:
  name: "Build npm Cache"

  # Only trigger manually from the Cirrus CI web UI — never on push/PR.
  trigger_type: manual

  # Real FreeBSD VM on Google Compute Engine.
  # Matches the FreeBSD major version your poudriere jail uses.
  freebsd_instance:
    image_family: freebsd-14-3
    cpu: 4
    memory: 8GB
    disk: 50

  # 60 minutes is ample; hard limit for free tier is 120 minutes.
  timeout_in: 60m

  # ------------------------------------------------------------------ #
  #  1. Install dependencies                                             #
  # ------------------------------------------------------------------ #
  install_script:
    - pkg install -y npm-node20 git
    - node --version
    - npm --version

  # ------------------------------------------------------------------ #
  #  2. Clone this repo (with credentials so we can push back later)   #
  # ------------------------------------------------------------------ #
  clone_script:
    - git clone
        --depth 1
        "https://x-access-token:${GITHUB_TOKEN}@github.com/${CIRRUS_REPO_FULL_NAME}.git"
        "${CIRRUS_WORKING_DIR}"
    - git config user.name  "cirrus-ci[bot]"
    - git config user.email "cirrus-ci[bot]@users.noreply.github.com"

  # ------------------------------------------------------------------ #
  #  3. Clone ONLYOFFICE source repos at the release tag               #
  # ------------------------------------------------------------------ #
  clone_sources_script:
    - echo "Building cache for DS_TAG=${DS_TAG}"
    - git clone --depth 1 --branch "${DS_TAG}" --single-branch
        https://github.com/ONLYOFFICE/web-apps.git src/web-apps
    - git clone --depth 1 --branch "${DS_TAG}" --single-branch
        https://github.com/ONLYOFFICE/server.git src/server
    - git clone --depth 1 --branch "${DS_TAG}" --single-branch
        https://github.com/ONLYOFFICE/sdkjs.git src/sdkjs
    - echo "=== web-apps ===" && git -C src/web-apps describe --tags
    - echo "=== server    ===" && git -C src/server  describe --tags
    - echo "=== sdkjs     ===" && git -C src/sdkjs   describe --tags

  # ------------------------------------------------------------------ #
  #  4. Fetch and apply FreeBSD port patches                            #
  #     These patches modify package.json files to add/change deps,    #
  #     so they MUST be applied before caching to ensure the cache     #
  #     contains the exact dependency tree poudriere will need.        #
  # ------------------------------------------------------------------ #
  apply_patches_script:
    - echo "--- Fetching FreeBSD port patches ---"
    - mkdir -p patches
    # Fetch all patch-*_package.json files
    - fetch -o patches/patch-server_package.json "${PORTS_BASE}/files/patch-server_package.json" || echo "WARN: patch-server_package.json not found"
    - fetch -o patches/patch-web-apps_build_package.json "${PORTS_BASE}/files/patch-web-apps_build_package.json" || echo "WARN: patch-web-apps_build_package.json not found"
    - echo "--- Applying patches ---"
    # Apply patches (suppress errors for missing patches)
    - if [ -f patches/patch-server_package.json ]; then
        patch -p0 -d src < patches/patch-server_package.json && echo "  Applied server package.json patch";
      fi
    - if [ -f patches/patch-web-apps_build_package.json ]; then
        patch -p0 -d src < patches/patch-web-apps_build_package.json && echo "  Applied web-apps/build package.json patch";
      fi
    # Verify patches were applied
    - echo "--- Verifying patched dependencies ---"
    - grep -q '"patch-package"' src/web-apps/build/package.json && echo "  ✓ patch-package in web-apps/build" || echo "  ✗ patch-package NOT in web-apps/build"
    - grep -q '"concurrently"' src/server/package.json && echo "  ✓ concurrently in server" || echo "  ✗ concurrently NOT in server"

  # ------------------------------------------------------------------ #
  #  5. Delete npm-shrinkwrap.json files                                #
  #     These files pin exact resolved URLs and prevent packument       #
  #     caching. Must be deleted to force full registry resolution.    #
  # ------------------------------------------------------------------ #
  delete_shrinkwrap_script:
    - echo "--- Deleting npm-shrinkwrap.json files ---"
    - find src -type f -name npm-shrinkwrap.json -delete

  # ------------------------------------------------------------------ #
  #  6. Create yao-pkg workspace                                        #
  # ------------------------------------------------------------------ #
  create_yao_pkg_script:
    - mkdir -p src/yao-pkg
    - |
      cat > src/yao-pkg/package.json << 'EOF'
      {
        "name": "yao-pkg-cache-seed",
        "version": "1.0.0",
        "private": true,
        "dependencies": {}
      }
      EOF

  # ------------------------------------------------------------------ #
  #  7. Phase 1 — cache full patched package.json trees                #
  #     Now that patches are applied, this caches the complete         #
  #     dependency tree that poudriere will need.                      #
  # ------------------------------------------------------------------ #
  populate_existing_deps_script:
    - echo "--- Phase 1: caching patched package.json trees ---"
    # web-apps/build (now includes patch-package, optipng-bin from patch)
    - npm install --cache "${NPM_CACHE}" --ignore-scripts
        --prefix src/web-apps/build src/web-apps/build
    # server (now includes grunt, grunt-cli, concurrently from patch)
    - npm install --cache "${NPM_CACHE}" --ignore-scripts
        --prefix src/server src/server
    # server/DocService
    - npm install --cache "${NPM_CACHE}" --ignore-scripts
        --prefix src/server/DocService src/server/DocService
    # server/Metrics
    - npm install --cache "${NPM_CACHE}" --ignore-scripts
        --prefix src/server/Metrics src/server/Metrics
    # sdkjs
    - npm install --cache "${NPM_CACHE}" --ignore-scripts
        --prefix src/sdkjs/build src/sdkjs/build

  # ------------------------------------------------------------------ #
  #  8. Phase 2 — port-specific installs (mirrors port do-build)       #
  #     These should now be cache hits since Phase 1 included them.    #
  # ------------------------------------------------------------------ #
  populate_port_deps_script:
    - echo "--- Phase 2: port-specific installs ---"
    # web-apps/build - patch-package should already be cached from Phase 1
    - npm install --cache "${NPM_CACHE}" --prefix src/web-apps/build patch-package
    - npm install --cache "${NPM_CACHE}" --ignore-scripts
        --prefix src/web-apps/build optipng-bin@5.1.0
    # server - grunt-cli, grunt should already be cached from Phase 1
    - npm install --cache "${NPM_CACHE}" --prefix src/server grunt-cli
    - npm install --cache "${NPM_CACHE}" --prefix src/server grunt
    # server/DocService
    - npm install --cache "${NPM_CACHE}" --ignore-scripts
        --prefix src/server/DocService "sharp@${SHARP_VER}"
    - npm install --cache "${NPM_CACHE}"
        --prefix src/server/DocService patch-package
    # server/Metrics
    - npm install --cache "${NPM_CACHE}" --ignore-scripts
        --prefix src/server/Metrics "modern-syslog@${MODERN_SYSLOG_VER}"
    - npm install --cache "${NPM_CACHE}"
        --prefix src/server/Metrics patch-package
    # sdkjs
    - npm install --cache "${NPM_CACHE}" --prefix src/sdkjs grunt-cli
    - npm install --cache "${NPM_CACHE}" --prefix src/sdkjs grunt
    # yao-pkg
    - npm install --cache "${NPM_CACHE}"
        --prefix src/yao-pkg "@yao-pkg/pkg@${YAO_PKG_VER}"

  # ------------------------------------------------------------------ #
  #  9. Offline smoke-test                                              #
  #     Validates cache completeness using --offline flag.             #
  # ------------------------------------------------------------------ #
  smoke_test_script:
    - echo "--- Smoke-testing cache offline ---"
    # web-apps/build
    - npm install --offline --cache "${NPM_CACHE}"
        --prefix src/web-apps/build src/web-apps/build
    - npm install --offline --cache "${NPM_CACHE}"
        --prefix src/web-apps/build patch-package
    - npm install --offline --cache "${NPM_CACHE}" --ignore-scripts
        --prefix src/web-apps/build optipng-bin@5.1.0
    # server
    - npm install --offline --cache "${NPM_CACHE}"
        --prefix src/server src/server
    - npm install --offline --cache "${NPM_CACHE}" --prefix src/server grunt-cli
    - npm install --offline --cache "${NPM_CACHE}" --prefix src/server grunt
    # server/DocService
    - npm install --offline --cache "${NPM_CACHE}"
        --prefix src/server/DocService src/server/DocService
    - npm install --offline --cache "${NPM_CACHE}" --ignore-scripts
        --prefix src/server/DocService "sharp@${SHARP_VER}"
    - npm install --offline --cache "${NPM_CACHE}"
        --prefix src/server/DocService patch-package
    # server/Metrics
    - npm install --offline --cache "${NPM_CACHE}"
        --prefix src/server/Metrics src/server/Metrics
    - npm install --offline --cache "${NPM_CACHE}" --ignore-scripts
        --prefix src/server/Metrics "modern-syslog@${MODERN_SYSLOG_VER}"
    - npm install --offline --cache "${NPM_CACHE}"
        --prefix src/server/Metrics patch-package
    # sdkjs
    - npm install --offline --cache "${NPM_CACHE}"
        --prefix src/sdkjs/build src/sdkjs/build
    - npm install --offline --cache "${NPM_CACHE}" --prefix src/sdkjs grunt-cli
    - npm install --offline --cache "${NPM_CACHE}" --prefix src/sdkjs grunt
    # yao-pkg
    - rm -rf src/yao-pkg/node_modules
    - npm install --offline --cache "${NPM_CACHE}"
        --prefix src/yao-pkg "@yao-pkg/pkg@${YAO_PKG_VER}"
    - echo "--- Smoke-test passed ---"

  # ------------------------------------------------------------------ #
  #  10. Report cache size                                              #
  # ------------------------------------------------------------------ #
  report_script:
    - echo "--- Cache stats ---"
    - find "${NPM_CACHE}/_cacache" -type f | wc -l | xargs echo "Total files:"
    - du -sh "${NPM_CACHE}/_cacache"

  # ------------------------------------------------------------------ #
  #  11. Commit and tag                                                 #
  # ------------------------------------------------------------------ #
  commit_script:
    - DATE=$(date -u +%Y%m%d)
    - NEW_TAG="${DS_TAG}-${DATE}_CI2"
    - echo "Committing as tag ${NEW_TAG}"
    # Clean transient artefacts
    - rm -rf "${NPM_CACHE}/_logs"
    - rm -rf "${NPM_CACHE}/_update-notifier-last-checked"
    # Replace _cacache in working tree
    - rm -rf _cacache
    - cp -r "${NPM_CACHE}/_cacache" _cacache
    # Capture yao-pkg manifests
    - cp src/yao-pkg/package.json      yao-pkg-package.json
    - cp src/yao-pkg/package-lock.json yao-pkg-package-lock.json
    # Commit
    - git add _cacache yao-pkg-package.json yao-pkg-package-lock.json
    - git commit -m "npm cache for OnlyOffice DS ${DS_TAG} (${DATE}) with FreeBSD patches applied"
    # Tag
    - git tag "${NEW_TAG}" -m "OnlyOffice DS ${DS_TAG} npm cache (${DATE}) - patched"
    - git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${CIRRUS_REPO_FULL_NAME}.git"
        HEAD --tags
    - echo "Pushed tag ${NEW_TAG}"
    - echo "Update your port GH_TUPLE line to:"
    - echo "  fsbruva:onlyoffice-DS-npm-cache:${NEW_TAG}:npm_cache"
