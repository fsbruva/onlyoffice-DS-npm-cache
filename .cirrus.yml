# .cirrus.yml
#
# Builds the OnlyOffice DocumentServer npm _cacache on a real FreeBSD VM,
# then commits the result to this repository with a version tag.
#
# DYNAMIC DEPENDENCY DISCOVERY:
#   Automatically finds and caches ALL npm dependencies in the source tree,
#   not just the ones explicitly mentioned in the port Makefile.

env:
  # --- Port version variables ---
  DS_VERSION:          "9.2.1"
  DS_BUILD:            "8"
  NODE_VERSION:        "20.20.0"
  SHARP_VER:           "0.32.6"
  MODERN_SYSLOG_VER:   "1.2.0"
  YAO_PKG_VER:         "6.14.1"

  # --- Cirrus CI / GitHub config ---
  GITHUB_TOKEN: ENCRYPTED[cb63ddb701139b4dac8e4493476ef1ae09fa0078c69f2c153d968d93106a48a2263a08a5337848cc5d2641531b40e2fc]

  # Derived
  DS_TAG: "v${DS_VERSION}.${DS_BUILD}"
  NPM_CACHE: "/tmp/npm-cache"
  PORTS_BASE: "https://cgit.freebsd.org/ports/plain/www/onlyoffice-documentserver"

build_npm_cache_task:
  name: "Build npm Cache"
  trigger_type: manual

  freebsd_instance:
    image_family: freebsd-14-3
    cpu: 4
    memory: 8GB
    disk: 50

  timeout_in: 60m

  # ------------------------------------------------------------------ #
  #  1. Install dependencies                                           #
  # ------------------------------------------------------------------ #
  install_script:
    - pkg install -y npm-node20 git
    - node --version
    - npm --version

  # ------------------------------------------------------------------ #
  #  2. Clone this repo (with credentials)                             #
  # ------------------------------------------------------------------ #
  clone_script:
    - git clone --depth 1
        "https://x-access-token:${GITHUB_TOKEN}@github.com/${CIRRUS_REPO_FULL_NAME}.git"
        "${CIRRUS_WORKING_DIR}"
    - git config user.name  "cirrus-ci[bot]"
    - git config user.email "cirrus-ci[bot]@users.noreply.github.com"

  # ------------------------------------------------------------------ #
  #  3. Clone ONLYOFFICE source repos                                  #
  # ------------------------------------------------------------------ #
  clone_sources_script:
    - echo "Building cache for DS_TAG=${DS_TAG}"
    - git clone --depth 1 --branch "${DS_TAG}" --single-branch
        https://github.com/ONLYOFFICE/web-apps.git src/web-apps
    - git clone --depth 1 --branch "${DS_TAG}" --single-branch
        https://github.com/ONLYOFFICE/server.git src/server
    - git clone --depth 1 --branch "${DS_TAG}" --single-branch
        https://github.com/ONLYOFFICE/sdkjs.git src/sdkjs
    - echo "=== web-apps ===" && git -C src/web-apps describe --tags
    - echo "=== server    ===" && git -C src/server  describe --tags
    - echo "=== sdkjs     ===" && git -C src/sdkjs   describe --tags

  # ------------------------------------------------------------------ #
  #  4. Fetch and apply FreeBSD port patches                           #
  # ------------------------------------------------------------------ #
  apply_patches_script:
    - echo "--- Fetching FreeBSD port patches ---"
    - mkdir -p patches
    - fetch -o patches/patch-server_package.json "${PORTS_BASE}/files/patch-server_package.json" || echo "WARN: patch not found"
    - fetch -o patches/patch-web-apps_build_package.json "${PORTS_BASE}/files/patch-web-apps_build_package.json" || echo "WARN: patch not found"
    - echo "--- Applying patches ---"
    - if [ -f patches/patch-server_package.json ]; then
        patch -p0 -d src < patches/patch-server_package.json && echo "  Applied server package.json patch";
      fi
    - if [ -f patches/patch-web-apps_build_package.json ]; then
        patch -p0 -d src < patches/patch-web-apps_build_package.json && echo "  Applied web-apps/build package.json patch";
      fi
    - echo "--- Verifying patches ---"
    - grep -q '"patch-package"' src/web-apps/build/package.json && echo "  ✓ patch-package" || echo "  ✗ patch-package"
    - grep -q '"concurrently"' src/server/package.json && echo "  ✓ concurrently" || echo "  ✗ concurrently"

  # ------------------------------------------------------------------ #
  #  5. Delete lockfiles (shrinkwrap and package-lock)                 #
  #     Dynamic approach: find and delete all, excluding certain paths #
  # ------------------------------------------------------------------ #
  delete_lockfiles_script:
    - echo "--- Deleting npm-shrinkwrap.json and package-lock.json files ---"
    - |
      # Delete all shrinkwrap files
      echo "  Shrinkwrap files:"
      find src -type f -name npm-shrinkwrap.json -exec echo "    Deleting: {}" \; -delete

      # Delete package-lock.json files, excluding v8 and other non-build paths
      echo "  Package-lock files:"
      find src -type f -name package-lock.json \
        ! -path "*/v8_89/*" \
        ! -path "*/document-server-integration/*" \
        ! -path "*/document-server-package/*" \
        ! -path "*/perfect-scrollbar/*" \
        -exec echo "    Deleting: {}" \; -delete

    - echo "  Verification (should show nothing):"
    - find src -type f \( -name npm-shrinkwrap.json -o -name package-lock.json \) \
        ! -path "*/v8_89/*" || echo "    All lockfiles removed"

  # ------------------------------------------------------------------ #
  #  6. Dynamically discover all npm package directories               #
  #     Ensures we don't miss any dependencies                         #
  # ------------------------------------------------------------------ #
  discover_npm_dirs_script:
    - echo "--- Discovering all npm package directories ---"
    - |
      # Find all package.json files, excluding paths we don't build:
      # - v8_89: V8 engine internals (don't need npm deps)
      # - document-server-integration: Just examples
      # - document-server-package: Build output directory
      # - onlyoffice.github.io: Handled separately as sdkjs-plugins
      # - perfect-scrollbar does not have a platform option for freebsd

      find src -type f -name package.json \
        ! -path "*/v8_89/*" \
        ! -path "*/document-server-integration/*" \
        ! -path "*/document-server-package/*" \
        ! -path "*/onlyoffice.github.io/*" \
        ! -path "*/perfect-scrollbar/*" \
        -exec dirname {} \; | sort -u > /tmp/npm-dirs.txt

      echo "  Found $(wc -l < /tmp/npm-dirs.txt) npm directories:"
      cat /tmp/npm-dirs.txt | sed 's|^src/|    |'

  # ------------------------------------------------------------------ #
  #  7. Create yao-pkg workspace                                       #
  # ------------------------------------------------------------------ #
  create_yao_pkg_script:
    - mkdir -p src/yao-pkg
    - |
      cat > src/yao-pkg/package.json << 'EOF'
      {
        "name": "yao-pkg-cache-seed",
        "version": "1.0.0",
        "private": true,
        "dependencies": {}
      }
      EOF
    - echo "src/yao-pkg" >> /tmp/npm-dirs.txt

  # ------------------------------------------------------------------ #
  #  8. Phase 1 — cache ALL discovered npm dependency trees            #
  #     Processes every directory with a package.json file             #
  # ------------------------------------------------------------------ #
  populate_all_deps_script:
    - echo "--- Phase 1: caching all npm dependency trees ---"
    - echo "  Processing $(wc -l < /tmp/npm-dirs.txt) directories..."
    - |
      SUCCESS_COUNT=0
      FAIL_COUNT=0

      while IFS= read -r npm_dir; do
        if [ -f "${npm_dir}/package.json" ]; then
          echo ""
          echo "  [$(expr ${SUCCESS_COUNT} + ${FAIL_COUNT} + 1)/$(wc -l < /tmp/npm-dirs.txt)] ${npm_dir#src/}"

          if npm install --cache "${NPM_CACHE}" --ignore-scripts --prefix "${npm_dir}" "${npm_dir}" 2>&1 | grep -v "^npm warn"; then
            SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
          else
            echo "    ⚠ Warning: npm install failed, continuing..."
            FAIL_COUNT=$((FAIL_COUNT + 1))
          fi
        fi
      done < /tmp/npm-dirs.txt

      echo ""
      echo "--- Phase 1 summary ---"
      echo "  Success: ${SUCCESS_COUNT}"
      echo "  Failures: ${FAIL_COUNT}"
      echo "  Total: $(expr ${SUCCESS_COUNT} + ${FAIL_COUNT})"

  # ------------------------------------------------------------------ #
  #  9. Phase 2 — port-specific installs (explicit versions)           #
  #     These may duplicate Phase 1, but ensure specific versions      #
  # ------------------------------------------------------------------ #
  populate_port_deps_script:
    - echo "--- Phase 2: port-specific dependency versions ---"
    # web-apps/build
    - echo "  web-apps/build extras..."
    - npm install --cache "${NPM_CACHE}" --prefix src/web-apps/build patch-package
    - npm install --cache "${NPM_CACHE}" --ignore-scripts
        --prefix src/web-apps/build optipng-bin@5.1.0
    # server
    - echo "  server extras..."
    - npm install --cache "${NPM_CACHE}" --prefix src/server grunt-cli
    - npm install --cache "${NPM_CACHE}" --prefix src/server grunt
    # server/DocService
    - echo "  server/DocService extras..."
    - npm install --cache "${NPM_CACHE}" --ignore-scripts
        --prefix src/server/DocService "sharp@${SHARP_VER}"
    - npm install --cache "${NPM_CACHE}"
        --prefix src/server/DocService patch-package
    # server/Metrics
    - echo "  server/Metrics extras..."
    - npm install --cache "${NPM_CACHE}" --ignore-scripts
        --prefix src/server/Metrics "modern-syslog@${MODERN_SYSLOG_VER}"
    - npm install --cache "${NPM_CACHE}"
        --prefix src/server/Metrics patch-package
    # sdkjs/build
    - echo "  sdkjs extras..."
    - npm install --cache "${NPM_CACHE}" --prefix src/sdkjs grunt-cli
    - npm install --cache "${NPM_CACHE}" --prefix src/sdkjs grunt
    # yao-pkg
    - echo "  yao-pkg..."
    - npm install --cache "${NPM_CACHE}"
        --prefix src/yao-pkg "@yao-pkg/pkg@${YAO_PKG_VER}"

  # ------------------------------------------------------------------ #
  #  10. Generate pkg-fetch FreeBSD node patches                       #
  # ------------------------------------------------------------------ #
  generate_pkg_fetch_patch_script:
    - echo "--- Generating pkg-fetch FreeBSD node patch ---"
    - mkdir -p /tmp/patch-workspace
    - cd /tmp/patch-workspace

    # Install dependencies
    - npm install --cache "${NPM_CACHE}" patch-package
    - npm install --cache "${NPM_CACHE}" "@yao-pkg/pkg@${YAO_PKG_VER}"

    # Get pkg-fetch version
    - PKG_FETCH_VERSION=$(cat node_modules/@yao-pkg/pkg/package.json | grep -A1 '"@yao-pkg/pkg-fetch"' | tail -1 | cut -d'"' -f4)
    - echo "  pkg-fetch version: ${PKG_FETCH_VERSION}"

    # Fetch FreeBSD node20 patches (robust, no HTML scraping)
    - echo "  Fetching FreeBSD node20 patches..."
    - mkdir -p freebsd-patches
    - |
      set -e

      echo "  Cloning FreeBSD ports tree (shallow)..."
      git clone --depth 1 https://github.com/freebsd/freebsd-ports.git /tmp/freebsd-ports

      NODE_PORT_DIR="/tmp/freebsd-ports/www/node20/files"

      if [ ! -d "${NODE_PORT_DIR}" ]; then
        echo "ERROR: node20 port directory not found"
        exit 1
      fi

      patch_count=0

      for patch_file in ${NODE_PORT_DIR}/patch-*; do
        if [ -f "${patch_file}" ]; then
          cp "${patch_file}" freebsd-patches/
          patch_count=$((patch_count + 1))
        fi
      done

      echo "  Downloaded ${patch_count} FreeBSD patches"

      if [ "${patch_count}" -eq 0 ]; then
        echo "ERROR: No FreeBSD node20 patches found"
        exit 1
      fi

    # Backup and modify pkg-fetch patch
    - cd node_modules/@yao-pkg/pkg-fetch/patches
    - cp "node.v${NODE_VERSION}.cpp.patch" "node.v${NODE_VERSION}.cpp.patch.orig"

    # Append FreeBSD patches with modified paths
    - echo "  Appending FreeBSD patches to pkg-fetch node patch..."
    - |
      for patch_file in /tmp/patch-workspace/freebsd-patches/patch-*; do
        if [ -f "${patch_file}" ]; then
          sed 's#^--- #--- node/#g; s#^+++ #+++ node/#g' "${patch_file}" >> "node.v${NODE_VERSION}.cpp.patch"
        fi
      done

    # Generate patch-package diff
    - cd /tmp/patch-workspace
    - echo "  Generating patch-package diff..."
    - npx patch-package "@yao-pkg/pkg-fetch"

    # Process and save
    - cd patches
    - PATCH_FILE=$(ls @yao-pkg+pkg-fetch+*.patch 2>/dev/null | head -1)
    - UPSTREAM_URL="https://github.com/yao-pkg/pkg-fetch/raw/v${PKG_FETCH_VERSION}/patches/node.v${NODE_VERSION}.cpp.patch"
    - |
      {
        echo "${UPSTREAM_URL}"
        echo "+ local FreeBSD patches"
        grep -v '^diff --git' "${PATCH_FILE}" | \
          sed 's#^--- a/node_modules#--- yao-pkg/node_modules#g; s#^+++ b/node_modules#+++ yao-pkg/node_modules#g'
      } > "${CIRRUS_WORKING_DIR}/extra-patch-pkg-fetch_patches_node.v${NODE_VERSION}.cpp.patch"

    # Verify
    - cd "${CIRRUS_WORKING_DIR}"
    - echo "--- Patch generated: $(wc -l < extra-patch-pkg-fetch_patches_node.v${NODE_VERSION}.cpp.patch) lines ---"

  # ------------------------------------------------------------------ #
  #  11. Offline smoke-test on ALL discovered directories              #
  #      Validates cache completeness                                  #
  # ------------------------------------------------------------------ #
  smoke_test_script:
    - echo "--- Smoke-testing cache offline ---"
    - echo "  Testing $(wc -l < /tmp/npm-dirs.txt) directories..."
    - |
      SUCCESS_COUNT=0
      FAIL_COUNT=0

      while IFS= read -r npm_dir; do
        if [ -f "${npm_dir}/package.json" ]; then
          # Remove node_modules to force fresh install from cache
          rm -rf "${npm_dir}/node_modules"

          if npm install --ignore-scripts --offline --cache "${NPM_CACHE}" --prefix "${npm_dir}" "${npm_dir}" >/dev/null 2>&1; then
            SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
          else
            echo "  ✗ FAILED: ${npm_dir#src/}"
            FAIL_COUNT=$((FAIL_COUNT + 1))
          fi
        fi
      done < /tmp/npm-dirs.txt

      echo ""
      echo "--- Smoke-test results ---"
      echo "  Success: ${SUCCESS_COUNT}"
      echo "  Failures: ${FAIL_COUNT}"

      if [ ${FAIL_COUNT} -gt 0 ]; then
        echo ""
        echo "ERROR: ${FAIL_COUNT} directories failed offline install"
        echo "Cache is incomplete - build will fail"
        exit 1
      fi

      echo "--- All directories passed offline test ---"

  # ------------------------------------------------------------------ #
  #  12. Report cache size                                             #
  # ------------------------------------------------------------------ #
  report_script:
    - echo "--- Cache statistics ---"
    - |
      file_count=$(find "${NPM_CACHE}/_cacache" -type f | wc -l)
      echo "  Total files: ${file_count}"
    - |
      cache_size=$(du -sh "${NPM_CACHE}/_cacache" | awk '{print $1}')
      echo "  Total size: ${cache_size}"
    - |
      dir_count=$(wc -l < /tmp/npm-dirs.txt)
      echo "  Directories cached: ${dir_count}"

  # ------------------------------------------------------------------ #
  #  13. Commit and tag                                                #
  # ------------------------------------------------------------------ #
  commit_script:
    - DATE=$(date -u +%Y%m%d)
    - NEW_TAG="${DS_TAG}-${DATE}"
    - echo "Committing as tag ${NEW_TAG}"

    # Clean transient artifacts
    - rm -rf "${NPM_CACHE}/_logs"
    - rm -rf "${NPM_CACHE}/_update-notifier-last-checked"

    # Copy artifacts to working tree
    - rm -rf _cacache
    - cp -r "${NPM_CACHE}/_cacache" _cacache
    - cp src/yao-pkg/package.json      yao-pkg-package.json
    - cp src/yao-pkg/package-lock.json yao-pkg-package-lock.json

    # Commit
    - git add _cacache yao-pkg-package.json yao-pkg-package-lock.json "extra-patch-pkg-fetch_patches_node.v${NODE_VERSION}.cpp.patch"
    - git commit -m "npm cache + pkg-fetch patch for OnlyOffice DS ${DS_TAG} (${DATE})"
    - git tag "${NEW_TAG}" -m "OnlyOffice DS ${DS_TAG} complete npm cache + FreeBSD patches (${DATE})"
    - git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${CIRRUS_REPO_FULL_NAME}.git" HEAD --tags

    - echo ""
    - echo "✓ Successfully pushed tag ${NEW_TAG}"
    - echo ""
    - echo "Update your port GH_TUPLE to:"
    - echo "  fsbruva:onlyoffice-DS-npm-cache:${NEW_TAG}:npm_cache"
